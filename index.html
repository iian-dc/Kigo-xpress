<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Moto Kigo Xpress</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
padding:0;
font-family:
-apple-system,
BlinkMacSystemFont,
"Segoe UI",
Roboto,
Arial,
sans-serif;
background:#f3f4f6;
color:#202124;
}

.app{
width:100%;
max-width:600px;
margin:auto;
background:#fff;
min-height:100vh;
}

.map-container{
position:relative;
}

#map{
width:100%;
height:55vh;
min-height:350px;
}

.map-message{
position:absolute;
top:15px;
left:50%;
transform:translateX(-50%);
z-index:999;
background:#fff;
padding:10px 16px;
border-radius:22px;
box-shadow:0 3px 12px rgba(0,0,0,.16);
font-size:12px;
font-weight:600;
color:#333;
white-space:nowrap;
}

.panel{
background:#fff;
padding:18px;
border-radius:24px 24px 0 0;
margin-top:-22px;
position:relative;
z-index:1000;
box-shadow:0 -4px 20px rgba(0,0,0,.12);
}

.title{
font-size:22px;
font-weight:700;
letter-spacing:-.3px;
margin-bottom:6px;
color:#171717;
}

.subtitle{
font-size:13px;
color:#777;
margin-bottom:17px;
line-height:19px;
}

.step{
padding:14px;
border-radius:14px;
background:#f7f7f8;
margin-bottom:11px;
position:relative;
border:1px solid #eeeeef;
}

.step-title{
font-size:11px;
color:#666;
margin-bottom:8px;
font-weight:700;
letter-spacing:.5px;
}

.input-wrapper{
position:relative;
}

.colonia-input{
width:100%;
border:1px solid #dedede;
background:#fff;
padding:14px;
border-radius:11px;
font-size:14px;
font-weight:600;
outline:none;
color:#222;
transition:.2s;
}

.colonia-input:focus{
border-color:#ef4444;
box-shadow:
0 0 0 3px rgba(239,68,68,.14);
}

.colonia-input::placeholder{
color:#aaa;
font-weight:400;
}

.suggestions{
position:absolute;
left:0;
right:0;
top:calc(100% + 5px);
background:#fff;
border:1px solid #ddd;
border-radius:12px;
box-shadow:0 5px 18px rgba(0,0,0,.18);
z-index:5000;
overflow:hidden;
display:none;
max-height:240px;
overflow-y:auto;
}

.suggestions.show{
display:block;
}

.suggestion{
padding:13px;
border-bottom:1px solid #eee;
font-size:13px;
font-weight:600;
background:#fff;
cursor:pointer;
}

.suggestion:last-child{
border-bottom:none;
}

.suggestion:active{
background:#fee2e2;
}

.suggestion-name{
font-size:14px;
color:#222;
}

.suggestion-location{
font-size:11px;
color:#888;
margin-top:3px;
font-weight:400;
}

.suggestion-loading{
padding:13px;
font-size:12px;
color:#777;
text-align:center;
}

.suggestion-empty{
padding:13px;
font-size:12px;
color:#777;
text-align:center;
}

.calculate{
width:100%;
border:1px solid #dc2626;
padding:14px;
border-radius:12px;
margin-top:2px;
background:
linear-gradient(
135deg,
#ef4444,
#dc2626
);
color:#fff;
font-size:14px;
font-weight:700;
letter-spacing:.2px;
box-shadow:
0 4px 10px rgba(220,38,38,.22);
cursor:pointer;
transition:.2s;
}

.calculate:active{
transform:scale(.98);
}

.calculate:disabled{
opacity:.7;
cursor:not-allowed;
}

.info{
display:flex;
gap:8px;
margin-top:11px;
}

.info-box{
flex:1;
background:#f7f7f8;
padding:13px 8px;
border-radius:13px;
text-align:center;
border:1px solid #eeeeef;
}

.info-label{
font-size:10px;
color:#777;
font-weight:600;
letter-spacing:.4px;
}

.info-value{
font-size:16px;
font-weight:700;
margin-top:5px;
color:#222;
}

.price{
margin-top:12px;
padding:16px;
background:#151515;
color:#fff;
border-radius:14px;
display:flex;
justify-content:space-between;
align-items:center;
}

.price-label{
font-size:13px;
font-weight:500;
}

.price-value{
font-size:24px;
font-weight:700;
}

.confirm{
width:100%;
border:none;
padding:16px;
border-radius:14px;
margin-top:14px;
background:
linear-gradient(
135deg,
#22c55e,
#16a34a
);
color:#fff;
font-size:16px;
font-weight:700;
letter-spacing:.2px;
box-shadow:
0 4px 10px rgba(22,163,74,.22);
transition:.2s;
}

.confirm:active{
transform:scale(.98);
}

.confirm:disabled{
background:#aaa;
color:#fff;
box-shadow:none;
}

.status{
text-align:center;
font-size:12px;
color:#777;
margin-top:9px;
min-height:18px;
}

.pickup-icon,
.destination-icon{
width:38px;
height:38px;
border-radius:50% 50% 50% 0;
transform:rotate(-45deg);
display:flex;
align-items:center;
justify-content:center;
box-shadow:0 3px 10px rgba(0,0,0,.35);
border:3px solid white;
}

.pickup-icon{
background:#ef4444;
}

.destination-icon{
background:#111;
}

.marker-dot{
width:11px;
height:11px;
background:white;
border-radius:50%;
}

.loading-screen{
position:fixed;
inset:0;
background:rgba(255,255,255,.97);
z-index:99999;
display:none;
align-items:center;
justify-content:center;
flex-direction:column;
text-align:center;
}

.loading-screen.show{
display:flex;
}

.loading-title{
font-size:21px;
font-weight:700;
margin-top:18px;
}

.loading-text{
font-size:13px;
color:#777;
margin-top:7px;
}

.road{
width:260px;
height:7px;
background:#222;
border-radius:10px;
position:relative;
margin-top:45px;
}

.road:before{
content:"";
position:absolute;
left:0;
right:0;
top:2px;
border-top:3px dashed #ef4444;
}

.moto{
position:absolute;
left:-50px;
top:-34px;
font-size:40px;
animation:motoMove 4.5s linear infinite;
}

.loading-dot{
display:flex;
gap:6px;
margin-top:20px;
}

.loading-dot span{
width:7px;
height:7px;
background:#ef4444;
border-radius:50%;
animation:blink 1s infinite;
}

.loading-dot span:nth-child(2){
animation-delay:.2s;
}

.loading-dot span:nth-child(3){
animation-delay:.4s;
}

@keyframes motoMove{

0%{
left:-50px;
transform:scaleX(1);
}

45%{
left:120px;
transform:scaleX(1);
}

50%{
left:120px;
transform:scaleX(-1);
}

95%{
left:-50px;
transform:scaleX(-1);
}

100%{
left:-50px;
transform:scaleX(1);
}

}

@keyframes blink{

0%,100%{
opacity:.25;
}

50%{
opacity:1;
}

}

</style>

</head>

<body>

<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">

<script>

const TARIFA_CENTRO_CENTRO=35;

const TARIFA_BASE=35;

const DISTANCIA_BASE_METROS=750;

const INCREMENTO_POR_TRAMO=5;

const TRAMO_ADICIONAL_METROS=750;

const MINUTOS_ADICIONALES=5;

const NUMERO_WHATSAPP="524182371993";

let pickupLat=null;
let pickupLng=null;

let destinationLat=null;
let destinationLng=null;

let pickupAddress="";
let destinationAddress="";

let pickupNombreColonia="";
let destinationNombreColonia="";

let pickupMarker=null;
let destinationMarker=null;

let routeLayer=null;

let precioServicio=0;

const map=L.map(
"map",
{
zoomControl:false,
attributionControl:true
}
);

L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{
maxZoom:19,
attribution:"© OpenStreetMap"
}
).addTo(map);

map.setView(
[
21.1561,
-100.9333
],
14
);
   const pickupInput=
document.getElementById("pickupInput");

const destinationInput=
document.getElementById("destinationInput");

const pickupSuggestions=
document.getElementById("pickupSuggestions");

const destinationSuggestions=
document.getElementById("destinationSuggestions");

const calculateButton=
document.getElementById("calculateButton");

const confirmButton=
document.getElementById("confirmButton");

const distance=
document.getElementById("distance");

const duration=
document.getElementById("duration");

const price=
document.getElementById("price");

const status=
document.getElementById("status");

const mapMessage=
document.getElementById("mapMessage");


/* =====================================================
   FORMATO DEL NOMBRE DE LA COLONIA
   Primera letra en mayúscula y resto en minúscula
   ===================================================== */

function formatearColonia(texto){

if(!texto){
return "";
}

texto=
texto
.toLowerCase()
.trim();

return texto.replace(
/(^|\s)([a-záéíóúñ])/g,
function(m,espacio,letra){

return espacio+
letra.toUpperCase();

}
);

}


/* =====================================================
   NORMALIZAR TEXTO PARA COMPARACIONES
   ===================================================== */

function normalizarTexto(texto){

return texto
.toLowerCase()
.normalize("NFD")
.replace(
/[\u0300-\u036f]/g,
""
)
.trim();

}


/* =====================================================
   DETECTAR SI ES CENTRO
   ===================================================== */

function esCentro(nombre){

if(!nombre){
return false;
}

const texto=
normalizarTexto(nombre);

return(
texto==="centro"||
texto.includes("centro")
);

}


/* =====================================================
   CALCULAR PRECIO
   ===================================================== */

function calcularPrecioPorDistancia(
kilometros
){

const metros=
kilometros*1000;


/*
   Hasta 750 metros:
   $35
*/

if(
metros<=DISTANCIA_BASE_METROS
){

return TARIFA_BASE;

}


/*
   Después de los primeros
   750 metros se cobra
   $5 por cada 750 metros
   adicionales o fracción.
*/

const metrosAdicionales=
metros-
DISTANCIA_BASE_METROS;

const tramos=
Math.ceil(
metrosAdicionales/
TRAMO_ADICIONAL_METROS
);

return(
TARIFA_BASE+
(
tramos*
INCREMENTO_POR_TRAMO
)
);

}


/* =====================================================
   PRECIO FINAL
   ===================================================== */

function calcularPrecioFinal(
kilometros
){

/*
   Centro → Centro
   siempre cuesta $35
*/

if(
esCentro(
pickupNombreColonia
)&&
esCentro(
destinationNombreColonia
)
){

return TARIFA_CENTRO_CENTRO;

}


/*
   Cualquier otra combinación
   se calcula por distancia.
*/

return calcularPrecioPorDistancia(
kilometros
);

}


/* =====================================================
   ICONO DE RECOGIDA
   ===================================================== */

function crearIconoRecogida(){

return L.divIcon({

className:"",

html:
'<div class="pickup-icon">'+
'<div class="marker-dot"></div>'+
'</div>',

iconSize:[
38,
38
],

iconAnchor:[
19,
38
]

});

}


/* =====================================================
   ICONO DE DESTINO
   ===================================================== */

function crearIconoDestino(){

return L.divIcon({

className:"",

html:
'<div class="destination-icon">'+
'<div class="marker-dot"></div>'+
'</div>',

iconSize:[
38,
38
],

iconAnchor:[
19,
38
]

});

}


/* =====================================================
   COLOCAR MARCADOR DE RECOGIDA
   ===================================================== */

function colocarMarcadorRecogida(){

if(
pickupLat===null||
pickupLng===null
){

return;

}

if(pickupMarker){

map.removeLayer(
pickupMarker
);

}

pickupMarker=
L.marker(
[
pickupLat,
pickupLng
],
{
icon:
crearIconoRecogida()
}
).addTo(map);

pickupMarker.bindPopup(
"<b>Recogida</b><br>"+
formatearColonia(
pickupNombreColonia
)
);

}


/* =====================================================
   COLOCAR MARCADOR DE ENTREGA
   ===================================================== */

function colocarMarcadorEntrega(){

if(
destinationLat===null||
destinationLng===null
){

return;

}

if(destinationMarker){

map.removeLayer(
destinationMarker
);

}

destinationMarker=
L.marker(
[
destinationLat,
destinationLng
],
{
icon:
crearIconoDestino()
}
).addTo(map);

destinationMarker.bindPopup(
"<b>Entrega</b><br>"+
formatearColonia(
destinationNombreColonia
)
);

}


/* =====================================================
   BORRAR RUTA ANTERIOR
   ===================================================== */

function limpiarRuta(){

if(routeLayer){

map.removeLayer(
routeLayer
);

routeLayer=null;

}

}


/* =====================================================
   BUSCAR COLONIAS DE DOLORES HIDALGO
   ===================================================== */

async function buscarColonias(
texto
){

if(
!texto||
texto.trim().length<2
){

return [];

}

const consulta=
encodeURIComponent(
texto+
", Dolores Hidalgo, Guanajuato, Mexico"
);

const url=
"https://nominatim.openstreetmap.org/search"+
"?format=json"+
"&q="+
consulta+
"&limit=10"+
"&countrycodes=mx"+
"&addressdetails=1"+
"&accept-language=es";

try{

const respuesta=
await fetch(url);

const resultados=
await respuesta.json();

return resultados.filter(
function(resultado){

return normalizarTexto(
resultado.display_name||""
).includes(
"dolores hidalgo"
);

}
);

}catch(error){

console.log(
"Error buscando colonias:",
error
);

return [];

}

}


/* =====================================================
   MOSTRAR LISTA DE COLONIAS
   ===================================================== */

function mostrarSugerencias(
contenedor,
resultados,
tipo
){

contenedor.innerHTML="";

if(!resultados.length){

contenedor.innerHTML=
'<div class="suggestion-empty">'+
"No encontramos esa colonia en Dolores Hidalgo."+
"</div>";

contenedor.classList.add(
"show"
);

return;

}

resultados.forEach(
function(resultado){

const elemento=
document.createElement(
"div"
);

elemento.className=
"suggestion";

const nombre=
formatearColonia(
resultado.name||
resultado.display_name.split(",")[0]
);

elemento.innerHTML=
'<div class="suggestion-name">'+
nombre+
"</div>"+
'<div class="suggestion-location">'+
"Dolores Hidalgo, Guanajuato"+
"</div>";

elemento.addEventListener(
"click",
function(){

seleccionarColonia(
resultado,
nombre,
tipo
);

}
);

contenedor.appendChild(
elemento
);

}
);

contenedor.classList.add(
"show"
);

}


/* =====================================================
   SELECCIONAR COLONIA
   ===================================================== */

function seleccionarColonia(
resultado,
nombre,
tipo
){

const lat=
parseFloat(
resultado.lat
);

const lng=
parseFloat(
resultado.lon
);

nombre=
formatearColonia(
nombre
);

if(
tipo==="pickup"
){

pickupNombreColonia=
nombre;

pickupLat=
lat;

pickupLng=
lng;

pickupAddress=
resultado.display_name||
nombre+
", Dolores Hidalgo, Guanajuato";

pickupInput.value=
nombre;

pickupSuggestions.classList.remove(
"show"
);

colocarMarcadorRecogida();

map.setView(
[
lat,
lng
],
15
);

mapMessage.innerText=
"Recogida: "+
nombre;

}else{

destinationNombreColonia=
nombre;

destinationLat=
lat;

destinationLng=
lng;

destinationAddress=
resultado.display_name||
nombre+
", Dolores Hidalgo, Guanajuato";

destinationInput.value=
nombre;

destinationSuggestions.classList.remove(
"show"
);

colocarMarcadorEntrega();

map.setView(
[
lat,
lng
],
15
);

mapMessage.innerText=
"Entrega: "+
nombre;

}

actualizarEstadoSeleccion();

}


/* =====================================================
   ACTUALIZAR ESTADO
   ===================================================== */

function actualizarEstadoSeleccion(){

if(
pickupLat!==null&&
destinationLat!==null
){

mapMessage.innerText=
"Pulsa CALCULAR COTIZACIÓN";

status.innerText=
"Las dos colonias están seleccionadas.";

return;

}

if(
pickupLat!==null
){

mapMessage.innerText=
"Ahora selecciona la colonia de entrega";

status.innerText=
"Selecciona la colonia de entrega.";

return;

}

mapMessage.innerText=
"Selecciona la colonia de recogida";

status.innerText=
"Selecciona la colonia de recogida.";

   }
   /* =====================================================
   PARTE 3 DE 5
   AUTOCOMPLETADO + CÁLCULO DE RUTA
   ===================================================== */


/* =====================================================
   AUTOCOMPLETADO — RECOGIDA
   ===================================================== */

let timerPickup=null;

pickupInput.addEventListener(
"input",
function(){

const texto=
this.value.trim();


/* Limpiar selección anterior */

pickupLat=null;
pickupLng=null;
pickupAddress="";
pickupNombreColonia="";


if(pickupMarker){

map.removeLayer(
pickupMarker
);

pickupMarker=null;

}


limpiarRuta();


distance.innerText="—";

duration.innerText="—";

price.innerText="POR COTIZAR";

precioServicio=0;

confirmButton.disabled=true;


if(timerPickup){

clearTimeout(
timerPickup
);

}


if(texto.length<2){

pickupSuggestions.innerHTML="";

pickupSuggestions.classList.remove(
"show"
);

actualizarEstadoSeleccion();

return;

}


pickupSuggestions.innerHTML=
'<div class="suggestion-loading">'+
"Buscando colonia..."+
"</div>";

pickupSuggestions.classList.add(
"show"
);


timerPickup=
setTimeout(
async function(){

const resultados=
await buscarColonias(
texto
);

mostrarSugerencias(
pickupSuggestions,
resultados,
"pickup"
);

},
350
);

}
);


/* =====================================================
   AUTOCOMPLETADO — ENTREGA
   ===================================================== */

let timerDestination=null;

destinationInput.addEventListener(
"input",
function(){

const texto=
this.value.trim();


/* Limpiar selección anterior */

destinationLat=null;
destinationLng=null;
destinationAddress="";
destinationNombreColonia="";


if(destinationMarker){

map.removeLayer(
destinationMarker
);

destinationMarker=null;

}


limpiarRuta();


distance.innerText="—";

duration.innerText="—";

price.innerText="POR COTIZAR";

precioServicio=0;

confirmButton.disabled=true;


if(timerDestination){

clearTimeout(
timerDestination
);

}


if(texto.length<2){

destinationSuggestions.innerHTML="";

destinationSuggestions.classList.remove(
"show"
);

actualizarEstadoSeleccion();

return;

}


destinationSuggestions.innerHTML=
'<div class="suggestion-loading">'+
"Buscando colonia..."+
"</div>";

destinationSuggestions.classList.add(
"show"
);


timerDestination=
setTimeout(
async function(){

const resultados=
await buscarColonias(
texto
);

mostrarSugerencias(
destinationSuggestions,
resultados,
"destination"
);

},
350
);

}
);


/* =====================================================
   CERRAR SUGERENCIAS
   ===================================================== */

document.addEventListener(
"click",
function(e){

if(
!pickupInput.contains(e.target)&&
!pickupSuggestions.contains(e.target)
){

pickupSuggestions.classList.remove(
"show"
);

}

if(
!destinationInput.contains(e.target)&&
!destinationSuggestions.contains(e.target)
){

destinationSuggestions.classList.remove(
"show"
);

}

}
);


/* =====================================================
   OBTENER RUTA REAL POR CALLES
   ===================================================== */

async function obtenerRutaReal(){

const coordenadas=
pickupLng+
","+
pickupLat+
";"+
destinationLng+
","+
destinationLat;


/*
   OSRM utiliza la red real de calles.
   alternatives=true permite obtener
   diferentes recorridos cuando existen.
*/

const url=
"https://router.project-osrm.org/route/v1/driving/"+
coordenadas+
"?overview=full"+
"&geometries=geojson"+
"&steps=true"+
"&alternatives=true";


const respuesta=
await fetch(
url
);


if(!respuesta.ok){

throw new Error(
"Error de conexión con el servicio de rutas."
);

}


const datos=
await respuesta.json();


if(
datos.code!=="Ok"||
!datos.routes||
!datos.routes.length
){

throw new Error(
"No se encontró una ruta."
);

}


/*
   Ordenamos todas las rutas
   de menor a mayor distancia.
*/

const rutas=
datos.routes.slice().sort(
function(a,b){

return a.distance-
b.distance;

}
);


/*
   La primera será la ruta
   más corta encontrada.
*/

return rutas[0];

}


/* =====================================================
   CALCULAR RUTA
   ===================================================== */

async function calcularRuta(){

if(
pickupLat===null||
pickupLng===null
){

status.innerText=
"Selecciona la colonia de recogida.";

return false;

}


if(
destinationLat===null||
destinationLng===null
){

status.innerText=
"Selecciona la colonia de entrega.";

return false;

}


calculateButton.disabled=true;

calculateButton.innerText=
"CALCULANDO...";

status.innerText=
"Buscando el recorrido por las calles...";


try{


/* =====================================================
   OBTENER RUTA
   ===================================================== */

const ruta=
await obtenerRutaReal();


/* =====================================================
   DISTANCIA REAL
   ===================================================== */

const kilometros=
ruta.distance/
1000;


distance.innerText=
kilometros.toFixed(2)+
" km";


/* =====================================================
   TIEMPO REAL DE LA RUTA
   ===================================================== */

const minutosRuta=
Math.max(
1,
Math.round(
ruta.duration/
60
)
);


/*
   Sumamos los 5 minutos
   adicionales solicitados.
*/

const minutosFinales=
minutosRuta+
MINUTOS_ADICIONALES;


/* =====================================================
   FORMATO DEL TIEMPO
   ===================================================== */

let tiempoTexto="";


if(
minutosFinales<60
){

tiempoTexto=
minutosFinales+
" min";

}else{

const horas=
Math.floor(
minutosFinales/
60
);

const minutosRestantes=
minutosFinales%
60;


if(
minutosRestantes===0
){

tiempoTexto=
horas+
(
horas===1
?
" hora"
:
" horas"
);

}else{

tiempoTexto=
horas+
(
horas===1
?
" hora "
:
" horas "
)+
minutosRestantes+
" min";

}

}


duration.innerText=
tiempoTexto;


/* =====================================================
   ELIMINAR RUTA ANTERIOR
   ===================================================== */

limpiarRuta();


/* =====================================================
   DIBUJAR RUTA EN ROJO
   ===================================================== */

routeLayer=
L.geoJSON(
ruta.geometry,
{

style:{
color:"#ef4444",
weight:6,
opacity:.95,
lineCap:"round",
lineJoin:"round"
}

}
).addTo(map);


/* =====================================================
   COLOCAR LOS DOS MARCADORES
   ===================================================== */

colocarMarcadorRecogida();

colocarMarcadorEntrega();


/* =====================================================
   MOSTRAR TODO EL RECORRIDO
   ===================================================== */

map.fitBounds(
routeLayer.getBounds(),
{
padding:[
45,
45
]
}
);


/* =====================================================
   CALCULAR PRECIO
   ===================================================== */

precioServicio=
calcularPrecioFinal(
kilometros
);


price.innerText=
"$"+
Math.round(
precioServicio
);


/* =====================================================
   MENSAJE
   ===================================================== */

if(
esCentro(
pickupNombreColonia
)&&
esCentro(
destinationNombreColonia
)
){

status.innerText=
"Centro → Centro: tarifa especial de $35.";

}else{

status.innerText=
"Ruta calculada por las calles disponibles.";

}


/* =====================================================
   ACTIVAR CONFIRMAR
   ===================================================== */

confirmButton.disabled=false;


/* =====================================================
   ACTUALIZAR GLIDE
   ===================================================== */

actualizarGlide();


calculateButton.disabled=false;

calculateButton.innerText=
"ACTUALIZAR COTIZACIÓN";


return true;


}catch(error){

console.log(
"Error calculando ruta:",
error
);

status.innerText=
"No se pudo calcular una ruta por las calles disponibles.";

calculateButton.disabled=false;

calculateButton.innerText=
"CALCULAR COTIZACIÓN";

return false;

}

}


/* =====================================================
   BOTÓN CALCULAR COTIZACIÓN
   ===================================================== */

calculateButton.addEventListener(
"click",
function(){

if(
pickupLat===null
){

alert(
"Primero escribe y selecciona la colonia de recogida."
);

pickupInput.focus();

return;

}


if(
destinationLat===null
){

alert(
"Primero escribe y selecciona la colonia de entrega."
);

destinationInput.focus();

return;

}


calcularRuta();

});

function obtenerNumeroServicio(){

const ahora=
new Date();

const fecha=
ahora.getFullYear().toString()+
String(
ahora.getMonth()+1
).padStart(2,"0")+
String(
ahora.getDate()
).padStart(2,"0");


const hora=
String(
ahora.getHours()
).padStart(2,"0")+
String(
ahora.getMinutes()
).padStart(2,"0")+
String(
ahora.getSeconds()
).padStart(2,"0");

Math.floor(
100+

);


return(

fecha+

);

);
