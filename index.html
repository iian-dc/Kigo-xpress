<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kigo Xpress</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{height:100vh;overflow:hidden;display:flex;flex-direction:column}
#map{flex:1;position:relative}
.logo-overlay{position:absolute;top:0;left:50%;transform:translateX(-50%);background:white;padding:4px 18px 8px;border-radius:0 0 18px 18px;z-index:1000;box-shadow:0 4px 15px rgba(0,0,0,.15);text-align:center;min-width:220px}
.logo-text{font-family:'Dancing Script',cursive;font-size:26px;font-weight:700}
.logo-text span.red{color:#e30613}.logo-text span.black{color:#000}
.sublogo{font-size:8px;letter-spacing:1.8px;font-weight:700}
.center-btn{position:absolute;bottom:24px;right:16px;z-index:1000;width:48px;height:48px;background:white;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.25);border:0;cursor:pointer}
.bottom-sheet{background:white;border-radius:22px 22px 0 0;margin-top:-16px;z-index:2000;padding:10px 16px 18px;box-shadow:0 -8px 30px rgba(0,0,0,.18)}
.handle{width:40px;height:4px;background:#d1d5db;border-radius:10px;margin:0 auto 12px}
.input-card{display:flex;align-items:center;gap:12px;border:1.5px solid #e5e7eb;border-radius:18px;padding:12px 14px;margin-bottom:10px;cursor:pointer}
.icon-circle{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.icon-circle.red{background:#e30613}.icon-circle.green{background:#149414}
.text-group{flex:1;overflow:hidden}.label{font-size:10px;color:#8b93a5;font-weight:700}.placeholder{font-size:13.5px;color:#374151;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.placeholder.active{color:#000;font-weight:600}
.info-row{display:flex;background:#fef2f2;border-radius:14px;padding:12px 14px;margin:4px 0 12px;gap:10px}.info-col{flex:1;display:flex;align-items:center;gap:8px}.value{font-size:14px;font-weight:700}.divider{width:1px;background:#f3d2d2}
.btn-continuar{background:#e30613;color:white;border:0;border-radius:50px;padding:14px;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;cursor:pointer}.btn-continuar:disabled{background:#fca5a5}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:5000;display:none;align-items:flex-end}.modal.active{display:flex}.modal-content{background:white;width:100%;border-radius:22px 22px 0 0;padding:18px}.modal input{width:100%;padding:14px;border:2px solid #e5e7eb;border-radius:12px;font-size:15px;margin:10px 0;outline:none}.suggest div{padding:10px 12px;border-bottom:1px solid #f3f4f6;cursor:pointer;font-size:13px}
</style>
</head>
<body>
<div id="map">
  <div class="logo-overlay"><div class="logo-text"><span class="black">Kigo</span> <span class="red">Xpress</span></div><div class="sublogo">LA SOLUCIÓN A TU ALCANCE</div></div>
  <button class="center-btn" onclick="map.setView([21.1557,-100.934],14)">◎</button>
</div>
<div class="bottom-sheet">
  <div class="handle"></div>
  <div class="input-card" onclick="abrirModal('recogida')"><div class="icon-circle red"><svg width="22" height="22" viewBox="0 0 24 24" fill="white"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/></svg></div><div class="text-group"><div class="label">DIRECCIÓN DE RECOGIDA</div><div class="placeholder" id="txt-recogida">Ingresa la dirección de recogida</div></div>❯</div>
  <div class="input-card" onclick="abrirModal('entrega')"><div class="icon-circle green"><svg width="22" height="22" viewBox="0 0 24 24" fill="white"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/></svg></div><div class="text-group"><div class="label">DIRECCIÓN DE ENTREGA</div><div class="placeholder" id="txt-entrega">Ingresa la dirección de entrega</div></div>❯</div>
  <div class="info-row">
    <div class="info-col"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1f2937" stroke-width="2"><circle cx="7" cy="12" r="2"/><circle cx="17" cy="7" r="2"/><path d="M9 12l6-5"/></svg><div><div class="label">DISTANCIA</div><div class="value" id="txt-distancia">—</div></div></div>
    <div class="divider"></div>
    <div class="info-col"><div style="width:26px;height:26px;border:2px solid #1f2937;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px">$</div><div><div class="label">PRECIO ESTIMADO</div><div class="value" id="txt-precio">—</div></div></div>
  </div>
  <button class="btn-continuar" id="btnCont" disabled onclick="continuar()"><svg width="22" height="22" viewBox="0 0 24 24" fill="white"><path d="M5 16c0 1.1.9 2 2 2h1.5c.3 1.2 1.4 2 2.5 2s2.2-.8 2.5-2H16c1.1 0 2-.9 2-2l-3-3V9c0-1.7-1.3-3-3-3s-3 1.3-3 3v5l-3 2z"/></svg> | Continuar →</button>
</div>
<div class="modal" id="modal-recogida"><div class="modal-content"><h3>📍 ¿Dónde recogemos?</h3><input type="text" id="input-recogida" placeholder="Ej: Col. Centro, Dolores Hidalgo" oninput="buscarSugerencias(this.value,'recogida')"><div class="suggest" id="sug-recogida"></div><button class="btn-continuar" onclick="guardarDireccion('recogida')">Guardar</button><br><button onclick="cerrarModal('recogida')" style="width:100%;border:0;background:#f3f4f6;padding:10px;border-radius:10px;margin-top:8px">Cancelar</button></div></div>
<div class="modal" id="modal-entrega"><div class="modal-content"><h3>🏁 ¿Dónde entregamos?</h3><input type="text" id="input-entrega" placeholder="Ej: Col. del Carmen" oninput="buscarSugerencias(this.value,'entrega')"><div class="suggest" id="sug-entrega"></div><button class="btn-continuar" onclick="guardarDireccion('entrega')">Guardar</button><br><button onclick="cerrarModal('entrega')" style="width:100%;border:0;background:#f3f4f6;padding:10px;border-radius:10px;margin-top:8px">Cancelar</button></div></div>
<script>
const DOLORES=[21.1557,-100.934];const map=L.map('map',{zoomControl:false}).setView(DOLORES,14);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);
let markerRecogida=null,markerEntrega=null,routeLine=null,coordsRecogida=null,coordsEntrega=null;
const redIcon=L.divIcon({html:'<div style="background:#e30613;width:32px;height:32px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;border:3px solid white;box-shadow:0 3px 8px rgba(0,0,0,.4)"><div style="transform:rotate(45deg);color:white;font-weight:900">●</div></div>',className:'',iconSize:[32,32],iconAnchor:[16,32]});
const greenIcon=L.divIcon({html:'<div style="background:#149414;width:32px;height:32px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;border:3px solid white;box-shadow:0 3px 8px rgba(0,0,0,.4)"><div style="transform:rotate(45deg);color:white;font-weight:900">●</div></div>',className:'',iconSize:[32,32],iconAnchor:[16,32]});
function abrirModal(t){document.getElementById('modal-'+t).classList.add('active')}
function cerrarModal(t){document.getElementById('modal-'+t).classList.remove('active')}
async function geocodeDir(texto){const url=`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(texto+', Dolores Hidalgo, Guanajuato')}&limit=1`;const res=await fetch(url);const data=await res.json();if(data.length>0)return[parseFloat(data[0].lat),parseFloat(data[0].lon)];return null}
async function buscarSugerencias(val,tipo){if(val.length<3){document.getElementById('sug-'+tipo).innerHTML='';return}const url=`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(val)}&limit=5&viewbox=-101.1,21.3,-100.7,21.0&bounded=1`;const r=await fetch(url);const d=await r.json();document.getElementById('sug-'+tipo).innerHTML=d.map(o=>`<div onclick="document.getElementById('input-${tipo}').value='${o.display_name.replace(/'/g,"")}';document.getElementById('sug-${tipo}').innerHTML=''">${o.display_name}</div>`).join('')}
async function guardarDireccion(tipo){let txt=document.getElementById('input-'+tipo).value.trim();if(!txt){alert('Escribe dirección');return}document.getElementById('txt-'+tipo).textContent='Buscando...';let coords=await geocodeDir(txt);if(!coords){alert('No se encontró, intenta más específico');document.getElementById('txt-'+tipo).textContent='Ingresa la dirección de '+tipo;return}
if(tipo==='recogida'){coordsRecogida=coords;if(markerRecogida)map.removeLayer(markerRecogida);markerRecogida=L.marker(coords,{icon:redIcon}).addTo(map);document.getElementById('txt-recogida').textContent=txt;document.getElementById('txt-recogida').classList.add('active')}else{coordsEntrega=coords;if(markerEntrega)map.removeLayer(markerEntrega);markerEntrega=L.marker(coords,{icon:greenIcon}).addTo(map);document.getElementById('txt-entrega').textContent=txt;document.getElementById('txt-entrega').classList.add('active')}cerrarModal(tipo);if(coordsRecogida&&coordsEntrega)trazarRuta();else map.setView(coords,16)}
async function trazarRuta(){const url=`https://router.project-osrm.org/route/v1/driving/${coordsRecogida[1]},${coordsRecogida[0]};${coordsEntrega[1]},${coordsEntrega[0]}?overview=full&geometries=geojson`;try{const r=await fetch(url);const data=await r.json();if(data.routes&&data.routes.length>0){const route=data.routes[0];const km=(route.distance/1000).toFixed(1);const min=Math.round(route.duration/60);const precio=Math.round(km*22+30);if(routeLine)map.removeLayer(routeLine);routeLine=L.geoJSON(route.geometry,{style:{color:'#e30613',weight:5,opacity:0.85}}).addTo(map);map.fitBounds(routeLine.getBounds(),{padding:[40,40]});document.getElementById('txt-distancia').textContent=km+' km • '+min+' min';document.getElementById('txt-precio').textContent='$'+precio+' MXN';document.getElementById('btnCont').disabled=false}}catch(e){let d=map.distance(coordsRecogida,coordsEntrega)/1000;document.getElementById('txt-distancia').textContent=d.toFixed(1)+' km';document.getElementById('txt-precio').textContent='$'+Math.round(d*22+30)+' MXN'}}
function continuar(){let rec=document.getElementById('txt-recogida').textContent;let ent=document.getElementById('txt-entrega').textContent;let dist=document.getElementById('txt-distancia').textContent;let precio=document.getElementById('txt-precio').textContent;let link=`https://www.google.com/maps/dir/${coordsRecogida[0]},${coordsRecogida[1]}/${coordsEntrega[0]},${coordsEntrega[1]}`;let m=`Hola Kigo Xpress! Quiero un servicio:%0A🔴 RECOGIDA: ${rec}%0A🟢 ENTREGA: ${ent}%0A📏 ${dist}%0A💰 ${precio}%0A🗺️ ${link}`;window.open(`https://wa.me/524181103030?text=${m}`,'_blank')}
</script>
</body>
</html>
