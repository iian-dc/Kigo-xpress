<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Moto Mandado</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

*{
box-sizing:border-box
}

body{
margin:0;
padding:0;
font-family:Arial,sans-serif;
background:#f3f3f3;
color:#222
}

.app{
width:100%;
max-width:600px;
margin:auto;
background:#fff;
min-height:100vh
}


/* =====================================================
   MAPA
   ===================================================== */

#map{
width:100%;
height:55vh;
min-height:350px
}

.map-container{
position:relative
}

.map-message{
position:absolute;
top:15px;
left:50%;
transform:translateX(-50%);
z-index:999;
background:white;
padding:9px 14px;
border-radius:20px;
box-shadow:0 2px 10px rgba(0,0,0,.2);
font-size:12px;
font-weight:bold;
white-space:nowrap
}


/* =====================================================
   PANEL
   ===================================================== */

.panel{
background:#fff;
padding:16px;
border-radius:22px 22px 0 0;
margin-top:-22px;
position:relative;
z-index:1000;
box-shadow:0 -4px 18px rgba(0,0,0,.15)
}

.title{
font-size:21px;
font-weight:bold;
margin-bottom:5px
}

.subtitle{
font-size:13px;
color:#777;
margin-bottom:15px;
line-height:18px
}


/* =====================================================
   CAMPOS
   ===================================================== */

.step{
padding:13px;
border-radius:13px;
background:#f5f5f5;
margin-bottom:10px;
position:relative
}

.step-title{
font-size:12px;
color:#777;
margin-bottom:7px;
font-weight:bold
}

.input-wrapper{
position:relative
}

.colonia-input{
width:100%;
border:1px solid #ddd;
background:#fff;
padding:13px;
border-radius:10px;
font-size:14px;
font-weight:bold;
outline:none;
color:#222
}

.colonia-input:focus{
border-color:#f5c400;
box-shadow:0 0 0 2px rgba(245,196,0,.15)
}

.colonia-input::placeholder{
color:#aaa;
font-weight:normal
}


/* =====================================================
   SUGERENCIAS DE COLONIAS
   ===================================================== */

.suggestions{
position:absolute;
left:0;
right:0;
top:calc(100% + 5px);
background:#fff;
border:1px solid #ddd;
border-radius:12px;
box-shadow:0 5px 18px rgba(0,0,0,.18);
z-index:5000;
overflow:hidden;
display:none
}

.suggestions.show{
display:block
}

.suggestion{
padding:12px 13px;
border-bottom:1px solid #eee;
font-size:13px;
font-weight:bold;
background:#fff;
cursor:pointer
}

.suggestion:last-child{
border-bottom:none
}

.suggestion:active{
background:#f5c400
}

.suggestion-name{
font-size:14px;
color:#222
}

.suggestion-location{
font-size:11px;
color:#888;
margin-top:3px;
font-weight:normal
}

.suggestion-loading{
padding:13px;
font-size:12px;
color:#777;
text-align:center
}

.suggestion-empty{
padding:13px;
font-size:12px;
color:#777;
text-align:center
}


/* =====================================================
   BOTÓN CALCULAR
   ===================================================== */

.calculate{
width:100%;
border:1px solid #e0b400;
padding:14px;
border-radius:12px;
margin-top:2px;
background:linear-gradient(
135deg,
#ffd83d,
#f5c400
);
color:#111;
font-size:14px;
font-weight:bold;
box-shadow:0 4px 10px rgba(0,0,0,.12);
cursor:pointer
}

.calculate:active{
transform:scale(.98)
}

.calculate:disabled{
opacity:.7;
cursor:not-allowed
}


/* =====================================================
   INFORMACIÓN
   ===================================================== */

.info{
display:flex;
gap:8px;
margin-top:10px
}

.info-box{
flex:1;
background:#f5f5f5;
padding:12px 8px;
border-radius:12px;
text-align:center
}

.info-label{
font-size:11px;
color:#777
}

.info-value{
font-size:16px;
font-weight:bold;
margin-top:5px
}


/* =====================================================
   PRECIO
   ===================================================== */

.price{
margin-top:12px;
padding:15px;
background:#111;
color:#fff;
border-radius:14px;
display:flex;
justify-content:space-between;
align-items:center
}

.price-label{
font-size:13px
}

.price-value{
font-size:24px;
font-weight:bold
}


/* =====================================================
   CONFIRMAR
   ===================================================== */

.confirm{
width:100%;
border:none;
padding:16px;
border-radius:14px;
margin-top:14px;
background:#f5c400;
color:#111;
font-size:17px;
font-weight:bold;
box-shadow:0 4px 10px rgba(245,196,0,.25)
}

.confirm:disabled{
background:#aaa;
color:#fff;
box-shadow:none
}


/* =====================================================
   ESTADO
   ===================================================== */

.status{
text-align:center;
font-size:12px;
color:#777;
margin-top:9px;
min-height:18px
}


/* =====================================================
   MARCADORES
   ===================================================== */

.pickup-icon,
.destination-icon{
width:38px;
height:38px;
border-radius:50% 50% 50% 0;
transform:rotate(-45deg);
display:flex;
align-items:center;
justify-content:center;
box-shadow:0 3px 10px rgba(0,0,0,.35);
border:3px solid white
}

.pickup-icon{
background:#f5c400
}

.destination-icon{
background:#111
}

.marker-dot{
width:11px;
height:11px;
background:white;
border-radius:50%
}


/* =====================================================
   PANTALLA DE CARGA
   ===================================================== */

.loading-screen{
position:fixed;
inset:0;
background:rgba(255,255,255,.97);
z-index:99999;
display:none;
align-items:center;
justify-content:center;
flex-direction:column;
text-align:center
}

.loading-screen.show{
display:flex
}

.loading-title{
font-size:21px;
font-weight:bold;
margin-top:18px
}

.loading-text{
font-size:13px;
color:#777;
margin-top:7px
}

.road{
width:260px;
height:7px;
background:#222;
border-radius:10px;
position:relative;
margin-top:45px
}

.road:before{
content:"";
position:absolute;
left:0;
right:0;
top:2px;
border-top:3px dashed #f5c400
}

.moto{
position:absolute;
left:-50px;
top:-34px;
font-size:40px;
animation:motoMove 4.5s linear infinite
}

.loading-dot{
display:flex;
gap:6px;
margin-top:20px
}

.loading-dot span{
width:7px;
height:7px;
background:#f5c400;
border-radius:50%;
animation:blink 1s infinite
}

.loading-dot span:nth-child(2){
animation-delay:.2s
}

.loading-dot span:nth-child(3){
animation-delay:.4s
}

@keyframes motoMove{

0%{
left:-50px;
transform:scaleX(1)
}

45%{
left:120px;
transform:scaleX(1)
}

50%{
left:120px;
transform:scaleX(-1)
}

95%{
left:-50px;
transform:scaleX(-1)
}

100%{
left:-50px;
transform:scaleX(1)
}

}

@keyframes blink{

0%,100%{
opacity:.25
}

50%{
opacity:1
}

}


/* =====================================================
   MÓVIL
   ===================================================== */

@media(max-width:480px){

#map{
height:55vh;
min-height:350px
}

.panel{
padding:14px
}

.title{
font-size:20px
}

}

</style>

</head>


<body>


<div class="app">


<!-- =================================================
     MAPA
     ================================================= -->

<div class="map-container">

<div id="map"></div>

<div id="mapMessage"
class="map-message">

Escribe las colonias para cotizar

</div>

</div>


<!-- =================================================
     PANEL
     ================================================= -->

<div class="panel">


<div class="title">

Solicita tu moto mandado

</div>


<div id="subtitle"
class="subtitle">

Escribe la colonia donde recogemos
y la colonia donde entregamos.

</div>


<!-- =================================================
     COLONIA DE RECOGIDA
     ================================================= -->

<div class="step">

<div class="step-title">

COLONIA DE RECOGIDA

</div>


<div class="input-wrapper">

<input
id="pickupInput"
class="colonia-input"
type="text"
placeholder="Escribe el nombre de la colonia"
autocomplete="off"
>

<div
id="pickupSuggestions"
class="suggestions">

</div>

</div>

</div>


<!-- =================================================
     COLONIA DE ENTREGA
     ================================================= -->

<div class="step">

<div class="step-title">

COLONIA DE ENTREGA

</div>


<div class="input-wrapper">

<input
id="destinationInput"
class="colonia-input"
type="text"
placeholder="Escribe el nombre de la colonia"
autocomplete="off"
>

<div
id="destinationSuggestions"
class="suggestions">

</div>

</div>

</div>


<!-- =================================================
     CALCULAR
     ================================================= -->

<button
id="calculateButton"
class="calculate">

CALCULAR COTIZACIÓN

</button>


<!-- =================================================
     INFORMACIÓN
     ================================================= -->

<div class="info">


<div class="info-box">

<div class="info-label">

DISTANCIA

</div>

<div
id="distance"
class="info-value">

—

</div>

</div>


<div class="info-box">

<div class="info-label">

TIEMPO APROX.

</div>

<div
id="duration"
class="info-value">

—

</div>

</div>


</div>


<!-- =================================================
     PRECIO
     ================================================= -->

<div class="price">

<div class="price-label">

VALOR ESTIMADO

</div>

<div
id="price"
class="price-value">

$0

</div>

</div>


<!-- =================================================
     CONFIRMAR
     ================================================= -->

<button
id="confirmButton"
class="confirm"
disabled>

CONFIRMAR SERVICIO

</button>


<div
id="status"
class="status">

</div>


</div>

</div>


<!-- =================================================
     PANTALLA DE CARGA
     ================================================= -->

<div
id="loadingScreen"
class="loading-screen">


<div class="road">

<div class="moto">

🏍️

</div>

</div>


<div class="loading-title">

Preparando tu servicio

</div>


<div class="loading-text">

Enviando solicitud...

</div>


<div class="loading-dot">

<span></span>

<span></span>

<span></span>

</div>


</div>


<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>


/* =====================================================
   CONFIGURACIÓN GENERAL
   ===================================================== */

const CIUDAD="Dolores Hidalgo";

const ESTADO="Guanajuato";

const PAIS="Mexico";

const NUMERO_WHATSAPP="524182371993";


/* =====================================================
   PRECIOS POR COLONIA
   ===================================================== */

/*
   AQUÍ POSTERIORMENTE VAMOS A COLOCAR
   LOS PRECIOS REALES QUE TÚ ME DES.

   NO ESTOY INVENTANDO TODAVÍA
   LOS PRECIOS DE LAS COLONIAS.
*/

const PRECIOS_COLONIAS={

"Centro":35

};


/* =====================================================
   VARIABLES
   ===================================================== */

let pickupLat=null;

let pickupLng=null;

let destinationLat=null;

let destinationLng=null;

let pickupAddress="";

let destinationAddress="";

let pickupNombreColonia="";

let destinationNombreColonia="";

let pickupMarker=null;

let destinationMarker=null;

let routeLayer=null;

let precioServicio=0;


/* =====================================================
   MAPA
   ===================================================== */

const map=L.map(
"map",
{
zoomControl:false,
attributionControl:true
}
);


/* =====================================================
   CAPA DEL MAPA
   ===================================================== */

L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{

maxZoom:19,

attribution:"© OpenStreetMap"

}
).addTo(map);


/* =====================================================
   CENTRO INICIAL
   DOLORES HIDALGO
   ===================================================== */

map.setView(
[21.1561,-100.9333],
14
);


/* =====================================================
   ELEMENTOS
   ===================================================== */

const pickupInput=
document.getElementById(
"pickupInput"
);

const destinationInput=
document.getElementById(
"destinationInput"
);

const pickupSuggestions=
document.getElementById(
"pickupSuggestions"
);

const destinationSuggestions=
document.getElementById(
"destinationSuggestions"
);

const calculateButton=
document.getElementById(
"calculateButton"
);

const confirmButton=
document.getElementById(
"confirmButton"
);

const distance=
document.getElementById(
"distance"
);

const duration=
document.getElementById(
"duration"
);

const price=
document.getElementById(
"price"
);

const status=
document.getElementById(
"status"
);

const mapMessage=
document.getElementById(
"mapMessage"
);


/* =====================================================
   NORMALIZAR TEXTO
   ===================================================== */

function normalizarTexto(texto){

return texto
.toLowerCase()
.normalize("NFD")
.replace(
/[\u0300-\u036f]/g,
""
)
.trim();

}


/* =====================================================
   MOSTRAR ESTADO
   ===================================================== */

function mostrarEstado(texto){

status.innerText=texto;

}


/* =====================================================
   BUSCAR PRECIO DE COLONIA
   ===================================================== */

function obtenerPrecioColonia(nombre){

if(!nombre){

return null;

}

const nombreNormalizado=
normalizarTexto(nombre);

for(
const colonia in PRECIOS_COLONIAS
){

if(
normalizarTexto(colonia)===
nombreNormalizado
){

return PRECIOS_COLONIAS[colonia];

}

}

return null;

}


/* =====================================================
   ICONO RECOGIDA
   ===================================================== */

function crearIconoRecogida(){

return L.divIcon({

className:"",

html:
'<div class="pickup-icon">'+
'<div class="marker-dot"></div>'+
'</div>',

iconSize:[
38,
38
],

iconAnchor:[
19,
38
]

});

}


/* =====================================================
   ICONO DESTINO
   ===================================================== */

function crearIconoDestino(){

return L.divIcon({

className:"",

html:
'<div class="destination-icon">'+
'<div class="marker-dot"></div>'+
'</div>',

iconSize:[
38,
38
],

iconAnchor:[
19,
38
]

});

}


/* =====================================================
   COLOCAR MARCADOR DE RECOGIDA
   ===================================================== */

function colocarMarcadorRecogida(){

if(
pickupLat===null||
pickupLng===null
){

return;

}

if(pickupMarker){

map.removeLayer(
pickupMarker
);

}

pickupMarker=
L.marker(
[
pickupLat,
pickupLng
],
{
icon:
crearIconoRecogida()
}
).addTo(map);

pickupMarker.bindPopup(
"<b>RECOGIDA</b><br>"+
pickupNombreColonia
);

}


/* =====================================================
   COLOCAR MARCADOR DE ENTREGA
   ===================================================== */

function colocarMarcadorEntrega(){

if(
destinationLat===null||
destinationLng===null
){

return;

}

if(destinationMarker){

map.removeLayer(
destinationMarker
);

}

destinationMarker=
L.marker(
[
destinationLat,
destinationLng
],
{
icon:
crearIconoDestino()
}
).addTo(map);

destinationMarker.bindPopup(
"<b>ENTREGA</b><br>"+
destinationNombreColonia
);

}


/* =====================================================
   LIMPIAR RUTA
   ===================================================== */

function limpiarRuta(){

if(routeLayer){

map.removeLayer(
routeLayer
);

routeLayer=null;

}

}


/* =====================================================
   BUSCAR COLONIAS EN DOLORES HIDALGO
   ===================================================== */

async function buscarColonias(texto){

if(
!texto||
texto.trim().length<2
){

return [];

}


const consulta=
encodeURIComponent(
texto+
", Dolores Hidalgo, Guanajuato, Mexico"
);


const url=
"https://nominatim.openstreetmap.org/search"+
"?format=json"+
"&q="+
consulta+
"&limit=8"+
"&countrycodes=mx"+
"&addressdetails=1"+
"&accept-language=es";


try{

const respuesta=
await fetch(
url,
{
headers:{
"Accept":
"application/json"
}
}
);

const resultados=
await respuesta.json();


/*
   FILTRAMOS PARA QUE LOS RESULTADOS
   SEAN DE DOLORES HIDALGO.
*/

const filtrados=
resultados.filter(
function(resultado){

const textoResultado=
normalizarTexto(
resultado.display_name||
""
);

return textoResultado.includes(
"dolores hidalgo"
);

}
);


return filtrados;

}catch(error){

console.log(
"Error buscando colonias:",
error
);

return [];

}

}


/* =====================================================
   MOSTRAR SUGERENCIAS
   ===================================================== */

function mostrarSugerencias(
contenedor,
resultados,
tipo
){

contenedor.innerHTML="";


if(
!resultados.length
){

contenedor.innerHTML=
'<div class="suggestion-empty">'+
'No encontramos esa colonia en Dolores Hidalgo.'+
'</div>';

contenedor.classList.add(
"show"
);

return;

}


resultados.forEach(
function(resultado){

const elemento=
document.createElement(
"div"
);

elemento.className=
"suggestion";


const nombre=
resultado.name||
resultado.display_name
.split(",")[0];


const ubicacion=
"Dolores Hidalgo, Guanajuato";


elemento.innerHTML=

'<div class="suggestion-name">'+
nombre+
'</div>'+
'<div class="suggestion-location">'+
ubicacion+
'</div>';


elemento.addEventListener(
"click",
function(){

seleccionarColonia(
resultado,
nombre,
tipo
);

}
);


contenedor.appendChild(
elemento
);

}
);


contenedor.classList.add(
"show"
);

}


/* =====================================================
   SELECCIONAR COLONIA
   ===================================================== */

function seleccionarColonia(
resultado,
nombre,
tipo
){

const lat=
parseFloat(
resultado.lat
);

const lng=
parseFloat(
resultado.lon
);


if(tipo==="pickup"){

pickupNombreColonia=
nombre;

pickupLat=
lat;

pickupLng=
lng;

pickupAddress=
resultado.display_name||
nombre+
", Dolores Hidalgo, Guanajuato";


pickupInput.value=
nombre;


pickupSuggestions.classList.remove(
"show"
);


colocarMarcadorRecogida();


map.setView(
[
lat,
lng
],
15
);


mapMessage.innerText=
"Recogida seleccionada: "+
nombre;


}else{

destinationNombreColonia=
nombre;

destinationLat=
lat;

destinationLng=
lng;

destinationAddress=
resultado.display_name||
nombre+
", Dolores Hidalgo, Guanajuato";


destinationInput.value=
nombre;


destinationSuggestions.classList.remove(
"show"
);


colocarMarcadorEntrega();


mapMessage.innerText=
"Entrega seleccionada: "+
nombre;

}


actualizarEstadoSeleccion();

}


/* =====================================================
   ACTUALIZAR ESTADO DE SELECCIÓN
   ===================================================== */

function actualizarEstadoSeleccion(){

if(
pickupLat!==null&&
destinationLat!==null
){

mapMessage.innerText=
"Pulsa CALCULAR COTIZACIÓN";

mostrarEstado(
"Las dos colonias están seleccionadas."
);

return;

}


if(
pickupLat!==null
){

mapMessage.innerText=
"Ahora selecciona la colonia de entrega";

mostrarEstado(
"Selecciona la colonia de entrega."
);

return;

}


mapMessage.innerText=
"Selecciona la colonia de recogida";

}


/* =====================================================
   AQUÍ CONTINÚA LA PARTE 2
   ===================================================== */
   /* =====================================================
   AUTOCOMPLETADO - RECOGIDA
   ===================================================== */

let timerPickup=null;

pickupInput.addEventListener(
"input",
function(){

const texto=
this.value.trim();

pickupNombreColonia=
texto;

pickupLat=null;
pickupLng=null;
pickupAddress="";

if(pickupMarker){

map.removeLayer(
pickupMarker
);

pickupMarker=null;

}

if(timerPickup){

clearTimeout(
timerPickup
);

}

if(texto.length<2){

pickupSuggestions.innerHTML="";

pickupSuggestions.classList.remove(
"show"
);

actualizarEstadoSeleccion();

return;

}


pickupSuggestions.innerHTML=
'<div class="suggestion-loading">'+
'Buscando colonias...'+
'</div>';

pickupSuggestions.classList.add(
"show"
);


timerPickup=
setTimeout(
async function(){

const resultados=
await buscarColonias(
texto
);


mostrarSugerencias(
pickupSuggestions,
resultados,
"pickup"
);

},
350
);

}
);


/* =====================================================
   AUTOCOMPLETADO - ENTREGA
   ===================================================== */

let timerDestination=null;

destinationInput.addEventListener(
"input",
function(){

const texto=
this.value.trim();

destinationNombreColonia=
texto;

destinationLat=null;
destinationLng=null;
destinationAddress="";

if(destinationMarker){

map.removeLayer(
destinationMarker
);

destinationMarker=null;

}

if(timerDestination){

clearTimeout(
timerDestination
);

}

if(texto.length<2){

destinationSuggestions.innerHTML="";

destinationSuggestions.classList.remove(
"show"
);

actualizarEstadoSeleccion();

return;

}


destinationSuggestions.innerHTML=
'<div class="suggestion-loading">'+
'Buscando colonias...'+
'</div>';

destinationSuggestions.classList.add(
"show"
);


timerDestination=
setTimeout(
async function(){

const resultados=
await buscarColonias(
texto
);


mostrarSugerencias(
destinationSuggestions,
resultados,
"destination"
);

},
350
);

}
);


/* =====================================================
   CERRAR SUGERENCIAS AL TOCAR FUERA
   ===================================================== */

document.addEventListener(
"click",
function(e){

if(
!pickupInput.contains(e.target)&&
!pickupSuggestions.contains(e.target)
){

pickupSuggestions.classList.remove(
"show"
);

}


if(
!destinationInput.contains(e.target)&&
!destinationSuggestions.contains(e.target)
){

destinationSuggestions.classList.remove(
"show"
);

}

}
);


/* =====================================================
   CALCULAR RUTA ENTRE COLONIAS
   ===================================================== */

async function calcularRuta(){

if(
pickupLat===null||
pickupLng===null||
destinationLat===null||
destinationLng===null
){

mostrarEstado(
"Primero selecciona las dos colonias."
);

return false;

}


calculateButton.disabled=true;

calculateButton.innerText=
"CALCULANDO...";

mostrarEstado(
"Calculando recorrido entre las colonias..."
);


const url=
"https://router.project-osrm.org/route/v1/driving/"+
pickupLng+
","+
pickupLat+
";"+
destinationLng+
","+
destinationLat+
"?overview=full&geometries=geojson";


try{

const respuesta=
await fetch(url);

const datos=
await respuesta.json();


if(
!datos.routes||
!datos.routes.length
){

mostrarEstado(
"No encontramos una ruta entre estas colonias."
);

calculateButton.disabled=false;

calculateButton.innerText=
"CALCULAR COTIZACIÓN";

return false;

}


const ruta=
datos.routes[0];


/* =====================================================
   DISTANCIA
   ===================================================== */

const kilometros=
ruta.distance/1000;


distance.innerText=
kilometros.toFixed(1)+
" km";


/* =====================================================
   TIEMPO
   ===================================================== */

const minutos=
Math.max(
1,
Math.round(
ruta.duration/60
)
);


let tiempoTexto;


if(
minutos<60
){

tiempoTexto=
minutos+
" min";

}else{

const horas=
Math.floor(
minutos/60
);

const minutosRestantes=
minutos%60;


if(
minutosRestantes===0
){

tiempoTexto=
horas+
(
horas===1
?
" hora"
:
" horas"
);

}else{

tiempoTexto=
horas+
(
horas===1
?
" hora "
:
" horas "
)+
minutosRestantes+
" min";

}

}


duration.innerText=
tiempoTexto;


/* =====================================================
   BORRAR RUTA ANTERIOR
   ===================================================== */

limpiarRuta();


/* =====================================================
   DIBUJAR RUTA
   ===================================================== */

routeLayer=
L.geoJSON(
ruta.geometry,
{

style:{
weight:6,
opacity:.85
}

}
).addTo(map);


/* =====================================================
   MOSTRAR AMBOS PUNTOS EN EL MAPA
   ===================================================== */

colocarMarcadorRecogida();

colocarMarcadorEntrega();


/* =====================================================
   AJUSTAR MAPA A TODA LA RUTA
   ===================================================== */

map.fitBounds(
routeLayer.getBounds(),
{
padding:[
45,
45
]
}
);


/* =====================================================
   CALCULAR PRECIO
   ===================================================== */

const precioRecogida=
obtenerPrecioColonia(
pickupNombreColonia
);

const precioEntrega=
obtenerPrecioColonia(
destinationNombreColonia
);


/*
   IMPORTANTE:

   En este momento solamente tenemos
   configurado "Centro" como ejemplo.

   Cuando me pases tu tabla de precios
   de las colonias de Dolores Hidalgo,
   aquí funcionará automáticamente.
*/


if(
precioRecogida===null||
precioEntrega===null
){

price.innerText=
"POR COTIZAR";

confirmButton.disabled=true;


let coloniaFaltante="";


if(
precioRecogida===null
){

coloniaFaltante=
pickupNombreColonia;

}else{

coloniaFaltante=
destinationNombreColonia;

}


mostrarEstado(
"La colonia "+
coloniaFaltante+
" todavía no tiene precio configurado."
);


calculateButton.disabled=false;

calculateButton.innerText=
"ACTUALIZAR COTIZACIÓN";


actualizarGlide();

return false;

}


/* =====================================================
   PRECIO DEL SERVICIO
   ===================================================== */


/*
   POR AHORA:

   Tomamos el precio mayor de las
   dos colonias.

   Ejemplo:

   Recogida = $40
   Entrega = $50

   Servicio = $50


   MÁS ADELANTE podemos cambiarlo
   para que funcione por combinación:

   Centro → La Otra Colonia = $X
   Centro → Colonia X = $Y
   Colonia X → Colonia Y = $Z

   según la tabla que tú me entregues.
*/

precioServicio=
Math.max(
precioRecogida,
precioEntrega
);


/* =====================================================
   MOSTRAR PRECIO
   ===================================================== */

price.innerText=
"$"+
Math.round(
precioServicio
);


/* =====================================================
   HABILITAR CONFIRMAR
   ===================================================== */

confirmButton.disabled=false;


mostrarEstado(
"Cotización calculada correctamente."
);


/* =====================================================
   ACTUALIZAR GLIDE
   ===================================================== */

actualizarGlide();


calculateButton.disabled=false;

calculateButton.innerText=
"ACTUALIZAR COTIZACIÓN";


return true;


}catch(error){

console.log(
"Error calculando ruta:",
error
);


mostrarEstado(
"No se pudo calcular el recorrido."
);


calculateButton.disabled=false;

calculateButton.innerText=
"CALCULAR COTIZACIÓN";


return false;

}

}


/* =====================================================
   BOTÓN CALCULAR COTIZACIÓN
   ===================================================== */

calculateButton.addEventListener(
"click",
async function(){

/*
   Verificar recogida
*/

if(
!pickupNombreColonia||
pickupLat===null
){

alert(
"Selecciona una colonia de recogida de la lista."
);

pickupInput.focus();

return;

}


/*
   Verificar entrega
*/

if(
!destinationNombreColonia||
destinationLat===null
){

alert(
"Selecciona una colonia de entrega de la lista."
);

destinationInput.focus();

return;

}


/*
   Calcular
*/

await calcularRuta();

}
);


/* =====================================================
   GOOGLE MAPS
   ===================================================== */

function crearUrlGoogleMaps(){

if(
pickupLat===null||
pickupLng===null||
destinationLat===null||
destinationLng===null
){

return "";

}


return(
"https://www.google.com/maps/dir/?api=1"+
"&origin="+
pickupLat+
","+
pickupLng+
"&destination="+
destinationLat+
","+
destinationLng+
"&travelmode=driving"
);

}


/* =====================================================
   NÚMERO DEL SERVICIO
   ===================================================== */

function obtenerNumeroServicio(){

const ahora=
new Date();


const fecha=
ahora.getFullYear()+
String(
ahora.getMonth()+1
).padStart(
2,
"0"
)+
String(
ahora.getDate()
).padStart(
2,
"0"
);


const hora=
String(
ahora.getHours()
).padStart(
2,
"0"
)+
String(
ahora.getMinutes()
).padStart(
2,
"0"
)+
String(
ahora.getSeconds()
).padStart(
2,
"0"
);


const aleatorio=
Math.floor(
100+
Math.random()*900
);


return(
"MM-"+
fecha+
"-"+
hora+
"-"+
aleatorio
);

}


/* =====================================================
   FECHA Y HORA
   ===================================================== */

function obtenerFechaHora(){

return new Date()
.toLocaleString(
"es-MX",
{

day:"2-digit",

month:"2-digit",

year:"numeric",

hour:"2-digit",

minute:"2-digit",

second:"2-digit",

hour12:false

}
);

}


/* =====================================================
   DATOS PARA GLIDE
   ===================================================== */

function obtenerDatos(
numeroServicio
){

return{

numero_servicio:
numeroServicio,

tipo_servicio:
"Moto Mandado",

fecha_hora:
obtenerFechaHora(),

ciudad:
"Dolores Hidalgo",

colonia_recogida:
pickupNombreColonia,

direccion_recogida:
pickupAddress,

latitud_recogida:
pickupLat,

longitud_recogida:
pickupLng,

colonia_entrega:
destinationNombreColonia,

direccion_entrega:
destinationAddress,

latitud_entrega:
destinationLat,

longitud_entrega:
destinationLng,

distancia:
distance.innerText,

tiempo_estimado:
duration.innerText,

valor_servicio:
price.innerText,

url_google_maps:
crearUrlGoogleMaps(),

estado:
"Pendiente"

};

}


/* =====================================================
   ENVIAR DATOS A GLIDE
   ===================================================== */

function actualizarGlide(){

const datos=
obtenerDatos(
"PENDIENTE"
);


window.parent.postMessage(

{

type:
"MOTO_MANDADO_DATA",

data:
datos

},

"*"

);

}


/* =====================================================
   ACTUALIZAR GLIDE CUANDO CAMBIA RECOGIDA
   ===================================================== */

pickupInput.addEventListener(
"change",
function(){

pickupNombreColonia=
this.value.trim();

actualizarGlide();

}
);


/* =====================================================
   ACTUALIZAR GLIDE CUANDO CAMBIA ENTREGA
   ===================================================== */

destinationInput.addEventListener(
"change",
function(){

destinationNombreColonia=
this.value.trim();

actualizarGlide();

}
);


/* =====================================================
   ESTADO INICIAL
   ===================================================== */

mostrarEstado(
"Escribe y selecciona las dos colonias."
);


/* =====================================================
   FIN PARTE 2
   ===================================================== */
   /* =====================================================
   PARTE 3
   CONFIRMAR SERVICIO Y ENVIAR WHATSAPP
   ===================================================== */


/* =====================================================
   CREAR MENSAJE DE WHATSAPP
   ===================================================== */

const mensaje=
"🛵 MOTO MANDADO\n\n"+
"━━━━━━━━━━━━━━\n\n"+
"📋 SERVICIO: "+
datos.numero_servicio+
"\n"+

);

/* =====================================================
   BOTÓN CONFIRMAR SERVICIO
   ===================================================== */

confirmButton.addEventListener(
"click",
function(){

/*
   Verificar que exista recogida
*/

if(
pickupLat===null||
pickupLng===null
){

alert(
"Selecciona la colonia de recogida."
);

return;

}


/*
   Verificar que exista entrega
*/

if(
destinationLat===null||
destinationLng===null
){

alert(
"Selecciona la colonia de entrega."
);

return;

}


/*
   Verificar que exista precio
*/

if(
!precioServicio||
precioServicio<=0
){

alert(
"Primero debes calcular la cotización."
);

return;

}


/*
   Generar número de servicio
*/

const numeroServicio=
obtenerNumeroServicio();


/*
   Obtener todos los datos
*/

const datos=
obtenerDatos(
numeroServicio
);


/*
   Enviar información a Glide
*/

window.parent.postMessage(

{

type:
"MOTO_MANDADO_DATA",

data:
datos

},

"*"

);


/*
   Desactivar botón
*/

confirmButton.disabled=true;


/*
   Mostrar pantalla de carga
*/

const loadingScreen=
document.getElementById(
"loadingScreen"
);


loadingScreen.classList.add(
"show"
);


/*
   Cambiar mensaje
*/

const loadingTitle=
document.querySelector(
".loading-title"
);

const loadingText=
document.querySelector(
".loading-text"
);


if(loadingTitle){

loadingTitle.innerText=
"Preparando tu servicio";

}


if(loadingText){

loadingText.innerText=
"Enviando cotización a WhatsApp...";

}


/*
   Esperar unos segundos
   antes de abrir WhatsApp
*/

setTimeout(
function(){

enviarWhatsApp(
datos
);

},
3000
);

}
);


/* =====================================================
   EVITAR ENVIAR EL FORMULARIO
   SI SE USA DENTRO DE GLIDE
   ===================================================== */

document.addEventListener(
"keydown",
function(event){

if(
event.key==="Enter"&&
(
document.activeElement===
pickupInput||
document.activeElement===
destinationInput
)
){

event.preventDefault();

}

}
);


/* =====================================================
   ACTUALIZAR MAPA SI CAMBIAN
   LAS COLONIAS
   ===================================================== */

function reiniciarCotizacion(){

distance.innerText="—";

duration.innerText="—";

price.innerText="$0";

precioServicio=0;

confirmButton.disabled=true;

limpiarRuta();

}


/* =====================================================
   CUANDO EL CLIENTE CAMBIA LA RECOGIDA
   ===================================================== */

pickupInput.addEventListener(
"input",
function(){

reiniciarCotizacion();

}
);


/* =====================================================
   CUANDO EL CLIENTE CAMBIA LA ENTREGA
   ===================================================== */

destinationInput.addEventListener(
"input",
function(){

reiniciarCotizacion();

}
);


/* =====================================================
   SI EL CLIENTE SELECCIONA RECOGIDA
   VOLVER A CENTRAR MAPA
   ===================================================== */

pickupInput.addEventListener(
"focus",
function(){

if(
pickupLat!==null&&
pickupLng!==null
){

map.setView(
[
pickupLat,
pickupLng
],
15
);

}

}
);


/* =====================================================
   SI EL CLIENTE SELECCIONA ENTREGA
   VOLVER A CENTRAR MAPA
   ===================================================== */

destinationInput.addEventListener(
"focus",
function(){

if(
destinationLat!==null&&
destinationLng!==null
){

map.setView(
[
destinationLat,
destinationLng
],
15
);

}

}
);


/* =====================================================
   MENSAJE FINAL INICIAL
   ===================================================== */

mapMessage.innerText=
"Escribe las colonias para cotizar";


mostrarEstado(
"Selecciona una colonia de cada campo."
);

   FIN DEL JAVASCRIPT
   ===================================================== */

</script>
