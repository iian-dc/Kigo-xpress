<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Moto Mandado</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

*{
box-sizing:border-box
}

body{
margin:0;
padding:0;
font-family:Arial,sans-serif;
background:#f3f3f3;
color:#222
}

.app{
width:100%;
max-width:600px;
margin:auto;
background:#fff;
min-height:100vh
}

.map-container{
position:relative
}

#map{
width:100%;
height:55vh;
min-height:350px
}

.map-message{
position:absolute;
top:15px;
left:50%;
transform:translateX(-50%);
z-index:999;
background:#fff;
padding:9px 14px;
border-radius:20px;
box-shadow:0 2px 10px rgba(0,0,0,.2);
font-size:12px;
font-weight:bold;
white-space:nowrap
}

.panel{
background:#fff;
padding:16px;
border-radius:22px 22px 0 0;
margin-top:-22px;
position:relative;
z-index:1000;
box-shadow:0 -4px 18px rgba(0,0,0,.15)
}

.title{
font-size:21px;
font-weight:bold;
margin-bottom:5px
}

.subtitle{
font-size:13px;
color:#777;
margin-bottom:15px;
line-height:18px
}

.step{
padding:13px;
border-radius:13px;
background:#f5f5f5;
margin-bottom:10px;
position:relative
}

.step-title{
font-size:12px;
color:#777;
margin-bottom:7px;
font-weight:bold
}

.input-wrapper{
position:relative
}

.colonia-input{
width:100%;
border:1px solid #ddd;
background:#fff;
padding:13px;
border-radius:10px;
font-size:14px;
font-weight:bold;
outline:none;
color:#222
}

.colonia-input:focus{
border-color:#f5c400;
box-shadow:0 0 0 2px rgba(245,196,0,.15)
}

.colonia-input::placeholder{
color:#aaa;
font-weight:normal
}

.suggestions{
position:absolute;
left:0;
right:0;
top:calc(100% + 5px);
background:#fff;
border:1px solid #ddd;
border-radius:12px;
box-shadow:0 5px 18px rgba(0,0,0,.18);
z-index:5000;
overflow:hidden;
display:none;
max-height:240px;
overflow-y:auto
}

.suggestions.show{
display:block
}

.suggestion{
padding:12px 13px;
border-bottom:1px solid #eee;
font-size:13px;
font-weight:bold;
background:#fff;
cursor:pointer
}

.suggestion:last-child{
border-bottom:none
}

.suggestion:active{
background:#f5c400
}

.suggestion-name{
font-size:14px;
color:#222
}

.suggestion-location{
font-size:11px;
color:#888;
margin-top:3px;
font-weight:normal
}

.suggestion-loading{
padding:13px;
font-size:12px;
color:#777;
text-align:center
}

.suggestion-empty{
padding:13px;
font-size:12px;
color:#777;
text-align:center
}

.calculate{
width:100%;
border:1px solid #e0b400;
padding:14px;
border-radius:12px;
margin-top:2px;
background:linear-gradient(
135deg,
#ffd83d,
#f5c400
);
color:#111;
font-size:14px;
font-weight:bold;
box-shadow:0 4px 10px rgba(0,0,0,.12);
cursor:pointer
}

.calculate:active{
transform:scale(.98)
}

.calculate:disabled{
opacity:.7;
cursor:not-allowed
}

.info{
display:flex;
gap:8px;
margin-top:10px
}

.info-box{
flex:1;
background:#f5f5f5;
padding:12px 8px;
border-radius:12px;
text-align:center
}

.info-label{
font-size:11px;
color:#777
}

.info-value{
font-size:16px;
font-weight:bold;
margin-top:5px
}

.price{
margin-top:12px;
padding:15px;
background:#111;
color:#fff;
border-radius:14px;
display:flex;
justify-content:space-between;
align-items:center
}

.price-label{
font-size:13px
}

.price-value{
font-size:24px;
font-weight:bold
}

.confirm{
width:100%;
border:none;
padding:16px;
border-radius:14px;
margin-top:14px;
background:#f5c400;
color:#111;
font-size:17px;
font-weight:bold;
box-shadow:0 4px 10px rgba(245,196,0,.25)
}

.confirm:disabled{
background:#aaa;
color:#fff;
box-shadow:none
}

.status{
text-align:center;
font-size:12px;
color:#777;
margin-top:9px;
min-height:18px
}

.pickup-icon,
.destination-icon{
width:38px;
height:38px;
border-radius:50% 50% 50% 0;
transform:rotate(-45deg);
display:flex;
align-items:center;
justify-content:center;
box-shadow:0 3px 10px rgba(0,0,0,.35);
border:3px solid white
}

.pickup-icon{
background:#f5c400
}

.destination-icon{
background:#111
}

.marker-dot{
width:11px;
height:11px;
background:white;
border-radius:50%
}

.loading-screen{
position:fixed;
inset:0;
background:rgba(255,255,255,.97);
z-index:99999;
display:none;
align-items:center;
justify-content:center;
flex-direction:column;
text-align:center
}

.loading-screen.show{
display:flex
}

.loading-title{
font-size:21px;
font-weight:bold;
margin-top:18px
}

.loading-text{
font-size:13px;
color:#777;
margin-top:7px
}

.road{
width:260px;
height:7px;
background:#222;
border-radius:10px;
position:relative;
margin-top:45px
}

.road:before{
content:"";
position:absolute;
left:0;
right:0;
top:2px;
border-top:3px dashed #f5c400
}

.moto{
position:absolute;
left:-50px;
top:-34px;
font-size:40px;
animation:motoMove 4.5s linear infinite
}

.loading-dot{
display:flex;
gap:6px;
margin-top:20px
}

.loading-dot span{
width:7px;
height:7px;
background:#f5c400;
border-radius:50%;
animation:blink 1s infinite
}

.loading-dot span:nth-child(2){
animation-delay:.2s
}

.loading-dot span:nth-child(3){
animation-delay:.4s
}

@keyframes motoMove{

0%{
left:-50px;
transform:scaleX(1)
}

45%{
left:120px;
transform:scaleX(1)
}

50%{
left:120px;
transform:scaleX(-1)
}

95%{
left:-50px;
transform:scaleX(-1)
}

100%{
left:-50px;
transform:scaleX(1)
}

}

@keyframes blink{

0%,100%{
opacity:.25
}

50%{
opacity:1
}

}

</style>

</head>

<body>

<div class="map-container">

<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>

<script>

const TARIFA_CENTRO_CENTRO=35;

const TARIFA_BASE=35;

const DISTANCIA_BASE_METROS=750;

const INCREMENTO_POR_TRAMO=5;

const TRAMO_ADICIONAL_METROS=750;

const NUMERO_WHATSAPP="524182371993";

let pickupLat=null;

let pickupLng=null;

let destinationLat=null;

let destinationLng=null;

let pickupAddress="";

let destinationAddress="";

let pickupNombreColonia="";

let destinationNombreColonia="";

let pickupMarker=null;

let destinationMarker=null;

let routeLayer=null;

let precioServicio=0;

const map=L.map(
"map",
{
zoomControl:false,
attributionControl:true
}
);

L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{
maxZoom:19,
attribution:"© OpenStreetMap"
}
).addTo(map);

map.setView(
[21.1561,-100.9333],
14
);/* =====================================================
   PARTE 2 DE 4
   COLONIAS + SUGERENCIAS + MARCADORES
   ===================================================== */

const pickupInput=
document.getElementById("pickupInput");

const destinationInput=
document.getElementById("destinationInput");

const pickupSuggestions=
document.getElementById("pickupSuggestions");

const destinationSuggestions=
document.getElementById("destinationSuggestions");

const calculateButton=
document.getElementById("calculateButton");

const confirmButton=
document.getElementById("confirmButton");

const distance=
document.getElementById("distance");

const duration=
document.getElementById("duration");

const price=
document.getElementById("price");

const status=
document.getElementById("status");

const mapMessage=
document.getElementById("mapMessage");


/* =====================================================
   NORMALIZAR TEXTO
   ===================================================== */

function normalizarTexto(texto){

return texto
.toLowerCase()
.normalize("NFD")
.replace(/[\u0300-\u036f]/g,"")
.trim();

}


/* =====================================================
   SABER SI ES CENTRO
   ===================================================== */

function esCentro(nombre){

if(!nombre){
return false;
}

const texto=
normalizarTexto(nombre);

return(
texto==="centro"||
texto.includes("centro")
);

}


/* =====================================================
   PRECIO SEGÚN DISTANCIA
   ===================================================== */

function calcularPrecioPorDistancia(kilometros){

const metros=
kilometros*1000;


/*
   HASTA 750 METROS
   = $35
*/

if(
metros<=DISTANCIA_BASE_METROS
){

return TARIFA_BASE;

}


/*
   METROS QUE SOBRAN
*/

const metrosAdicionales=
metros-
DISTANCIA_BASE_METROS;


/*
   CADA 750 METROS
   SUMA $5
*/

const tramos=
Math.ceil(
metrosAdicionales/
TRAMO_ADICIONAL_METROS
);


return(
TARIFA_BASE+
(
tramos*
INCREMENTO_POR_TRAMO
)
);

}


/* =====================================================
   PRECIO FINAL
   ===================================================== */

function calcularPrecioFinal(kilometros){

/*
   CENTRO A CENTRO
   SIEMPRE $35
*/

if(
esCentro(pickupNombreColonia)&&
esCentro(destinationNombreColonia)
){

return TARIFA_CENTRO_CENTRO;

}


/*
   TODAS LAS DEMÁS RUTAS
   SE COBRAN POR DISTANCIA
*/

return calcularPrecioPorDistancia(
kilometros
);

}


/* =====================================================
   ICONO DE RECOGIDA
   ===================================================== */

function crearIconoRecogida(){

return L.divIcon({

className:"",

html:
'<div class="pickup-icon">'+
'<div class="marker-dot"></div>'+
'</div>',

iconSize:[38,38],

iconAnchor:[19,38]

});

}


/* =====================================================
   ICONO DE DESTINO
   ===================================================== */

function crearIconoDestino(){

return L.divIcon({

className:"",

html:
'<div class="destination-icon">'+
'<div class="marker-dot"></div>'+
'</div>',

iconSize:[38,38],

iconAnchor:[19,38]

});

}


/* =====================================================
   MARCADOR DE RECOGIDA
   ===================================================== */

function colocarMarcadorRecogida(){

if(
pickupLat===null||
pickupLng===null
){

return;

}

if(pickupMarker){

map.removeLayer(
pickupMarker
);

}

pickupMarker=
L.marker(
[
pickupLat,
pickupLng
],
{
icon:
crearIconoRecogida()
}
).addTo(map);

pickupMarker.bindPopup(
"<b>RECOGIDA</b><br>"+
pickupNombreColonia
);

}


/* =====================================================
   MARCADOR DE ENTREGA
   ===================================================== */

function colocarMarcadorEntrega(){

if(
destinationLat===null||
destinationLng===null
){

return;

}

if(destinationMarker){

map.removeLayer(
destinationMarker
);

}

destinationMarker=
L.marker(
[
destinationLat,
destinationLng
],
{
icon:
crearIconoDestino()
}
).addTo(map);

destinationMarker.bindPopup(
"<b>ENTREGA</b><br>"+
destinationNombreColonia
);

}


/* =====================================================
   LIMPIAR RUTA
   ===================================================== */

function limpiarRuta(){

if(routeLayer){

map.removeLayer(
routeLayer
);

routeLayer=null;

}

}


/* =====================================================
   BUSCAR COLONIAS EN DOLORES HIDALGO
   ===================================================== */

async function buscarColonias(texto){

if(
!texto||
texto.trim().length<2
){

return [];

}

const consulta=
encodeURIComponent(
texto+
", Dolores Hidalgo, Guanajuato, Mexico"
);

const url=
"https://nominatim.openstreetmap.org/search"+
"?format=json"+
"&q="+consulta+
"&limit=8"+
"&countrycodes=mx"+
"&addressdetails=1"+
"&accept-language=es";

try{

const respuesta=
await fetch(url);

const resultados=
await respuesta.json();


/*
   SOLO MOSTRAR RESULTADOS
   DE DOLORES HIDALGO
*/

return resultados.filter(
function(resultado){

return normalizarTexto(
resultado.display_name||""
).includes(
"dolores hidalgo"
);

}
);

}catch(error){

console.log(
"Error buscando colonia:",
error
);

return [];

}

}


/* =====================================================
   MOSTRAR SUGERENCIAS
   ===================================================== */

function mostrarSugerencias(
contenedor,
resultados,
tipo
){

contenedor.innerHTML="";


if(!resultados.length){

contenedor.innerHTML=
'<div class="suggestion-empty">'+
'No encontramos esa colonia en Dolores Hidalgo.'+
'</div>';

contenedor.classList.add("show");

return;

}


resultados.forEach(
function(resultado){

const elemento=
document.createElement("div");

elemento.className=
"suggestion";


const nombre=
resultado.name||
resultado.display_name
.split(",")[0];


elemento.innerHTML=
'<div class="suggestion-name">'+
nombre+
'</div>'+
'<div class="suggestion-location">'+
'Dolores Hidalgo, Guanajuato'+
'</div>';


elemento.addEventListener(
"click",
function(){

seleccionarColonia(
resultado,
nombre,
tipo
);

}
);


contenedor.appendChild(
elemento
);

}
);


contenedor.classList.add("show");

}


/* =====================================================
   SELECCIONAR COLONIA
   ===================================================== */

function seleccionarColonia(
resultado,
nombre,
tipo
){

const lat=
parseFloat(
resultado.lat
);

const lng=
parseFloat(
resultado.lon
);


if(tipo==="pickup"){

pickupNombreColonia=
nombre;

pickupLat=
lat;

pickupLng=
lng;

pickupAddress=
resultado.display_name||
nombre+
", Dolores Hidalgo, Guanajuato";


pickupInput.value=
nombre;

pickupSuggestions.classList.remove(
"show"
);

colocarMarcadorRecogida();

map.setView(
[
lat,
lng
],
15
);

mapMessage.innerText=
"Recogida: "+
nombre;


}else{

destinationNombreColonia=
nombre;

destinationLat=
lat;

destinationLng=
lng;

destinationAddress=
resultado.display_name||
nombre+
", Dolores Hidalgo, Guanajuato";


destinationInput.value=
nombre;

destinationSuggestions.classList.remove(
"show"
);

colocarMarcadorEntrega();

map.setView(
[
lat,
lng
],
15
);

mapMessage.innerText=
"Entrega: "+
nombre;

}


actualizarEstadoSeleccion();

}


/* =====================================================
   ACTUALIZAR ESTADO
   ===================================================== */

function actualizarEstadoSeleccion(){

if(
pickupLat!==null&&
destinationLat!==null
){

mapMessage.innerText=
"Pulsa CALCULAR COTIZACIÓN";

status.innerText=
"Las dos colonias están seleccionadas.";

return;

}


if(
pickupLat!==null
){

mapMessage.innerText=
"Ahora selecciona la colonia de entrega";

status.innerText=
"Selecciona la colonia de entrega.";

return;

}


mapMessage.innerText=
"Selecciona la colonia de recogida";

status.innerText=
"Selecciona la colonia de recogida.";

}


/* =====================================================
   FIN DE LA PARTE 2
   ===================================================== */
   /* =====================================================
   PARTE 3 DE 4
   AUTOCOMPLETADO + RUTA + COTIZACIÓN
   ===================================================== */


/* =====================================================
   AUTOCOMPLETADO DE RECOGIDA
   ===================================================== */

let timerPickup=null;

pickupInput.addEventListener(
"input",
function(){

const texto=
this.value.trim();


/*
   Al modificar el texto,
   se elimina la selección anterior.
*/

pickupLat=null;
pickupLng=null;
pickupAddress="";
pickupNombreColonia="";


if(pickupMarker){

map.removeLayer(
pickupMarker
);

pickupMarker=null;

}


/*
   Limpiar cotización anterior
*/

distance.innerText="—";

duration.innerText="—";

price.innerText="POR COTIZAR";

precioServicio=0;

confirmButton.disabled=true;

limpiarRuta();


if(timerPickup){

clearTimeout(
timerPickup
);

}


if(texto.length<2){

pickupSuggestions.innerHTML="";

pickupSuggestions.classList.remove(
"show"
);

actualizarEstadoSeleccion();

return;

}


pickupSuggestions.innerHTML=
'<div class="suggestion-loading">'+
'Buscando colonias...'+
'</div>';

pickupSuggestions.classList.add(
"show"
);


timerPickup=
setTimeout(
async function(){

const resultados=
await buscarColonias(
texto
);

mostrarSugerencias(
pickupSuggestions,
resultados,
"pickup"
);

},
350
);

}
);


/* =====================================================
   AUTOCOMPLETADO DE ENTREGA
   ===================================================== */

let timerDestination=null;

destinationInput.addEventListener(
"input",
function(){

const texto=
this.value.trim();


/*
   Al modificar el texto,
   se elimina la selección anterior.
*/

destinationLat=null;
destinationLng=null;
destinationAddress="";
destinationNombreColonia="";


if(destinationMarker){

map.removeLayer(
destinationMarker
);

destinationMarker=null;

}


/*
   Limpiar cotización anterior
*/

distance.innerText="—";

duration.innerText="—";

price.innerText="POR COTIZAR";

precioServicio=0;

confirmButton.disabled=true;

limpiarRuta();


if(timerDestination){

clearTimeout(
timerDestination
);

}


if(texto.length<2){

destinationSuggestions.innerHTML="";

destinationSuggestions.classList.remove(
"show"
);

actualizarEstadoSeleccion();

return;

}


destinationSuggestions.innerHTML=
'<div class="suggestion-loading">'+
'Buscando colonias...'+
'</div>';

destinationSuggestions.classList.add(
"show"
);


timerDestination=
setTimeout(
async function(){

const resultados=
await buscarColonias(
texto
);

mostrarSugerencias(
destinationSuggestions,
resultados,
"destination"
);

},
350
);

}
);


/* =====================================================
   CERRAR SUGERENCIAS
   ===================================================== */

document.addEventListener(
"click",
function(e){

if(
!pickupInput.contains(e.target)&&
!pickupSuggestions.contains(e.target)
){

pickupSuggestions.classList.remove(
"show"
);

}


if(
!destinationInput.contains(e.target)&&
!destinationSuggestions.contains(e.target)
){

destinationSuggestions.classList.remove(
"show"
);

}

}
);


/* =====================================================
   CALCULAR LA RUTA
   ===================================================== */

async function calcularRuta(){

if(
pickupLat===null||
pickupLng===null||
destinationLat===null||
destinationLng===null
){

status.innerText=
"Selecciona las dos colonias antes de calcular.";

return false;

}


calculateButton.disabled=true;

calculateButton.innerText=
"CALCULANDO...";

status.innerText=
"Calculando ruta entre las colonias...";


const url=
"https://router.project-osrm.org/route/v1/driving/"+
pickupLng+
","+
pickupLat+
";"+
destinationLng+
","+
destinationLat+
"?overview=full&geometries=geojson";


try{

const respuesta=
await fetch(url);

const datos=
await respuesta.json();


if(
!datos.routes||
!datos.routes.length
){

status.innerText=
"No encontramos una ruta.";

calculateButton.disabled=false;

calculateButton.innerText=
"CALCULAR COTIZACIÓN";

return false;

}


const ruta=
datos.routes[0];


/* =====================================================
   DISTANCIA
   ===================================================== */

const kilometros=
ruta.distance/1000;

distance.innerText=
kilometros.toFixed(2)+
" km";


/* =====================================================
   TIEMPO
   ===================================================== */

const minutos=
Math.max(
1,
Math.round(
ruta.duration/60
)
);

let tiempoTexto="";


if(minutos<60){

tiempoTexto=
minutos+
" min";

}else{

const horas=
Math.floor(
minutos/60
);

const minutosRestantes=
minutos%60;


if(
minutosRestantes===0
){

tiempoTexto=
horas+
(
horas===1
?
" hora"
:
" horas"
);

}else{

tiempoTexto=
horas+
(
horas===1
?
" hora "
:
" horas "
)+
minutosRestantes+
" min";

}

}


duration.innerText=
tiempoTexto;


/* =====================================================
   ELIMINAR RUTA ANTERIOR
   ===================================================== */

limpiarRuta();


/* =====================================================
   DIBUJAR RUTA EN EL MAPA
   ===================================================== */

routeLayer=
L.geoJSON(
ruta.geometry,
{

style:{
color:"#f5c400",
weight:6,
opacity:.9
}

}
).addTo(map);


/* =====================================================
   MARCADORES
   ===================================================== */

colocarMarcadorRecogida();

colocarMarcadorEntrega();


/* =====================================================
   MOSTRAR TODA LA RUTA
   ===================================================== */

map.fitBounds(
routeLayer.getBounds(),
{
padding:[
45,
45
]
}
);


/* =====================================================
   CALCULAR PRECIO
   ===================================================== */

precioServicio=
calcularPrecioFinal(
kilometros
);


/* =====================================================
   MOSTRAR PRECIO
   ===================================================== */

price.innerText=
"$"+
Math.round(
precioServicio
);


/* =====================================================
   MENSAJE
   ===================================================== */

if(
esCentro(
pickupNombreColonia
)&&
esCentro(
destinationNombreColonia
)
){

status.innerText=
"Centro → Centro: tarifa especial de $35.";

}else{

status.innerText=
"Cotización calculada correctamente.";

}


/* =====================================================
   HABILITAR CONFIRMACIÓN
   ===================================================== */

confirmButton.disabled=false;


/* =====================================================
   ACTUALIZAR GLIDE
   ===================================================== */

actualizarGlide();


calculateButton.disabled=false;

calculateButton.innerText=
"ACTUALIZAR COTIZACIÓN";


return true;


}catch(error){

console.log(
"Error de ruta:",
error
);

status.innerText=
"No se pudo calcular la ruta.";

calculateButton.disabled=false;

calculateButton.innerText=
"CALCULAR COTIZACIÓN";

return false;

}

}


/* =====================================================
   BOTÓN CALCULAR COTIZACIÓN
   ===================================================== */

calculateButton.addEventListener(
"click",
function(){

if(
pickupLat===null
){

alert(
"Primero escribe y selecciona la colonia de recogida."
);

pickupInput.focus();

return;

}


if(
destinationLat===null
){

alert(
"Primero escribe y selecciona la colonia de entrega."
);

destinationInput.focus();

return;

}


calcularRuta();

});

   URL DE GOOGLE MAPS

pickupLng===null||
destinationLat===null||
destinationLng===null
){

return(
"https://www.google.com/maps/dir/?api=1"+

/* =====================================================

   return(

","+

destinationLat+
","+

);

/* =====================================================
   OBTENER NÚMERO DE SERVICIO
   ===================================================== */

function obtenerNumeroServicio(){

const ahora=
new Date();

const fecha=
ahora.getFullYear().toString()+
String(
ahora.getMonth()+1
).padStart(2,"0")+
String(
ahora.getDate()
).padStart(2,"0");

const hora=
String(
ahora.getHours()
).padStart(2,"0")+
String(
ahora.getMinutes()
).padStart(2,"0")+
String(
ahora.getSeconds()
).padStart(2,"0");

const aleatorio=
Math.floor(
100+
Math.random()*900
);

return(
"MM-"+
fecha+
"-"+
hora+
"-"+
aleatorio
);

}


/* =====================================================
   FECHA Y HORA
   ===================================================== */

function obtenerFechaHora(){

return new Date()
.toLocaleString(
"es-MX",
{
day:"2-digit",
month:"2-digit",
year:"numeric",
hour:"2-digit",
minute:"2-digit",
second:"2-digit",
hour12:false
}
);

}


/* =====================================================
   OBTENER DATOS
   ===================================================== */

function obtenerDatos(
numeroServicio
){

return{

numero_servicio:
numeroServicio,

tipo_servicio:
"Moto Mandado",

ciudad:
"Dolores Hidalgo",

fecha_hora:
obtenerFechaHora(),

colonia_recogida:
pickupNombreColonia,

direccion_recogida:
pickupAddress,

latitud_recogida:
pickupLat,

longitud_recogida:
pickupLng,

colonia_entrega:
destinationNombreColonia,

direccion_entrega:
destinationAddress,

latitud_entrega:
destinationLat,

longitud_entrega:
destinationLng,

distancia:
distance.innerText,

tiempo_estimado:
duration.innerText,

valor_servicio:
price.innerText,

url_google_maps:
crearUrlGoogleMaps(),

estado:
"Pendiente"

};

}
