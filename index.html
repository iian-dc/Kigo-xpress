<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Moto Mandado</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

*{
box-sizing:border-box
}

body{
margin:0;
padding:0;
font-family:Arial,sans-serif;
background:#f3f3f3;
color:#222
}

.app{
width:100%;
max-width:600px;
margin:auto;
background:#fff;
min-height:100vh
}

/* MAPA */

#map{
width:100%;
height:52vh;
min-height:330px
}

.map-container{
position:relative
}

.map-message{
position:absolute;
top:15px;
left:50%;
transform:translateX(-50%);
z-index:999;
background:#fff;
padding:9px 14px;
border-radius:20px;
box-shadow:0 2px 10px rgba(0,0,0,.2);
font-size:12px;
font-weight:bold;
white-space:nowrap
}

/* PANEL */

.panel{
background:#fff;
padding:16px;
border-radius:22px 22px 0 0;
margin-top:-22px;
position:relative;
z-index:1000;
box-shadow:0 -4px 18px rgba(0,0,0,.15)
}

.title{
font-size:21px;
font-weight:bold;
margin-bottom:5px
}

.subtitle{
font-size:13px;
color:#777;
margin-bottom:15px;
line-height:18px
}

/* CAMPOS */

.step{
padding:13px;
border-radius:13px;
background:#f5f5f5;
margin-bottom:10px;
position:relative
}

.step-title{
font-size:12px;
color:#777;
margin-bottom:7px;
font-weight:bold
}

.colonia-input{
width:100%;
border:1px solid #ddd;
background:#fff;
padding:13px;
border-radius:10px;
font-size:14px;
font-weight:bold;
outline:none;
color:#222
}

.colonia-input:focus{
border-color:#f5c400;
box-shadow:0 0 0 2px rgba(245,196,0,.15)
}

.colonia-input::placeholder{
color:#aaa;
font-weight:normal
}

/* BOTON CALCULAR */

.calculate{
width:100%;
border:none;
padding:15px;
border-radius:13px;
margin-top:3px;
background:linear-gradient(135deg,#ffd83d,#f5c400);
color:#111;
font-size:15px;
font-weight:bold;
box-shadow:0 4px 10px rgba(245,196,0,.25);
cursor:pointer
}

.calculate:active{
transform:scale(.98)
}

.calculate:disabled{
background:#aaa;
color:#fff;
box-shadow:none
}

/* INFORMACION */

.info{
display:flex;
gap:8px;
margin-top:12px
}

.info-box{
flex:1;
background:#f5f5f5;
padding:12px 8px;
border-radius:12px;
text-align:center
}

.info-label{
font-size:10px;
color:#777;
font-weight:bold
}

.info-value{
font-size:16px;
font-weight:bold;
margin-top:5px
}

/* PRECIO */

.price{
margin-top:12px;
padding:15px;
background:#111;
color:#fff;
border-radius:14px;
display:flex;
justify-content:space-between;
align-items:center
}

.price-label{
font-size:13px
}

.price-value{
font-size:24px;
font-weight:bold
}

/* CONFIRMAR */

.confirm{
width:100%;
border:none;
padding:16px;
border-radius:14px;
margin-top:14px;
background:#f5c400;
color:#111;
font-size:17px;
font-weight:bold;
box-shadow:0 4px 10px rgba(245,196,0,.25)
}

.confirm:disabled{
background:#aaa;
color:#fff;
box-shadow:none
}

/* ESTADO */

.status{
text-align:center;
font-size:12px;
color:#777;
margin-top:9px;
min-height:18px
}

/* MARCADORES */

.colonia-marker{
width:34px;
height:34px;
border-radius:50% 50% 50% 0;
transform:rotate(-45deg);
display:flex;
align-items:center;
justify-content:center;
box-shadow:0 3px 10px rgba(0,0,0,.35);
border:3px solid white
}

.colonia-marker span{
width:9px;
height:9px;
background:white;
border-radius:50%
}

.pickup-marker{
background:#f5c400
}

.delivery-marker{
background:#111
}

/* PANTALLA DE CARGA */

.loading-screen{
position:fixed;
inset:0;
background:rgba(255,255,255,.97);
z-index:99999;
display:none;
align-items:center;
justify-content:center;
flex-direction:column;
text-align:center
}

.loading-screen.show{
display:flex
}

.loading-title{
font-size:21px;
font-weight:bold;
margin-top:18px
}

.loading-text{
font-size:13px;
color:#777;
margin-top:7px
}

.road{
width:260px;
height:7px;
background:#222;
border-radius:10px;
position:relative;
margin-top:45px
}

.road:before{
content:"";
position:absolute;
left:0;
right:0;
top:2px;
border-top:3px dashed #f5c400
}

.moto{
position:absolute;
left:-50px;
top:-34px;
font-size:40px;
animation:motoMove 4.5s linear infinite
}

.loading-dot{
display:flex;
gap:6px;
margin-top:20px
}

.loading-dot span{
width:7px;
height:7px;
background:#f5c400;
border-radius:50%;
animation:blink 1s infinite
}

.loading-dot span:nth-child(2){
animation-delay:.2s
}

.loading-dot span:nth-child(3){
animation-delay:.4s
}

@keyframes motoMove{

0%{
left:-50px;
transform:scaleX(1)
}

45%{
left:120px;
transform:scaleX(1)
}

50%{
left:120px;
transform:scaleX(-1)
}

95%{
left:-50px;
transform:scaleX(-1)
}

100%{
left:-50px;
transform:scaleX(1)
}

}

@keyframes blink{

0%,100%{
opacity:.25
}

50%{
opacity:1
}

}

@media(max-width:480px){

#map{
height:50vh;
min-height:310px
}

.panel{
padding:14px
}

.title{
font-size:20px
}

}

</style>

</head>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* =====================================================
   CONFIGURACIÓN
   ===================================================== */

const CIUDAD="Dolores Hidalgo";

const ESTADO="Guanajuato";

const PAIS="Mexico";

const NUMERO_WHATSAPP="524182371993";


/* =====================================================
   PRECIOS POR COLONIA
   ===================================================== */

const PRECIOS_ZONA={

"Centro":35

};


/* =====================================================
   VARIABLES
   ===================================================== */

let pickupLat=null;

let pickupLng=null;

let destinationLat=null;

let destinationLng=null;

let pickupAddress="";

let destinationAddress="";

let pickupNombreColonia="";

let destinationNombreColonia="";

let pickupMarker=null;

let destinationMarker=null;

let routeLayer=null;

let precioServicio=0;


/* =====================================================
   MAPA
   ===================================================== */

const map=L.map("map",{

zoomControl:false,

attributionControl:true

});

L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{

maxZoom:19,

attribution:"© OpenStreetMap"

}
).addTo(map);


/* CENTRO DE DOLORES HIDALGO */

map.setView(
[21.1561,-100.9333],
14
);


/* =====================================================
   ELEMENTOS
   ===================================================== */

const pickupInput=
document.getElementById("pickupInput");

const destinationInput=
document.getElementById("destinationInput");

const calculateButton=
document.getElementById("calculateButton");

const confirmButton=
document.getElementById("confirmButton");

const status=
document.getElementById("status");

const distance=
document.getElementById("distance");

const duration=
document.getElementById("duration");

const price=
document.getElementById("price");

const mapMessage=
document.getElementById("mapMessage");


/* =====================================================
   NORMALIZAR TEXTO
   ===================================================== */

function normalizarTexto(texto){

return texto
.toLowerCase()
.normalize("NFD")
.replace(/[\u0300-\u036f]/g,"")
.trim();

}


/* =====================================================
   BUSCAR PRECIO
   ===================================================== */

function obtenerPrecioZona(nombre){

if(!nombre){

return null;

}

const buscado=
normalizarTexto(nombre);

for(
const colonia in PRECIOS_ZONA
){

if(
normalizarTexto(colonia)===buscado
){

return PRECIOS_ZONA[colonia];

}

}

return null;

}


/* =====================================================
   ICONO DE RECOGIDA
   ===================================================== */

function crearIconoRecogida(){

return L.divIcon({

className:"",

html:
'<div class="colonia-marker pickup-marker">'+
'<span></span>'+
'</div>',

iconSize:[34,34],

iconAnchor:[17,34]

});

}


/* =====================================================
   ICONO DE ENTREGA
   ===================================================== */

function crearIconoEntrega(){

return L.divIcon({

className:"",

html:
'<div class="colonia-marker delivery-marker">'+
'<span></span>'+
'</div>',

iconSize:[34,34],

iconAnchor:[17,34]

});

}


/* =====================================================
   COLOCAR RECOGIDA
   ===================================================== */

function colocarRecogida(lat,lng){

if(pickupMarker){

map.removeLayer(
pickupMarker
);

}

pickupMarker=
L.marker(
[lat,lng],
{
icon:
crearIconoRecogida()
}
).addTo(map);

pickupMarker.bindPopup(
"<b>Recogida</b><br>"+
pickupNombreColonia
);

}


/* =====================================================
   COLOCAR ENTREGA
   ===================================================== */

function colocarEntrega(lat,lng){

if(destinationMarker){

map.removeLayer(
destinationMarker
);

}

destinationMarker=
L.marker(
[lat,lng],
{
icon:
crearIconoEntrega()
}
).addTo(map);

destinationMarker.bindPopup(
"<b>Entrega</b><br>"+
destinationNombreColonia
);

}


/* =====================================================
   LIMPIAR RUTA
   ===================================================== */

function limpiarRuta(){

if(routeLayer){

map.removeLayer(
routeLayer
);

routeLayer=null;

}

}


/* =====================================================
   MOSTRAR ESTADO
   ===================================================== */

function mostrarEstado(texto){

status.innerText=
texto;

}


/* =====================================================
   CAMBIO EN RECOGIDA
   ===================================================== */

pickupInput.addEventListener(
"input",
function(){

pickupLat=null;

pickupLng=null;

pickupAddress="";

pickupNombreColonia=
this.value.trim();

if(pickupMarker){

map.removeLayer(
pickupMarker
);

pickupMarker=null;

}

limpiarRuta();

distance.innerText="—";

duration.innerText="—";

price.innerText="$0";

confirmButton.disabled=true;

mostrarEstado("");

}
);


/* =====================================================
   CAMBIO EN ENTREGA
   ===================================================== */

destinationInput.addEventListener(
"input",
function(){

destinationLat=null;

destinationLng=null;

destinationAddress="";

destinationNombreColonia=
this.value.trim();

if(destinationMarker){

map.removeLayer(
destinationMarker
);

destinationMarker=null;

}

limpiarRuta();

distance.innerText="—";

duration.innerText="—";

price.innerText="$0";

confirmButton.disabled=true;

mostrarEstado("");

}
);


/* =====================================================
   DATOS PARA GLIDE
   ===================================================== */

function obtenerDatos(){

return{

tipo_servicio:
"Moto Mandado",

ciudad:
"Dolores Hidalgo",

colonia_recogida:
pickupNombreColonia,

latitud_recogida:
pickupLat,

longitud_recogida:
pickupLng,

colonia_entrega:
destinationNombreColonia,

latitud_entrega:
destinationLat,

longitud_entrega:
destinationLng,

direccion_recogida:
pickupAddress,

direccion_entrega:
destinationAddress,

distancia:
distance.innerText,

tiempo_estimado:
duration.innerText,

valor_servicio:
price.innerText,

estado:
"Pendiente"

};

}


/* =====================================================
   ENVIAR A GLIDE
   ===================================================== */

function actualizarGlide(){

window.parent.postMessage({

type:
"MOTO_MANDADO_DATA",

data:
obtenerDatos()

},"*");

}


/* =====================================================
   HASTA AQUÍ LLEGA LA PARTE 1
   ===================================================== */
  /* =====================================================
   BUSCAR COLONIA EN DOLORES HIDALGO
   ===================================================== */

async function buscarColoniaDolores(nombre){

if(!nombre){

return null;

}

const consulta=
encodeURIComponent(
nombre+
", Dolores Hidalgo, Guanajuato, Mexico"
);

const url=
"https://nominatim.openstreetmap.org/search"+
"?format=json"+
"&q="+consulta+
"&limit=8"+
"&countrycodes=mx"+
"&addressdetails=1"+
"&accept-language=es";

try{

const respuesta=
await fetch(url);

const resultados=
await respuesta.json();

if(!resultados.length){

return null;

}


/*
   Buscamos específicamente
   un resultado de Dolores Hidalgo.
*/

for(
const resultado of resultados
){

const texto=
normalizarTexto(
resultado.display_name||""
);

if(
texto.includes(
"dolores hidalgo"
)
){

return resultado;

}

}


/*
   Si no encontramos coincidencia exacta,
   usamos el primer resultado.
*/

return resultados[0];

}catch(error){

console.log(
"Error buscando colonia:",
error
);

return null;

}

}


/* =====================================================
   BUSCAR LOS DOS PUNTOS
   ===================================================== */

async function buscarPuntos(){

const recogida=
pickupInput.value.trim();

const entrega=
destinationInput.value.trim();


/* VALIDAR RECOGIDA */

if(!recogida){

alert(
"Escribe la colonia donde vamos a recoger el mandado."
);

pickupInput.focus();

return false;

}


/* VALIDAR ENTREGA */

if(!entrega){

alert(
"Escribe la colonia donde vamos a entregar el mandado."
);

destinationInput.focus();

return false;

}


/* DESACTIVAR BOTÓN */

calculateButton.disabled=true;

calculateButton.innerText=
"BUSCANDO COLONIAS...";

mostrarEstado(
"Buscando las colonias en Dolores Hidalgo..."
);


try{

/* BUSCAR RECOGIDA */

const puntoRecogida=
await buscarColoniaDolores(
recogida
);


if(!puntoRecogida){

mostrarEstado("");

alert(
"No encontramos la colonia de recogida.\n\n"+
"Escribe solamente el nombre de una colonia de Dolores Hidalgo."
);

calculateButton.disabled=false;

calculateButton.innerText=
"CALCULAR COTIZACIÓN";

return false;

}


/* BUSCAR ENTREGA */

const puntoEntrega=
await buscarColoniaDolores(
entrega
);


if(!puntoEntrega){

mostrarEstado("");

alert(
"No encontramos la colonia de entrega.\n\n"+
"Escribe solamente el nombre de una colonia de Dolores Hidalgo."
);

calculateButton.disabled=false;

calculateButton.innerText=
"CALCULAR COTIZACIÓN";

return false;

}


/* =====================================================
   COORDENADAS DE RECOGIDA
   ===================================================== */

pickupLat=
parseFloat(
puntoRecogida.lat
);

pickupLng=
parseFloat(
puntoRecogida.lon
);


/* =====================================================
   COORDENADAS DE ENTREGA
   ===================================================== */

destinationLat=
parseFloat(
puntoEntrega.lat
);

destinationLng=
parseFloat(
puntoEntrega.lon
);


/* =====================================================
   GUARDAR NOMBRES
   ===================================================== */

pickupNombreColonia=
recogida;

destinationNombreColonia=
entrega;


/* =====================================================
   DIRECCIONES ENCONTRADAS
   ===================================================== */

pickupAddress=
puntoRecogida.display_name||
recogida+
", Dolores Hidalgo";


destinationAddress=
puntoEntrega.display_name||
entrega+
", Dolores Hidalgo";


/* =====================================================
   COLOCAR MARCADORES
   ===================================================== */

colocarRecogida(
pickupLat,
pickupLng
);

colocarEntrega(
destinationLat,
destinationLng
);


/* =====================================================
   CALCULAR RUTA
   ===================================================== */

await calcularRutaMandado();


calculateButton.disabled=false;

calculateButton.innerText=
"ACTUALIZAR COTIZACIÓN";

return true;


}catch(error){

console.log(error);

mostrarEstado(
"No se pudo localizar alguna de las colonias."
);

calculateButton.disabled=false;

calculateButton.innerText=
"CALCULAR COTIZACIÓN";

return false;

}

}


/* =====================================================
   CALCULAR RUTA GPS
   ===================================================== */

async function calcularRutaMandado(){

if(
pickupLat===null||
pickupLng===null||
destinationLat===null||
destinationLng===null
){

return;

}

mostrarEstado(
"Calculando recorrido..."
);


/* =====================================================
   SERVICIO DE RUTAS OSRM
   ===================================================== */

const url=
"https://router.project-osrm.org/route/v1/driving/"+
pickupLng+
","+
pickupLat+
";"+
destinationLng+
","+
destinationLat+
"?overview=full&geometries=geojson";


try{

const respuesta=
await fetch(url);

const datos=
await respuesta.json();


if(
!datos.routes||
!datos.routes.length
){

mostrarEstado(
"No encontramos una ruta entre estas colonias."
);

return;

}


const ruta=
datos.routes[0];


/* =====================================================
   DISTANCIA
   ===================================================== */

const kilometros=
ruta.distance/1000;

distance.innerText=
kilometros.toFixed(1)+
" km";


/* =====================================================
   TIEMPO
   ===================================================== */

const segundos=
ruta.duration;

const minutos=
Math.max(
1,
Math.round(
segundos/60
)
);

let tiempoTexto;


if(minutos<60){

tiempoTexto=
minutos+
" min";

}else{

const horas=
Math.floor(
minutos/60
);

const minutosRestantes=
minutos%60;


if(minutosRestantes===0){

tiempoTexto=
horas+
(
horas===1
?
" hora"
:
" horas"
);

}else{

tiempoTexto=
horas+
(
horas===1
?
" hora "
:
" horas "
)+
minutosRestantes+
" min";

}

}


duration.innerText=
tiempoTexto;


/* =====================================================
   BORRAR RUTA ANTERIOR
   ===================================================== */

if(routeLayer){

map.removeLayer(
routeLayer
);

routeLayer=null;

}


/* =====================================================
   DIBUJAR RUTA
   ===================================================== */

routeLayer=
L.geoJSON(
ruta.geometry,
{

style:{

weight:6,

opacity:.85

}

}
).addTo(map);


/* =====================================================
   AJUSTAR MAPA
   ===================================================== */

map.fitBounds(
routeLayer.getBounds(),
{

padding:[
45,
45
]

}
);


/* =====================================================
   BUSCAR PRECIOS DE LAS COLONIAS
   ===================================================== */

const precioRecogida=
obtenerPrecioZona(
pickupNombreColonia
);

const precioEntrega=
obtenerPrecioZona(
destinationNombreColonia
);


/* =====================================================
   SI NO EXISTE PRECIO
   ===================================================== */

if(
precioRecogida===null||
precioEntrega===null
){

price.innerText=
"POR COTIZAR";

confirmButton.disabled=true;


let faltante="";


if(
precioRecogida===null
){

faltante=
pickupNombreColonia;

}else{

faltante=
destinationNombreColonia;

}


mostrarEstado(
"La colonia \""+
faltante+
"\" todavía no tiene precio configurado."
);

actualizarGlide();

return;

}


/* =====================================================
   PRECIO DEL SERVICIO
   ===================================================== */


/*
   POR AHORA TOMAMOS EL PRECIO MAYOR
   DE LAS DOS COLONIAS.

   ESTA REGLA LA PODEMOS CAMBIAR
   POR UNA TABLA ORIGEN → DESTINO.
*/

precioServicio=
Math.max(
precioRecogida,
precioEntrega
);


/* =====================================================
   MOSTRAR PRECIO
   ===================================================== */

price.innerText=
"$"+
Math.round(
precioServicio
);


/* =====================================================
   HABILITAR CONFIRMACIÓN
   ===================================================== */

confirmButton.disabled=false;

mostrarEstado(
"Cotización calculada correctamente."
);


/* =====================================================
   ACTUALIZAR GLIDE
   ===================================================== */

actualizarGlide();

}


/* =====================================================
   NÚMERO DEL SERVICIO
   ===================================================== */

function obtenerNumeroServicio(){

const ahora=
new Date();


const fecha=
ahora.getFullYear()+
String(
ahora.getMonth()+1
).padStart(2,"0")+
String(
ahora.getDate()
).padStart(2,"0");


const hora=
String(
ahora.getHours()
).padStart(2,"0")+
String(
ahora.getMinutes()
).padStart(2,"0")+
String(
ahora.getSeconds()
).padStart(2,"0");


const aleatorio=
Math.floor(
100+
Math.random()*900
);


return(
"MM-"+
fecha+
"-"+
hora+
"-"+
aleatorio
);

}


/* =====================================================
   FECHA Y HORA
   ===================================================== */

function obtenerFechaHora(){

return new Date()
.toLocaleString(
"es-MX",
{

day:"2-digit",

month:"2-digit",

year:"numeric",

hour:"2-digit",

minute:"2-digit",

second:"2-digit",

hour12:false

}
);

}


/* =====================================================
   CREAR RUTA GOOGLE MAPS
   ===================================================== */

function crearUrlGoogleMaps(){

if(
pickupLat===null||
pickupLng===null||
destinationLat===null||
destinationLng===null
){

return "";

}


return(
"https://www.google.com/maps/dir/?api=1"+
"&origin="+
pickupLat+
","+
pickupLng+
"&destination="+
destinationLat+
","+
destinationLng+
"&travelmode=driving"
);

}


/* =====================================================
   DATOS COMPLETOS DEL SERVICIO
   ===================================================== */

function obtenerDatosCompletos(
numeroServicio
){

return{

numero_servicio:
numeroServicio,

tipo_servicio:
"Moto Mandado",

fecha_hora:
obtenerFechaHora(),

ciudad:
"Dolores Hidalgo",

colonia_recogida:
pickupNombreColonia,

direccion_recogida:
pickupAddress,

latitud_recogida:
pickupLat,

longitud_recogida:
pickupLng,

colonia_entrega:
destinationNombreColonia,

direccion_entrega:
destinationAddress,

latitud_entrega:
destinationLat,

longitud_entrega:
destinationLng,

distancia:
distance.innerText,

tiempo_estimado:
duration.innerText,

valor_servicio:
price.innerText,

url_google_maps:
crearUrlGoogleMaps(),

estado:
"Pendiente"

};

}


/* =====================================================

);
