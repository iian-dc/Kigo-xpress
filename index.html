<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Moto Mandado</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}body{margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#f3f4f6;color:#202124}
.app{width:100%;max-width:600px;margin:auto;background:#fff;min-height:100vh}.map-container{position:relative}#map{width:100%;height:55vh;min-height:350px}
.map-message{position:absolute;top:15px;left:50%;transform:translateX(-50%);z-index:999;background:#fff;padding:10px 16px;border-radius:22px;box-shadow:0 3px 12px rgba(0,0,0,.16);font-size:12px;font-weight:600;color:#333;white-space:nowrap}
.panel{background:#fff;padding:18px;border-radius:24px 24px 0 0;margin-top:-22px;position:relative;z-index:1000;box-shadow:0 -4px 20px rgba(0,0,0,.12)}
.title{font-size:22px;font-weight:700;letter-spacing:-.3px;margin-bottom:6px;color:#171717}.subtitle{font-size:13px;color:#777;margin-bottom:17px;line-height:19px}
.step{padding:14px;border-radius:14px;background:#f7f7f8;margin-bottom:11px;position:relative;border:1px solid #eeeeef}
.step-title{font-size:11px;color:#666;margin-bottom:8px;font-weight:700;letter-spacing:.5px}
.input-wrapper{position:relative}.colonia-input{width:100%;border:1px solid #dedede;background:#fff;padding:14px;border-radius:11px;font-size:14px;font-weight:600;outline:none;color:#222;transition:.2s}
.colonia-input:focus{border-color:#ef4444;box-shadow:0 0 0 3px rgba(239,68,68,.14)}.colonia-input::placeholder{color:#aaa;font-weight:400}
.suggestions{position:absolute;left:0;right:0;top:calc(100% + 5px);background:#fff;border:1px solid #ddd;border-radius:12px;box-shadow:0 5px 18px rgba(0,0,0,.18);z-index:5000;overflow:hidden;display:none;max-height:240px;overflow-y:auto}.suggestions.show{display:block}
.suggestion{padding:13px;border-bottom:1px solid #eee;font-size:13px;font-weight:600;background:#fff;cursor:pointer}.suggestion:last-child{border-bottom:none}.suggestion:active{background:#fee2e2}
.suggestion-name{font-size:14px;color:#222}.suggestion-location{font-size:11px;color:#888;margin-top:3px;font-weight:400}
.suggestion-loading,.suggestion-empty{padding:13px;font-size:12px;color:#777;text-align:center}
.calculate{width:100%;border:1px solid #dc2626;padding:14px;border-radius:12px;margin-top:2px;background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;font-size:14px;font-weight:700;letter-spacing:.2px;box-shadow:0 4px 10px rgba(220,38,38,.22);cursor:pointer;transition:.2s}.calculate:active{transform:scale(.98)}.calculate:disabled{opacity:.7;cursor:not-allowed}
.info{display:flex;gap:8px;margin-top:11px}.info-box{flex:1;background:#f7f7f8;padding:13px 8px;border-radius:13px;text-align:center;border:1px solid #eeeeef}.info-label{font-size:10px;color:#777;font-weight:600;letter-spacing:.4px}.info-value{font-size:16px;font-weight:700;margin-top:5px;color:#222}
.price{margin-top:12px;padding:16px;background:#151515;color:#fff;border-radius:14px;display:flex;justify-content:space-between;align-items:center}.price-label{font-size:13px;font-weight:500}.price-value{font-size:24px;font-weight:700}
.confirm{width:100%;border:none;padding:16px;border-radius:14px;margin-top:14px;background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;font-size:16px;font-weight:700;letter-spacing:.2px;box-shadow:0 4px 10px rgba(22,163,74,.22);transition:.2s}.confirm:active{transform:scale(.98)}.confirm:disabled{background:#aaa;color:#fff;box-shadow:none}
.status{text-align:center;font-size:12px;color:#777;margin-top:9px;min-height:18px}
.pickup-icon,.destination-icon{width:38px;height:38px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(0,0,0,.35);border:3px solid white}.pickup-icon{background:#ef4444}.destination-icon{background:#111}.marker-dot{width:11px;height:11px;background:white;border-radius:50%}
.loading-screen{position:fixed;inset:0;background:rgba(255,255,255,.97);z-index:99999;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center}.loading-screen.show{display:flex}
.loading-title{font-size:21px;font-weight:700;margin-top:18px}.loading-text{font-size:13px;color:#777;margin-top:7px}
.road{width:260px;height:7px;background:#222;border-radius:10px;position:relative;margin-top:45px}.road:before{content:"";position:absolute;left:0;right:0;top:2px;border-top:3px dashed #ef4444}.moto{position:absolute;left:-50px;top:-34px;font-size:40px;animation:motoMove 4.5s linear infinite}
.loading-dot{display:flex;gap:6px;margin-top:20px}.loading-dot span{width:7px;height:7px;background:#ef4444;border-radius:50%;animation:blink 1s infinite}.loading-dot span:nth-child(2){animation-delay:.2s}.loading-dot span:nth-child(3){animation-delay:.4s}
@keyframes motoMove{0%{left:-50px;transform:scaleX(1)}45%{left:120px;transform:scaleX(1)}50%{left:120px;transform:scaleX(-1)}95%{left:-50px;transform:scaleX(-1)}100%{left:-50px;transform:scaleX(1)}}@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
</style>
</head>
<body>
<div class="app">
<div class="map-container"><div id="map"></div><div id="mapMessage" class="map-message">Escribe las colonias para cotizar</div></div>
<div class="panel">
<div class="title">Solicita tu moto Kigo xpress</div>
<div class="subtitle">Escribe la colonia donde recogemos y la colonia donde entregamos.</div>
<div class="step"><div class="step-title">Colonia de recogida</div><div class="input-wrapper"><input id="pickupInput" class="colonia-input" type="text" placeholder="Escribe el nombre de la colonia" autocomplete="off"><div id="pickupSuggestions" class="suggestions"></div></div></div>
<div class="step"><div class="step-title">Colonia de entrega</div><div class="input-wrapper"><input id="destinationInput" class="colonia-input" type="text" placeholder="Escribe el nombre de la colonia" autocomplete="off"><div id="destinationSuggestions" class="suggestions"></div></div></div>
<button id="calculateButton" class="calculate">CALCULAR COTIZACIÓN</button>
<div class="info"><div class="info-box"><div class="info-label">DISTANCIA</div><div id="distance" class="info-value">—</div></div><div class="info-box"><div class="info-label">TIEMPO APROX.</div><div id="duration" class="info-value">—</div></div></div>
<div class="price"><div class="price-label">Valor estimado</div><div id="price" class="price-value">POR COTIZAR</div></div>
<button id="confirmButton" class="confirm" disabled>CONFIRMAR SERVICIO</button>
<div id="status" class="status"></div>
</div>
</div>
<div id="loadingScreen" class="loading-screen"><div class="road"><div class="moto">🏍️</div></div><div class="loading-title">Preparando tu servicio</div><div class="loading-text">Enviando cotización...</div><div class="loading-dot"><span></span><span></span><span></span></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const TARIFA_CENTRO_CENTRO=35;const TARIFA_BASE=35;const DISTANCIA_BASE_METROS=750;const INCREMENTO_POR_TRAMO=5;const TRAMO_ADICIONAL_METROS=750;const MINUTOS_ADICIONALES=5;const NUMERO_WHATSAPP="524182371993";
let pickupLat=null,pickupLng=null,destinationLat=null,destinationLng=null,pickupAddress="",destinationAddress="",pickupNombreColonia="",destinationNombreColonia="",pickupMarker=null,destinationMarker=null,routeLayer=null,precioServicio=0;
const map=L.map("map",{zoomControl:false,attributionControl:true});
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(map);
map.setView([21.1561,-100.9333],14);

const pickupInput=document.getElementById("pickupInput"),destinationInput=document.getElementById("destinationInput"),pickupSuggestions=document.getElementById("pickupSuggestions"),destinationSuggestions=document.getElementById("destinationSuggestions"),calculateButton=document.getElementById("calculateButton"),confirmButton=document.getElementById("confirmButton"),distance=document.getElementById("distance"),duration=document.getElementById("duration"),price=document.getElementById("price"),status=document.getElementById("status"),mapMessage=document.getElementById("mapMessage");

function normalizarTexto(t){return t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim();}
function formatearColonia(t){if(!t)return"";t=t.toLowerCase().trim();return t.replace(/(^|\s)([a-záéíóúñ])/g,(m,p1,p2)=>p1+p2.toUpperCase());}
function esCentro(n){if(!n)return false;const x=normalizarTexto(n);return x==="centro"||x.includes("centro");}
function calcularPrecioPorDistancia(km){const m=km*1000;if(m<=DISTANCIA_BASE_METROS)return TARIFA_BASE;const extra=m-DISTANCIA_BASE_METROS;const tramos=Math.ceil(extra/TRAMO_ADICIONAL_METROS);return TARIFA_BASE+(tramos*INCREMENTO_POR_TRAMO);}
function calcularPrecioFinal(km){if(esCentro(pickupNombreColonia)&&esCentro(destinationNombreColonia))return TARIFA_CENTRO_CENTRO;return calcularPrecioPorDistancia(km);}
function crearIconoRecogida(){return L.divIcon({className:"",html:'<div class="pickup-icon"><div class="marker-dot"></div></div>',iconSize:[38,38],iconAnchor:[19,38]});}
function crearIconoDestino(){return L.divIcon({className:"",html:'<div class="destination-icon"><div class="marker-dot"></div></div>',iconSize:[38,38],iconAnchor:[19,38]});}
function colocarMarcadorRecogida(){if(pickupLat===null||pickupLng===null)return;if(pickupMarker)map.removeLayer(pickupMarker);pickupMarker=L.marker([pickupLat,pickupLng],{icon:crearIconoRecogida()}).addTo(map);pickupMarker.bindPopup("<b>Recogida</b><br>"+formatearColonia(pickupNombreColonia));}
function colocarMarcadorEntrega(){if(destinationLat===null||destinationLng===null)return;if(destinationMarker)map.removeLayer(destinationMarker);destinationMarker=L.marker([destinationLat,destinationLng],{icon:crearIconoDestino()}).addTo(map);destinationMarker.bindPopup("<b>Entrega</b><br>"+formatearColonia(destinationNombreColonia));}
function limpiarRuta(){if(routeLayer){map.removeLayer(routeLayer);routeLayer=null;}}
async function buscarColonias(texto){
 if(!texto||texto.trim().length<2)return[];
 const consulta=encodeURIComponent(texto+", Dolores Hidalgo, Guanajuato, Mexico");
 const url="https://nominatim.openstreetmap.org/search?format=json&q="+consulta+"&limit=8&countrycodes=mx&addressdetails=1&accept-language=es";
 try{const r=await fetch(url);const res=await r.json();return res.filter(v=>normalizarTexto(v.display_name||"").includes("dolores hidalgo"));}catch(e){return[];}
}
function mostrarSugerencias(cont,resultados,tipo){
 cont.innerHTML="";if(!resultados.length){cont.innerHTML='<div class="suggestion-empty">No encontramos esa colonia en Dolores Hidalgo.</div>';cont.classList.add("show");return;}
 resultados.forEach(res=>{const el=document.createElement("div");el.className="suggestion";const nombre=formatearColonia(res.name||res.display_name.split(",")[0]);el.innerHTML=`<div class="suggestion-name">${nombre}</div><div class="suggestion-location">Dolores Hidalgo, Guanajuato</div>`;el.addEventListener("click",()=>seleccionarColonia(res,nombre,tipo));cont.appendChild(el);});
 cont.classList.add("show");
}
function seleccionarColonia(resultado,nombre,tipo){
 const lat=parseFloat(resultado.lat),lng=parseFloat(resultado.lon);nombre=formatearColonia(nombre);
 if(tipo==="pickup"){pickupNombreColonia=nombre;pickupLat=lat;pickupLng=lng;pickupAddress=resultado.display_name||nombre+", Dolores Hidalgo, Guanajuato";pickupInput.value=nombre;pickupSuggestions.classList.remove("show");colocarMarcadorRecogida();map.setView([lat,lng],15);mapMessage.innerText="Recogida: "+nombre;}
 else{destinationNombreColonia=nombre;destinationLat=lat;destinationLng=lng;destinationAddress=resultado.display_name||nombre+", Dolores Hidalgo, Guanajuato";destinationInput.value=nombre;destinationSuggestions.classList.remove("show");colocarMarcadorEntrega();map.setView([lat,lng],15);mapMessage.innerText="Entrega: "+nombre;}
 actualizarEstadoSeleccion();
}
function actualizarEstadoSeleccion(){
 if(pickupLat!==null&&destinationLat!==null){mapMessage.innerText="Pulsa CALCULAR COTIZACIÓN";status.innerText="Las dos colonias están seleccionadas.";return;}
 if(pickupLat!==null){mapMessage.innerText="Ahora selecciona la colonia de entrega";status.innerText="Selecciona la colonia de entrega.";return;}
 mapMessage.innerText="Selecciona la colonia de recogida";status.innerText="Selecciona la colonia de recogida.";
}
let timerPickup=null;
pickupInput.addEventListener("input",function(){
 const texto=this.value.trim();pickupLat=null;pickupLng=null;pickupAddress="";pickupNombreColonia="";if(pickupMarker){map.removeLayer(pickupMarker);pickupMarker=null;}distance.innerText="—";duration.innerText="—";price.innerText="POR COTIZAR";precioServicio=0;confirmButton.disabled=true;limpiarRuta();
 if(timerPickup)clearTimeout(timerPickup);
 if(texto.length<2){pickupSuggestions.innerHTML="";pickupSuggestions.classList.remove("show");actualizarEstadoSeleccion();return;}
 pickupSuggestions.innerHTML='<div class="suggestion-loading">Buscando colonias...</div>';pickupSuggestions.classList.add("show");
 timerPickup=setTimeout(async()=>{const res=await buscarColonias(texto);mostrarSugerencias(pickupSuggestions,res,"pickup");},350);
});
let timerDestination=null;
destinationInput.addEventListener("input",function(){
 const texto=this.value.trim();destinationLat=null;destinationLng=null;destinationAddress="";destinationNombreColonia="";if(destinationMarker){map.removeLayer(destinationMarker);destinationMarker=null;}distance.innerText="—";duration.innerText="—";price.innerText="POR COTIZAR";precioServicio=0;confirmButton.disabled=true;limpiarRuta();
 if(timerDestination)clearTimeout(timerDestination);
 if(texto.length<2){destinationSuggestions.innerHTML="";destinationSuggestions.classList.remove("show");actualizarEstadoSeleccion();return;}
 destinationSuggestions.innerHTML='<div class="suggestion-loading">Buscando colonias...</div>';destinationSuggestions.classList.add("show");
 timerDestination=setTimeout(async()=>{const res=await buscarColonias(texto);mostrarSugerencias(destinationSuggestions,res,"destination");},350);
});
document.addEventListener("click",function(e){
 if(!pickupInput.contains(e.target)&&!pickupSuggestions.contains(e.target))pickupSuggestions.classList.remove("show");
 if(!destinationInput.contains(e.target)&&!destinationSuggestions.contains(e.target))destinationSuggestions.classList.remove("show");
});

/* CALCULAR RUTA */
calculateButton.addEventListener("click", async function(){
 if(pickupLat===null||destinationLat===null){status.innerText="Selecciona las dos colonias.";return;}
 calculateButton.disabled=true;calculateButton.innerText="CALCULANDO...";status.innerText="Calculando ruta...";
 try{
  const url=`https://router.project-osrm.org/route/v1/driving/${pickupLng},${pickupLat};${destinationLng},${destinationLat}?overview=full&geometries=geojson`;
  const resp=await fetch(url);const data=await resp.json();
  if(!data.routes||!data.routes.length)throw new Error("No ruta");
  const route=data.routes[0];
  const km=route.distance/1000;
  const min=Math.ceil(route.duration/60)+MINUTOS_ADICIONALES;
  if(routeLayer)map.removeLayer(routeLayer);
  routeLayer=L.geoJSON(route.geometry,{style:{color:"#ef4444",weight:5}}).addTo(map);
  colocarMarcadorRecogida();colocarMarcadorEntrega();
  map.fitBounds(routeLayer.getBounds(),{padding:[45,45]});
  precioServicio=calcularPrecioFinal(km);
  distance.innerText=km.toFixed(2)+" km";duration.innerText=min+" min";price.innerText="$"+precioServicio;
  confirmButton.disabled=false;status.innerText="Cotización lista.";
  mapMessage.innerText=`$${precioServicio} - ${km.toFixed(1)} km`;
  window._ultimaRuta={km,min,geojson:route.geometry};
 }catch(err){status.innerText="No se pudo calcular la ruta.";console.error(err);}
 calculateButton.disabled=false;calculateButton.innerText="CALCULAR COTIZACIÓN";
});

function enviarWhatsApp(datos){
 const texto=`🏍️ *NUEVO SERVICIO KIGO XPRESS*%0A%0A📍 *Recogida:* ${datos.recogida}%0A📍 *Entrega:* ${datos.entrega}%0A📏 *Distancia:* ${datos.distancia}%0A⏱️ *Tiempo:* ${datos.tiempo}%0A💰 *Precio:* $${datos.precio}%0A%0A🗺️ *Ruta:* ${datos.mapsUrl}`;
 const url=`https://wa.me/${NUMERO_WHATSAPP}?text=${texto}`;
 window.open(url,"_blank");
}

confirmButton.addEventListener("click", function(){
 if(!window._ultimaRuta){status.innerText="Primero calcula la cotización.";return;}
 const datos={
  recogida: pickupNombreColonia+" - "+pickupAddress,
  entrega: destinationNombreColonia+" - "+destinationAddress,
  distancia: distance.innerText,
  tiempo: duration.innerText,
  precio: precioServicio,
  mapsUrl: `https://www.google.com/maps/dir/${pickupLat},${pickupLng}/${destinationLat},${destinationLng}/`
 };
 document.getElementById("loadingScreen").classList.add("show");
 setTimeout(function(){enviarWhatsApp(datos);document.getElementById("loadingScreen").classList.remove("show");status.innerText="Cotización enviada por WhatsApp ✅";},4000);
});

function actualizarGlide(){}
setTimeout(function(){map.invalidateSize();map.setView([21.1561,-100.9333],14);},500);
</script>
</body>
</html>
