<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Kigo Xpress - Google 100%</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#f3f4f6}.app{max-width:600px;margin:auto;background:#fff;min-height:100vh}
#map{width:100%;height:48vh}.map-container{position:relative}.map-message{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:999;background:#111;color:#fff;padding:7px 12px;border-radius:20px;font-size:11px;font-weight:700}
.panel{padding:14px;border-radius:22px 22px 0 0;margin-top:-18px;position:relative;z-index:1000;background:#fff;box-shadow:0 -4px 20px rgba(0,0,0,.12)}
.tabs{display:flex;gap:6px;background:#f0f0f0;padding:4px;border-radius:12px;margin-bottom:12px}.tab{flex:1;padding:10px;border-radius:8px;border:none;font-weight:800;font-size:11px;cursor:pointer}.tab.active{background:#111;color:#fff}
.step{background:#f7f7f8;border:1px solid #eee;padding:10px;border-radius:12px;margin-bottom:10px}.step-title{font-size:10px;font-weight:800;color:#666;margin-bottom:5px}
.input-wrapper{position:relative}.colonia-input{width:100%;padding:13px;border:1px solid #ddd;border-radius:10px;font-size:14px;font-weight:600;outline:none}
.suggestions{position:absolute;left:0;right:0;top:100%;margin-top:5px;background:#fff;border:1px solid #ddd;border-radius:12px;box-shadow:0 8px 20px rgba(0,0,0,.2);z-index:9999;display:none;max-height:350px;overflow-y:auto}.suggestions.show{display:block}
.suggestion{padding:11px 12px;border-bottom:1px solid #f2f2f2;display:flex;gap:8px;align-items:center;cursor:pointer}.suggestion:active{background:#fee2e2}
.calculate{width:100%;padding:14px;border:none;border-radius:12px;background:#111;color:#fff;font-weight:800;margin-top:8px}
</style>
</head>
<body>
<div class="app">
<div class="map-container"><div id="map"></div><div class="map-message">Google Maps 100% conectado</div></div>
<div class="panel">
<div class="tabs"><button id="tabRecoger" class="tab">RECOGER Y ENTREGAR</button><button id="tabComprar" class="tab active">COMPRAR Y ENTREGAR</button></div>
<div class="step"><div class="step-title">¿DÓNDE COMPRAR? (Google Maps)</div><div class="input-wrapper"><input id="pickupInput" class="colonia-input" placeholder="Ej: tacos, Oxxo, farmacia, hotel, llantera, papeleria..." autocomplete="off"><div id="pickupSuggestions" class="suggestions"></div></div></div>
<div class="step"><div class="step-title">¿DÓNDE ENTREGAR?</div><div class="input-wrapper"><input id="destinationInput" class="colonia-input" placeholder="Colonia: Centro, Morelos..." autocomplete="off"><div id="destinationSuggestions" class="suggestions"></div></div></div>
<button id="calculateButton" class="calculate">CALCULAR PRECIO</button>
<div style="display:flex;gap:8px;margin-top:10px"><div style="flex:1;background:#f7f7f8;padding:10px;border-radius:12px;text-align:center"><div style="font-size:9px;color:#888">DISTANCIA</div><div id="distance" style="font-weight:800">—</div></div><div style="flex:1;background:#f7f7f8;padding:10px;border-radius:12px;text-align:center"><div style="font-size:9px;color:#888">TIEMPO</div><div id="duration" style="font-weight:800">—</div></div></div>
<div style="margin-top:10px;padding:14px;background:#111;color:#fff;border-radius:12px;display:flex;justify-content:space-between;font-weight:800"><span>Valor</span><span id="price">POR COTIZAR</span></div>
</div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const GOOGLE_API_KEY = "AIzaSyDIOUyrG5t3IjrndRnAJLR-yxg6a1V-93o"; // <--- AQUI PEGAS TU CLAVE NUEVA TU MISMO
const CENTRO = {lat:21.1561,lng:-100.9333};
let modo="comprar",pickupLat=null,pickupLng=null,destinationLat=null,destinationLng=null,pickupMarker=null,destinationMarker=null,routeLayer=null;
const map=L.map("map",{zoomControl:false}).setView([CENTRO.lat,CENTRO.lng],14);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19}).addTo(map);
const pickupInput=document.getElementById("pickupInput"),destinationInput=document.getElementById("destinationInput"),pickupSuggestions=document.getElementById("pickupSuggestions"),destinationSuggestions=document.getElementById("destinationSuggestions");

async function buscarGoogle(texto){
 if(!GOOGLE_API_KEY || GOOGLE_API_KEY.includes("AIzaSyDIOUyrG5t3IjrndRnAJLR-yxg6a1V-93o")){alert("Aún no has pegado tu clave de Google. Edita el archivo donde dice PEGA_AQUI_TU_CLAVE_NUEVA"); return [];}
 const url=`https://places.googleapis.com/v1/places:searchText`;
 const body={textQuery: texto + " en Dolores Hidalgo Guanajuato", locationBias:{circle:{center:{latitude:CENTRO.lat,longitude:CENTRO.lng},radius:10000}}, maxResultCount:25};
 const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json","X-Goog-Api-Key":GOOGLE_API_KEY,"X-Goog-FieldMask":"places.displayName,places.formattedAddress,places.location,places.primaryType"},body:JSON.stringify(body)});
 const data=await r.json();
 if(!data.places) return [];
 return data.places.map(p=>({lat:p.location.latitude,lon:p.location.longitude,name:p.displayName.text,tipo:p.primaryType||"negocio",direccion:p.formattedAddress}));
}
async function buscarColonias(texto){
 const q=encodeURIComponent(texto+", Dolores Hidalgo");
 const url=`https://nominatim.openstreetmap.org/search?format=json&q=${q}&limit=15&countrycodes=mx&accept-language=es`;
 const r=await fetch(url); const d=await r.json();
 return d.map(x=>({lat:parseFloat(x.lat),lon:parseFloat(x.lon),name:x.display_name.split(",")[0],tipo:"colonia",direccion:x.display_name}));
}
function mostrar(cont,res,tipo){
 cont.innerHTML=""; if(!res.length){cont.innerHTML='<div style="padding:12px;text-align:center;font-size:11px">Sin resultados</div>';cont.classList.add("show");return;}
 res.forEach(r=>{
  const el=document.createElement("div"); el.className="suggestion";
  el.innerHTML=`<div style="flex:1"><div style="font-size:13px;font-weight:700">📍 ${r.name}</div><div style="font-size:10px;color:#777">${r.tipo} • ${r.direccion}</div></div>`;
  el.onclick=()=>{
   if(tipo==="pickup"){pickupLat=r.lat;pickupLng=r.lon;pickupInput.value=r.name;pickupSuggestions.classList.remove("show");if(pickupMarker)map.removeLayer(pickupMarker);pickupMarker=L.marker([r.lat,r.lon]).addTo(map);map.setView([r.lat,r.lon],16);}
   else{destinationLat=r.lat;destinationLng=r.lon;destinationInput.value=r.name;destinationSuggestions.classList.remove("show");if(destinationMarker)map.removeLayer(destinationMarker);destinationMarker=L.marker([r.lat,r.lon]).addTo(map);map.setView([r.lat,r.lon],16);}
  };
  cont.appendChild(el);
 });
 cont.classList.add("show");
}
let t1=null;
pickupInput.addEventListener("input",function(){
 const txt=this.value.trim(); if(t1)clearTimeout(t1); if(txt.length<1){pickupSuggestions.classList.remove("show");return;}
 pickupSuggestions.innerHTML=`<div style="padding:10px;text-align:center;font-size:11px">🔍 Buscando "${txt}" en Google Maps...</div>`;pickupSuggestions.classList.add("show");
 t1=setTimeout(async()=>{
  let res= modo==="comprar"? await buscarGoogle(txt) : await buscarColonias(txt);
  mostrar(pickupSuggestions,res,"pickup");
 },300);
});
let t2=null;
destinationInput.addEventListener("input",function(){
 const txt=this.value.trim(); if(t2)clearTimeout(t2); if(txt.length<1){destinationSuggestions.classList.remove("show");return;}
 destinationSuggestions.innerHTML='<div style="padding:10px;text-align:center;font-size:11px">Buscando...</div>';destinationSuggestions.classList.add("show");
 t2=setTimeout(async()=>{const res=await buscarColonias(txt);mostrar(destinationSuggestions,res,"destination");},300);
});
document.getElementById("calculateButton").onclick=async()=>{
 if(!pickupLat||!destinationLat){alert("Selecciona los 2 puntos");return;}
 const url=`https://router.project-osrm.org/route/v1/driving/${pickupLng},${pickupLat};${destinationLng},${destinationLat}?overview=full&geometries=geojson`;
 const r=await fetch(url);const d=await r.json();const route=d.routes[0];
 const km=route.distance/1000; let precio=35; if(route.distance>750) precio=35+Math.ceil((route.distance-750)/750)*5;
 if(routeLayer)map.removeLayer(routeLayer);routeLayer=L.geoJSON(route.geometry,{style:{color:"#111",weight:5}}).addTo(map);
 map.fitBounds(routeLayer.getBounds(),{padding:[30,30]});
 document.getElementById("distance").innerText=km.toFixed(2)+" km";document.getElementById("duration").innerText=Math.ceil(route.duration/60+5)+" min";document.getElementById("price").innerText="$"+precio;
};
document.getElementById("tabRecoger").onclick=()=>{modo="recoger";document.getElementById("tabRecoger").classList.add("active");document.getElementById("tabComprar").classList.remove("active");};
document.getElementById("tabComprar").onclick=()=>{modo="comprar";document.getElementById("tabComprar").classList.add("active");document.getElementById("tabRecoger").classList.remove("active");};
</script>
</body>
</html>
