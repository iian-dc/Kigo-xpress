<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kigo xpress</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
  body{height:100vh;overflow:hidden;display:flex;flex-direction:column}
  #map{flex:1;z-index:1}
 .map-wrapper{position:relative;flex:1;display:flex}
 .map-message{
    position:absolute;
    z-index:1000;
    background:white;
    width:42px; height:42px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    left:50%; transform:translateX(-50%); top:10px;
    padding:2px; box-shadow:0 2px 8px rgba(0,0,0,0.2);
  }
 .map-message img{
    width:32px; height:32px; border-radius:50%; object-fit:cover;
  }
 .info-card{
    background:white; padding:16px; border-radius:16px 16px 0 0;
    box-shadow:0 -2px 20px rgba(0,0,0,0.1); z-index:2;
  }
 .info-card h3{font-size:18px;margin-bottom:4px}
 .info-card p{font-size:14px;color:#666}
 .bottom-nav{
    display:flex; justify-content:space-around;
    background:white; padding:10px 0; border-top:1px solid #eee;
  }
 .bottom-nav div{text-align:center;font-size:12px;color:#888}
 .bottom-nav.active{color:#00A99D}
</style>
</head>
<body>

<div class="map-wrapper">
  <div id="map"></div>

  <!-- LOGO CIRCULAR PEQUEÑO ARRIBA -->
  <div class="map-message">
    <img src="https://firebasestorage.googleapis.com/v0/b/glide-prod.appspot.com/o/icon-images%2Fanonymous-ba983199-acce-404e-b058-c75e9633b325.jpeg?alt=media&token=a58284c1-111c-4874-b60f-35380cf5fbe3" alt="Kigo Xpress">
  </div>
</div>

<div class="info-card">
  <h3>Tu pedido está en camino</h3>
  <p id="status-text">Calculando ruta más corta de moto...</p>
</div>

<div class="bottom-nav">
  <div class="active">Inicio</div>
  <div>Pedidos</div>
  <div>Chat</div>
  <div>Perfil</div>
</div>

<script>
  const map = L.map('map', {zoomControl:false}).setView([21.1585, -100.9337], 15);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

  // Ejemplo: Dolores Hidalgo
  const start = [21.160, -100.935];
  const end = [21.155, -100.930];
  L.marker(start).addTo(map);
  L.marker(end).addTo(map);

  // Ruta optimizada para moto usando foot (rutas cortas, permite pasar por donde el auto no)
  fetch(`https://router.project-osrm.org/route/v1/foot/${start[1]},${start[0]};${end[1]},${end[0]}?overview=full&geometries=geojson`)
 .then(r=>r.json())
 .then(data=>{
    const route = data.routes[0].geometry;
    L.geoJSON(route, {style:{color:'#7c3aed',weight:4,dashArray:'8,8'}}).addTo(map);
    document.getElementById('status-text').innerText = `En camino • ${(data.routes[0].distance/1000).toFixed(1)} km • Llegada aprox. 12-14 min`;
  });
</script>

</body>
</html>
