<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Kigo xpress - Recoger y Entregar</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#f3f4f6}
.app{max-width:500px;margin:auto;background:#fff;min-height:100vh;display:flex;flex-direction:column}
#map{width:100%;height:50vh}
.map-container{position:relative}
.map-message{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:999;background:#111;color:#fff;padding:7px 14px;border-radius:20px;font-size:11px;font-weight:800;white-space:nowrap}
.panel{padding:16px;border-radius:22px 22px 0 0;margin-top:-18px;position:relative;z-index:1000;background:#fff;box-shadow:0 -4px 20px rgba(0,0,0,.12);flex:1}
.step{background:#f7f7f8;border:1px solid #eee;padding:12px;border-radius:14px;margin-bottom:12px}
.step-title{font-size:11px;font-weight:800;color:#666;margin-bottom:6px;letter-spacing:.5px}
.input-wrapper{position:relative}
.colonia-input{width:100%;padding:14px;border:1.5px solid #ddd;border-radius:12px;font-size:14px;font-weight:600;outline:none}
.colonia-input:focus{border-color:#111}
.suggestions{position:absolute;left:0;right:0;top:100%;margin-top:6px;background:#fff;border:1px solid #ddd;border-radius:14px;box-shadow:0 10px 25px rgba(0,0,0,.18);z-index:9999;display:none;max-height:300px;overflow-y:auto}
.suggestions.show{display:block}
.suggestion{padding:12px 14px;border-bottom:1px solid #f2f2f2;display:flex;gap:10px;align-items:center;cursor:pointer}
.suggestion:active{background:#fee2e2}
.suggestion:last-child{border:none}
.btn-cotizar{width:100%;padding:16px;border:none;border-radius:14px;background:#E53935;color:#fff;font-weight:900;font-size:15px;letter-spacing:.5px;margin-top:10px;cursor:pointer;box-shadow:0 4px 12px rgba(229,57,53,.4)}
.btn-cotizar:active{transform:scale(.98)}
.info{display:flex;gap:10px;margin-top:12px}
.info-box{flex:1;background:#f7f7f8;padding:12px;border-radius:12px;text-align:center;border:1px solid #eee}
.info-label{font-size:9px;color:#888;font-weight:700}
.info-value{font-size:14px;font-weight:800;margin-top:2px}
.price-box{margin-top:12px;padding:16px;background:#111;color:#fff;border-radius:14px;display:flex;justify-content:space-between;align-items:center;font-weight:900}
</style>
</head>
<body>
<div class="app">
<div class="map-container"><div id="map"></div><div class="map-message">📍 DOLORES HIDALGO - KIGO XPRESS</div></div>
<div class="panel">
<div class="step"><div class="step-title">1. ¿DÓNDE RECOGER?</div><div class="input-wrapper"><input id="pickupInput" class="colonia-input" placeholder="Ej: Centro, Morelos, San Cristobal..." autocomplete="off"><div id="pickupSuggestions" class="suggestions"></div></div></div>
<div class="step"><div class="step-title">2. ¿DÓNDE ENTREGAR?</div><div class="input-wrapper"><input id="destinationInput" class="colonia-input" placeholder="Ej: Lindavista, La Esperanza..." autocomplete="off"><div id="destinationSuggestions" class="suggestions"></div></div></div>
<button id="calculateButton" class="btn-cotizar">COTIZAR SERVICIO</button>
<div class="info"><div class="info-box"><div class="info-label">DISTANCIA</div><div id="distance" class="info-value">—</div></div><div class="info-box"><div class="info-label">TIEMPO</div><div id="duration" class="info-value">—</div></div></div>
<div class="price-box"><span>PRECIO ESTIMADO</span><span id="price">$ POR COTIZAR</span></div>
</div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const CENTRO = {lat:21.1561,lng:-100.9333};
let pickupLat=null,pickupLng=null,destinationLat=null,destinationLng=null;
let pickupMarker=null,destinationMarker=null,routeLayer=null;
const map=L.map("map",{zoomControl:false}).setView([CENTRO.lat,CENTRO.lng],14);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19}).addTo(map);
const pickupInput=document.getElementById("pickupInput"),destinationInput=document.getElementById("destinationInput");
const pickupSuggestions=document.getElementById("pickupSuggestions"),destinationSuggestions=document.getElementById("destinationSuggestions");

async function buscarColonias(texto){
 const q=encodeURIComponent(texto+", Dolores Hidalgo Guanajuato Mexico");
 const url=`https://nominatim.openstreetmap.org/search?format=json&q=${q}&limit=12&countrycodes=mx&accept-language=es`;
 const r=await fetch(url); const d=await r.json();
 return d.map(x=>({lat:parseFloat(x.lat),lon:parseFloat(x.lon),name:x.display_name.split(",")[0],direccion:x.display_name}));
}
function mostrar(cont,res,tipo){
 cont.innerHTML=""; if(!res.length){cont.innerHTML='<div style="padding:12px;text-align:center;font-size:12px">Sin resultados</div>';cont.classList.add("show");return;}
 res.forEach(r=>{
  const el=document.createElement("div"); el.className="suggestion";
  el.innerHTML=`<div style="font-size:20px">📍</div><div style="flex:1"><div style="font-size:13px;font-weight:700">${r.name}</div><div style="font-size:10px;color:#777;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${r.direccion}</div></div>`;
  el.onclick=()=>{
   if(tipo==="pickup"){pickupLat=r.lat;pickupLng=r.lon;pickupInput.value=r.name;pickupSuggestions.classList.remove("show");if(pickupMarker)map.removeLayer(pickupMarker);pickupMarker=L.marker([r.lat,r.lon]).addTo(map).bindPopup("RECOGER: "+r.name).openPopup();map.setView([r.lat,r.lon],15);}
   else{destinationLat=r.lat;destinationLng=r.lon;destinationInput.value=r.name;destinationSuggestions.classList.remove("show");if(destinationMarker)map.removeLayer(destinationMarker);destinationMarker=L.marker([r.lat,r.lon]).addTo(map).bindPopup("ENTREGAR: "+r.name).openPopup();map.setView([r.lat,r.lon],15);}
  };
  cont.appendChild(el);
 });
 cont.classList.add("show");
}
let t1=null; pickupInput.addEventListener("input",function(){
 const txt=this.value.trim(); if(t1)clearTimeout(t1); if(txt.length<2){pickupSuggestions.classList.remove("show");return;}
 pickupSuggestions.innerHTML='<div style="padding:10px;text-align:center;font-size:11px">Buscando...</div>';pickupSuggestions.classList.add("show");
 t1=setTimeout(async()=>{const res=await buscarColonias(txt);mostrar(pickupSuggestions,res,"pickup");},350);
});
let t2=null; destinationInput.addEventListener("input",function(){
 const txt=this.value.trim(); if(t2)clearTimeout(t2); if(txt.length<2){destinationSuggestions.classList.remove("show");return;}
 destinationSuggestions.innerHTML='<div style="padding:10px;text-align:center;font-size:11px">Buscando...</div>';destinationSuggestions.classList.add("show");
 t2=setTimeout(async()=>{const res=await buscarColonias(txt);mostrar(destinationSuggestions,res,"destination");},350);
});
document.getElementById("calculateButton").onclick=async()=>{
 if(!pickupLat||!destinationLat){alert("Selecciona donde recoger y donde entregar");return;}
 const url=`https://router.project-osrm.org/route/v1/driving/${pickupLng},${pickupLat};${destinationLng},${destinationLat}?overview=full&geometries=geojson`;
 const r=await fetch(url); const d=await r.json(); if(!d.routes||!d.routes.length){alert("No se pudo trazar ruta");return;}
 const route=d.routes[0]; const km=route.distance/1000;
 let precio=35; if(route.distance>750){precio=35+Math.ceil((route.distance-750)/750)*5;}
 if(routeLayer)map.removeLayer(routeLayer); routeLayer=L.geoJSON(route.geometry,{style:{color:"#E53935",weight:5}}).addTo(map);
 map.fitBounds(routeLayer.getBounds(),{padding:[40,40]});
 document.getElementById("distance").innerText=km.toFixed(2)+" km";
 document.getElementById("duration").innerText=Math.ceil(route.duration/60+5)+" min";
 document.getElementById("price").innerText="$"+precio+" MXN";
};
document.addEventListener("click",e=>{if(!e.target.closest(".input-wrapper")){pickupSuggestions.classList.remove("show");destinationSuggestions.classList.remove("show");}});
</script>
</body>
</html>
