<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HISTORIAL CONTABLE - KIGO XPRESS</title>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<style>
*{box-sizing:border-box;font-family:Inter,Segoe UI,Arial}
body{margin:0;background:#f6f7fb;color:#111}
.header{position:sticky;top:0;z-index:10;background:#111;color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}
.header h1{margin:0;font-size:16px}
.badge-live{background:#22c55e;color:#fff;padding:3px 8px;border-radius:999px;font-size:10px;font-weight:900}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:14px}
@media(max-width:700px){.stats-grid{grid-template-columns:repeat(2,1fr)}}
.stat{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:12px}
.stat b{font-size:18px;display:block} .stat span{font-size:10px;color:#666;font-weight:800;text-transform:uppercase}
.filters{background:#fff;margin:0 14px;padding:12px;border-radius:14px;border:1px solid #e5e7eb;display:flex;flex-wrap:wrap;gap:8px}
.filters input,.filters select{padding:8px 10px;border-radius:10px;border:1px solid #ddd;font-size:12px;flex:1;min-width:120px}
.btn{padding:8px 12px;border-radius:10px;border:none;font-weight:800;font-size:11px;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.btn-dark{background:#111;color:#fff} .btn-green{background:#16a34a;color:#fff} .btn-white{background:#fff;border:1px solid #ddd}
.table-wrap{background:#fff;margin:14px;border-radius:14px;border:1px solid #e5e7eb;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:11px}
th{position:sticky;top:0;background:#f9fafb;padding:10px 8px;text-align:left;font-size:10px;text-transform:uppercase;border-bottom:1px solid #e5e7eb;white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid #f1f1f1;white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis}
.tipo-pill{padding:2px 7px;border-radius:999px;font-size:9px;font-weight:900;display:inline-block}
.tipo-recoger{background:#dcfce7;color:#166534} .tipo-comprar{background:#fef9c3;color:#713f12} .tipo-nuevo{background:#dbeafe;color:#1e40af}
.estado-finalizado{background:#111;color:#fff;padding:3px 7px;border-radius:999px;font-size:9px;font-weight:900}
</style>
</head>
<body>
<div class="header">
<h1>📚 HISTORIAL CONTABLE - KIGO XPRESS</h1>
<div style="display:flex;gap:8px;align-items:center"><span class="badge-live">● EN VIVO</span><span id="contadorTotal" style="font-size:11px;background:#fff;color:#111;padding:4px 8px;border-radius:999px;font-weight:900">0 pedidos</span></div>
</div>
<div class="stats-grid">
<div class="stat"><span>Total Finalizado</span><b id="statTotal">0</b></div>
<div class="stat"><span>Ingresos Totales</span><b id="statIngresos" style="color:#16a34a">$0</b></div>
<div class="stat"><span>Moto Mandados</span><b id="statMandados">0</b></div>
<div class="stat"><span>Moto Transporte / Compras</span><b id="statCompras">0</b></div>
</div>
<div class="filters">
<input id="busqueda" placeholder="🔍 Buscar aliado, dirección, teléfono..." oninput="aplicarFiltros()">
<select id="filtroTipo" onchange="aplicarFiltros()"><option value="todos">Todos los tipos</option><option value="aliado">Aliado - Recoger</option><option value="comprar">Aliado - Comprar</option><option value="nuevo">Nuevo - Recoger/Comprar</option></select>
<select id="filtroFecha" onchange="aplicarFiltros()"><option value="todos">Todo el historial</option><option value="hoy">Hoy</option><option value="semana">Esta semana</option><option value="mes">Este mes</option></select>
<button class="btn btn-green" onclick="exportarCSV()">⬇ Exportar CSV</button>
<button class="btn btn-dark" onclick="location.reload()">↻ Actualizar</button>
</div>
<div class="table-wrap">
<table><thead><tr><th>#ID</th><th>Fecha Finalizado</th><th>Tipo Servicio</th><th>Recoger En</th><th>Entregar En</th><th>Tel</th><th>Distancia</th><th>Precio</th><th>Tiempo</th><th>Resumen</th><th>Acción</th></tr></thead>
<tbody id="tbodyHistorial"><tr><td colspan="11" style="text-align:center;padding:30px">Cargando...</td></tr></tbody></table>
</div>
<div id="modalDetalle" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99;align-items:center;justify-content:center;padding:14px"><div style="background:#fff;width:100%;max-width:500px;border-radius:16px;padding:16px;max-height:90vh;overflow:auto">
<div style="display:flex;justify-content:space-between"><b>📦 Detalle</b><button onclick="document.getElementById('modalDetalle').style.display='none'" class="btn btn-white">X</button></div>
<div id="detalleContenido" style="margin-top:12px;font-size:12px;line-height:1.6"></div>
</div></div>
<script>
const firebaseConfig={apiKey:"AIzaSyCTV1sm6McEIkv-cheaVFCD_svp_a--6wg",authDomain:"glide-prod.firebaseapp.com",databaseURL:"https://glide-prod-default-rtdb.firebaseio.com",projectId:"glide-prod",storageBucket:"glide-prod.appspot.com",messagingSenderId:"123456",appId:"1:123456:web:abc"};
firebase.initializeApp(firebaseConfig); const db=firebase.database();
let todosPedidos=[]; let filtrados=[];
</script>
<script>
function esHoy(ts){const d=new Date(ts);return d.toDateString()===new Date().toDateString();}
function esEstaSemana(ts){return (Date.now()-ts)<7*24*60*60*1000;}
function esEsteMes(ts){const d=new Date(ts);const h=new Date();return d.getMonth()===h.getMonth()&&d.getFullYear()===h.getFullYear();}
db.ref('kigo_pedidos').on('value', snap=>{
 const val=snap.val(); todosPedidos=[];
 if(val){Object.keys(val).forEach(k=>{const p=val[k];if(p.estado==='finalizado'){todosPedidos.push({fbKey:k,...p});}});}
 todosPedidos.sort((a,b)=>(b.historial?.finalizado||b.timestamp)-(a.historial?.finalizado||a.timestamp));
 renderTabla(todosPedidos); actualizarStats(todosPedidos);
});
function actualizarStats(lista){
 document.getElementById('contadorTotal').innerText=lista.length+" finalizados";
 document.getElementById('statTotal').innerText=lista.length;
 let ingresos=0,mandados=0,compras=0;
 lista.forEach(p=>{
  const precio=parseInt(String(p.precio||'').replace(/[^0-9]/g,''))||0; ingresos+=precio;
  const tipo=(p.tipo||'').toLowerCase(); if(tipo.includes('comprar')) compras++; else mandados++;
 });
 document.getElementById('statIngresos').innerText="$"+ingresos.toLocaleString()+" MXN";
 document.getElementById('statMandados').innerText=mandados;
 document.getElementById('statCompras').innerText=compras;
}
function renderTabla(lista){
 const tbody=document.getElementById('tbodyHistorial');
 if(!lista.length){tbody.innerHTML=`<tr><td colspan="11" style="text-align:center;padding:30px;color:#888">No hay finalizados aún<br>Cuando marques Finalizado en Seguimiento, aparecerán aquí</td></tr>`;return;}
 tbody.innerHTML="";
 lista.forEach(p=>{
  const idCorto=p.fbKey.substring(p.fbKey.length-6).toUpperCase();
  const fechaFin=p.historial?.finalizado? new Date(p.historial.finalizado).toLocaleString() : (p.fecha||'');
  const tipoTxt=p.tipo||'Recoger';
  let tipoClass='tipo-recoger'; if(tipoTxt.toLowerCase().includes('comprar')) tipoClass='tipo-comprar'; if(tipoTxt.toLowerCase().includes('nuevo')) tipoClass='tipo-nuevo';
  const tr=document.createElement('tr');
  tr.innerHTML=`<td><b>#${idCorto}</b></td><td>${fechaFin}</td><td><span class="tipo-pill ${tipoClass}">${tipoTxt}</span></td><td title="${p.recogerEn||''}">${(p.recogerEn||'').substring(0,30)}</td><td title="${p.entregarEn||''}">${(p.entregarEn||'').substring(0,30)}</td><td>${p.telefono||''}</td><td>${p.distancia||''}</td><td><b style="color:#16a34a">${p.precio||''}</b></td><td><span style="background:#fef08a;border:1px solid #facc15;padding:2px 6px;border-radius:999px;font-size:9px;font-weight:800">${p.tiempo||''}</span></td><td title="${p.resumen||''}">${(p.resumen||'').substring(0,25)}</td><td><button class="btn btn-white" onclick="verDetalle('${p.fbKey}')">Ver</button></td>`;
  tbody.appendChild(tr);
 });
}
function aplicarFiltros(){
 const txt=document.getElementById('busqueda').value.toLowerCase();
 const tipoF=document.getElementById('filtroTipo').value;
 const fechaF=document.getElementById('filtroFecha').value;
 filtrados=todosPedidos.filter(p=>{
  const okTxt=!txt||(p.recogerEn||'').toLowerCase().includes(txt)||(p.entregarEn||'').toLowerCase().includes(txt)||(p.telefono||'').toLowerCase().includes(txt)||(p.tipo||'').toLowerCase().includes(txt);
  if(!okTxt) return false;
  const t=(p.tipo||'').toLowerCase();
  if(tipoF==='aliado'&&!t.includes('aliado')) return false;
  if(tipoF==='comprar'&&!t.includes('comprar')) return false;
  if(tipoF==='nuevo'&&!t.includes('nuevo')) return false;
  const ts=p.historial?.finalizado||p.timestamp;
  if(fechaF==='hoy'&&!esHoy(ts)) return false;
  if(fechaF==='semana'&&!esEstaSemana(ts)) return false;
  if(fechaF==='mes'&&!esEsteMes(ts)) return false;
  return true;
 });
 renderTabla(filtrados); actualizarStats(filtrados);
}
function verDetalle(fbKey){
 const p=todosPedidos.find(x=>x.fbKey===fbKey); if(!p) return;
 const fechaFin=p.historial?.finalizado? new Date(p.historial.finalizado).toLocaleString():'No registrada';
 const fechaCre=p.historial?.creado? new Date(p.historial.creado).toLocaleString(): p.fecha||'';
 document.getElementById('detalleContenido').innerHTML=`
  <div style="background:#f9fafb;border:1px solid #eee;border-radius:12px;padding:12px">
   <div><b>ID:</b> ${p.fbKey}</div>
   <div><b>Tipo:</b> ${p.tipo||''}</div>
   <div><b>Estado:</b> FINALIZADO ✅</div>
   <div style="margin-top:8px"><b style="color:#16a34a">📦 RECOGER:</b><br>${p.recogerEn||''}<br><span style="font-size:10px;color:#666">${p.direccionAliado||''}</span></div>
   <div style="margin-top:8px"><b style="color:#dc2626">🏠 ENTREGAR:</b><br>${p.entregarEn||''}</div>
   <div><b>📞 Tel:</b> ${p.telefono||''}</div>
   <div><b>📝 Resumen:</b> ${p.resumen||''}</div>
   <div style="margin-top:8px;display:flex;gap:10px"><div><b>💰 Precio:</b><br><span style="font-size:16px;font-weight:900;color:#16a34a">${p.precio||''}</span></div><div><b>📏 Dist:</b><br>${p.distancia||''}</div><div><b>⏱️ Tiempo:</b><br>${p.tiempo||''}</div></div>
   <div style="margin-top:10px;background:#fff;border:1px solid #dcfce7;border-radius:8px;padding:8px"><b>HISTORIAL:</b><br>📅 Creado: ${fechaCre}<br>🏁 Finalizado: ${fechaFin}</div>
  </div>
  <div style="margin-top:10px;display:flex;gap:6px"><button class="btn btn-green" onclick="reabrirPedido('${p.fbKey}')">↩️ Reabrir</button><button class="btn btn-dark" onclick="document.getElementById('modalDetalle').style.display='none'">Cerrar</button></div>`;
 document.getElementById('modalDetalle').style.display='flex';
}
 </script>  
<script>
function reabrirPedido(fbKey){
 if(!confirm("¿Reabrir a Seguimiento?")) return;
 db.ref('kigo_pedidos/'+fbKey).update({estado:'a_recoger','historial/reabierto':Date.now()}).then(()=>{alert("Reabierto ✅");document.getElementById('modalDetalle').style.display='none';});
}
function exportarCSV(){
 const lista=filtrados.length? filtrados : todosPedidos;
 if(!lista.length){alert("No hay datos");return;}
 let csv="ID,Fecha Finalizado,Tipo,Recoger,Entregar,Telefono,Distancia,Precio,Tiempo,Resumen,Fecha Creado\n";
 lista.forEach(p=>{
  const fFin=p.historial?.finalizado? new Date(p.historial.finalizado).toLocaleString(): p.fecha||'';
  const fCre=p.historial?.creado? new Date(p.historial.creado).toLocaleString(): '';
  csv+=`${p.fbKey},"${fFin}","${(p.tipo||'').replace(/"/g,'""')}","${(p.recogerEn||'').replace(/"/g,'""')}","${(p.entregarEn||'').replace(/"/g,'""')}","${p.telefono||''}","${p.distancia||''}","${p.precio||''}","${p.tiempo||''}","${(p.resumen||'').replace(/"/g,'""')}","${fCre}"\n`;
 });
 const blob=new Blob([csv],{type:'text/csv'}); const url=URL.createObjectURL(blob);
 const a=document.createElement('a'); a.href=url; a.download=`historial-kigo-${new Date().toISOString().slice(0,10)}.csv`; a.click();
}
document.getElementById('modalDetalle').addEventListener('click',e=>{if(e.target.id==='modalDetalle')e.target.style.display='none';});
</script>
</body>
</html>
