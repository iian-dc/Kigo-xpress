<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DIAGNOSTICO KIGO</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>body{font-family:Arial;padding:16px;background:#111;color:#fff}.box{background:#222;padding:12px;border-radius:12px;margin-top:12px;font-size:12px;white-space:pre-wrap;word-break:break-all} b{color:#22c55e} button{padding:10px 16px;border-radius:10px;border:none;font-weight:900;cursor:pointer}</style>
</head>
<body>
<h2>🔍 DIAGNÓSTICO KIGO HISTORIAL</h2>
<div id="status" class="box">Conectando...</div>
<button onclick="location.reload()" style="background:#fff;color:#111">↻ Recargar</button>
<div id="rootKeys" class="box">Esperando datos root...</div>
<div id="historialData" class="box">Esperando kigo historial...</div>
<div id="pedidosData" class="box">Esperando kigo_pedidos...</div>
<script>
const firebaseConfig = { apiKey: "AIzaSyDGTYI2ZZnP49DbaMIpRSoGIjZrU6RAEiE", authDomain: "historial-kigo-xpress.firebaseapp.com", databaseURL: "https://historial-kigo-xpress-default-rtdb.firebaseio.com", projectId: "historial-kigo-xpress", storageBucket: "historial-kigo-xpress.firebasestorage.app", messagingSenderId: "571399920545", appId: "1:571399920545:web:aa16407753b43cbe2e89e0" };
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
document.getElementById('status').innerText = "✅ Firebase conectado a: " + firebaseConfig.databaseURL;
</script>
<script>
// 1. LEER TODO EL ROOT PARA VER QUE CARPETAS EXISTEN
db.ref('/').once('value').then(snap=>{
  const val = snap.val();
  if(!val){
    document.getElementById('rootKeys').innerText = "❌ ROOT VACÍO - No hay ninguna carpeta en esta base\nRevisa que estés en el proyecto correcto";
    return;
  }
  const keys = Object.keys(val);
  document.getElementById('rootKeys').innerText = `✅ CARPETAS EN TU BASE (${keys.length}):\n${keys.join('\n')}\n\nTotal carpetas: ${keys.length}\n\nCopia esto y mándamelo`;
  console.log("ROOT KEYS:", keys);

  // Buscar automáticamente donde hay pedidos
  keys.forEach(k=>{
    const sub = val[k];
    if(typeof sub==='object'){
      const count = Object.keys(sub).length;
      console.log(`Carpeta ${k}: ${count} registros`);
    }
  });

}).catch(err=>{
  document.getElementById('rootKeys').innerText = `❌ ERROR LEYENDO ROOT:\n${err.message}\n\nEsto es por REGLAS DE FIREBASE\nVe a Firebase Console > Realtime Database > Rules y pon:\n{\n "rules": { ".read": true, ".write": true }\n}`;
});

// 2. INTENTAR LEER kigo historial CON ESPACIO
db.ref('kigo historial').once('value').then(snap=>{
  const val=snap.val();
  if(!val){
    document.getElementById('historialData').innerText = "❌ 'kigo historial' (con espacio) VACÍO o NO EXISTE";
  } else {
    const total = Object.keys(val).length;
    const ejemplo = Object.values(val)[0];
    document.getElementById('historialData').innerText = `✅ 'kigo historial' ENCONTRADO: ${total} registros\n\nEJEMPLO DEL PRIMER REGISTRO:\n${JSON.stringify(ejemplo, null, 2).substring(0,1000)}`;
  }
}).catch(err=>{
  document.getElementById('historialData').innerText = `❌ ERROR en 'kigo historial': ${err.message}`;
});

// 3. INTENTAR CON GUION BAJO
db.ref('kigo_historial').once('value').then(snap=>{
  const val=snap.val();
  if(val){
    document.getElementById('historialData').innerText += `\n\n✅ TAMBIÉN EXISTE 'kigo_historial' con ${Object.keys(val).length} registros`;
  }
});
</script>
<script>
// 4. LEER kigo_pedidos y otros
['kigo_pedidos','pedidosLive','pedidos','ventas','historial'].forEach(ruta=>{
  db.ref(ruta).once('value').then(snap=>{
    const val=snap.val();
    if(val){
      const total=Object.keys(val).length;
      document.getElementById('pedidosData').innerText += `\n✅ ${ruta}: ${total} registros`;
    } else {
      document.getElementById('pedidosData').innerText += `\n❌ ${ruta}: vacío`;
    }
  }).catch(()=>{});
});

db.ref('kigo_pedidos').once('value').then(snap=>{
  const val=snap.val();
  if(val){
    document.getElementById('pedidosData').innerText = `DATOS EN kigo_pedidos y otros:\n`;
  }
});
</script>
</body>
</html>
