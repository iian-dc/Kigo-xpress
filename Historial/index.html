<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Kigo Historial - Valoración Real Time</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#f6f7fb;color:#0a0a0a;padding-bottom:80px}
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1.5px solid #e5e7eb;padding:10px 12px;display:flex;justify-content:space-between;align-items:center}
.cat-bar-bottom{position:fixed;bottom:0;left:0;right:0;z-index:50;background:#fff;border-top:1.5px solid #e5e7eb;padding:6px 6px;display:flex;gap:3px;justify-content:center}
.cat-bar-bottom button{height:38px;padding:0 6px;border-radius:999px;border:1.5px solid #e5e7eb;background:#fff;font-size:6.5px;font-weight:900;flex:1}
.cat-bar-bottom button.active{background:#0a0a0a;color:#fff;border-color:#0a0a0a}
.subcats{background:#fff;padding:10px 12px;display:flex;gap:8px;overflow:auto;border-bottom:1px solid #e5e7eb;position:sticky;top:57px;z-index:19}
.subcats button{height:34px;padding:0 12px;border-radius:999px;border:1.5px solid #e5e7eb;background:#fff;font-size:8px;font-weight:900;white-space:nowrap}
.subcats button.active{background:#0a0a0a;color:#fff;border-color:#0a0a0a}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;padding:10px 12px}
.stat{background:#fff;border:1.5px solid #e5e7eb;border-radius:14px;padding:10px;text-align:center}
.stat b{font-size:14px;display:block}
.stat span{font-size:7px;font-weight:800;color:#6b7280}
.filtros{background:#fff;border:1.5px solid #e5e7eb;border-radius:14px;margin:0 12px 10px;padding:10px}
.row{display:flex;gap:6px;flex-wrap:wrap}
.input-k{flex:1;min-width:100px;height:38px;border:1.5px solid #e5e7eb;border-radius:10px;padding:0 10px;font-size:9px;font-weight:800;background:#fff}
.btn-l{height:38px;padding:0 14px;border-radius:10px;border:1.5px solid #e5e7eb;background:#fff;font-size:8px;font-weight:800}
.wrap{background:#fff;border:1.5px solid #e5e7eb;border-radius:14px;margin:0 12px;overflow:auto}
table{width:100%;border-collapse:collapse;min-width:1100px;font-size:10px}
th{background:#f9fafb;padding:10px 8px;text-align:left;font-size:8px;font-weight:900;border-bottom:1px solid #e5e7eb}
td{padding:10px 8px;border-bottom:1px solid #f3f4f6}
.pill{padding:3px 8px;border-radius:999px;font-size:8px;font-weight:900;display:inline-block;border:1px solid}
.pill-m{background:#dbeafe;color:#1e40af;border-color:#bfdbfe}
.pill-t{background:#fef3c7;color:#92400e;border-color:#fde68a}
.pill-si{background:#dcfce7;color:#166534;border-color:#86efac}
.pill-no{background:#fee2e2;color:#991b1b;border-color:#fecaca}
.btn{height:28px;padding:0 10px;border-radius:8px;border:1px solid #e5e7eb;background:#fff;font-size:8px;font-weight:800;cursor:pointer}
.btn-b{background:#0a0a0a;color:#fff}
.btn-r{color:#ef4444;border-color:#fecaca}
.num{background:#0a0a0a;color:#fff;padding:4px 8px;border-radius:7px;font-weight:900}
.btn-cerrar{height:32px;padding:0 14px;border-radius:999px;background:#0a0a0a;color:#fff;border:1px solid #0a0a0a;font-size:8px;font-weight:900}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.55);backdrop-filter:blur(6px);z-index:99;display:none;align-items:center;justify-content:center;padding:16px}
.modal-bg.show{display:flex}
.modal{width:100%;max-width:480px;background:#fff;border-radius:20px;overflow:hidden}
.modal-head{padding:16px 18px;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;align-items:center}
.modal-body{padding:16px 18px;display:flex;flex-direction:column;gap:10px;max-height:70vh;overflow:auto}
.lab{font-size:8px;font-weight:900;color:#6b7280}
.inp{height:42px;border:1.5px solid #e5e7eb;border-radius:10px;padding:0 12px;font-size:10px;font-weight:700;width:100%}
.sel{height:42px;border:1.5px solid #e5e7eb;border-radius:10px;padding:0 12px;font-size:10px;font-weight:800;width:100%;background:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal-foot{padding:12px 18px;border-top:1px solid #e5e7eb;display:flex;gap:8px;justify-content:flex-end}
.btn-save{height:40px;padding:0 18px;border-radius:10px;background:#0a0a0a;color:#fff;border:none;font-size:9px;font-weight:900}
.btn-cancel{height:40px;padding:0 18px;border-radius:10px;background:#fff;border:1.5px solid #e5e7eb;font-size:9px;font-weight:900}
.btn-del-r{height:40px;padding:0 18px;border-radius:10px;background:#ef4444;color:#fff;border:none;font-size:9px;font-weight:900}
.btn-del-g{height:40px;padding:0 18px;border-radius:10px;background:#10b981;color:#fff;border:none;font-size:9px;font-weight:900}
.auto-wrap{position:relative}
.auto-list{position:absolute;top:44px;left:0;right:0;background:#fff;border:1.5px solid #e5e7eb;border-radius:12px;max-height:160px;overflow:auto;z-index:10;display:none}
.auto-list.show{display:block}
.auto-item{padding:10px 12px;font-size:9px;font-weight:800;border-bottom:1px solid #f3f4f6;cursor:pointer}
.cli-card{background:#fff;border:1.5px solid #e5e7eb;border-radius:14px;padding:10px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.fin-card{background:#fff;border:1.5px solid #e5e7eb;border-radius:14px;padding:12px;margin-bottom:8px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-day{background:#fff;border:1px solid #e5e7eb;border-radius:8px;padding:6px;min-height:58px}
.cal-day b{font-size:8px;display:block}
.cal-day span{font-size:6px;font-weight:800}
</style>
</head>
<body>
<div class="top">
<div style="display:flex;align-items:center;gap:8px">
<div style="width:36px;height:36px;background:#0a0a0a;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:11px">K</div>
<div><div style="font-weight:900;font-size:11px">Panel Historial Kigo</div><div style="font-size:7px;font-weight:800;color:#10b981">● TIEMPO REAL + ADMIN</div></div>
</div>
<button class="btn-cerrar" onclick="window.close()">CERRAR</button>
</div>

<div id="view-historial">
<div class="subcats">
<button class="active" onclick="setSubcat('todos',this)">TODOS</button>
<button onclick="setSubcat('hoy',this)">HOY</button>
<button onclick="setSubcat('ayer',this)">AYER</button>
<button onclick="setSubcat('semana',this)">SEMANA</button>
<button onclick="setSubcat('mes',this)">MES</button>
</div>
<div class="stats">
<div class="stat"><span>TOTAL</span><b id="sTotal">0</b></div>
<div class="stat"><span>INGRESOS</span><b id="sIng" style="color:#10b981">$0</b></div>
<div class="stat"><span>PAGADOS</span><b id="sPag">0</b></div>
<div class="stat"><span>DEBEN</span><b id="sDebe" style="color:#ef4444">$0</b></div>
</div>
<div class="filtros"><div class="row"><input type="month" id="filtroMes" class="input-k" onchange="aplicar()"><input type="date" id="filtroFecha" class="input-k" onchange="aplicar()"><input type="text" id="filtroQ" class="input-k" placeholder="Buscar cliente/repa" oninput="aplicar()"><button class="btn-l" onclick="limpiar()">LIMPIAR</button></div></div>
<div class="wrap"><table><thead><tr><th>#ID</th><th>Fecha</th><th>Cliente</th><th>Servicio</th><th>Repartidor</th><th>Valor</th><th>Fee</th><th>Pago</th><th>Editar</th><th>Eliminar</th></tr></thead><tbody id="tbody"></tbody></table></div>
</div>

<!-- Resto de vistas igual que tu código original -->
<div id="view-finanzas" style="display:none"><div style="padding:12px"><div class="stats" style="padding:0;margin-bottom:10px"><div class="stat"><span>TOTAL</span><b id="fTotal">0</b><span id="fTotalSub">0 mes</span></div><div class="stat"><span>PAGADOS</span><b id="fIng" style="color:#10b981">$0</b></div><div class="stat"><span>POR COBRAR</span><b id="fCobrar" style="color:#ef4444">$0</b></div><div class="stat"><span>PROMEDIO</span><b id="fProm">$0</b></div></div><div id="finMesWrap"></div></div></div>
<div id="view-valoracion" style="display:none"><div style="padding:12px"><div class="stats" style="padding:0;margin-bottom:10px"><div class="stat"><span>INGRESOS</span><b id="vIngBruto" style="color:#10b981">$0</b></div><div class="stat"><span>GASTOS</span><b id="vGastos" style="color:#ef4444">$0</b></div><div class="stat"><span>NETA</span><b id="vNeta">$0</b></div><div class="stat"><span>MES NETA</span><b id="vNetaMes">$0</b></div></div><div style="background:#fff;border:1.5px solid #e5e7eb;border-radius:14px;padding:12px;margin-bottom:10px"><div style="font-weight:900;font-size:10px;margin-bottom:8px">➕ AGREGAR GASTO</div><div class="grid2"><select id="gastoTipo" class="sel"><option value="gasolina">⛽ Gasolina</option><option value="arreglos">🔧 Arreglos</option><option value="policia">👮 Policía</option><option value="comida">🍔 Comida</option><option value="otro">💸 Otro</option></select><input id="gastoValor" type="number" class="inp" placeholder="Valor $"></div><div class="grid2" style="margin-top:6px"><input id="gastoFecha" type="date" class="inp"><input id="gastoNota" class="inp" placeholder="Nota"></div><button class="btn-save" style="width:100%;margin-top:8px;background:#ef4444" onclick="agregarGasto()">Guardar Gasto</button></div><div id="listaGastosWrap"></div></div></div>
<div id="view-clientes" style="display:none"><div style="padding:12px"><div style="display:flex;gap:6px;margin-bottom:10px"><input id="buscaCli" class="input-k" placeholder="Buscar cliente..." oninput="renderClientes()"><span id="totalCliTxt" style="background:#0a0a0a;color:#fff;padding:8px 12px;border-radius:999px;font-size:8px;font-weight:900">0</span></div><div id="listaCliWrap"></div><div id="rankingWrap" style="margin-top:10px"></div></div></div>
<div id="view-repas" style="display:none"><div style="padding:12px"><div id="listaRepaWrap"></div></div></div>

<div class="cat-bar-bottom"><button class="active" id="btnCatHistorial" onclick="setCat('historial')">HISTORIAL</button><button id="btnCatFinanzas" onclick="setCat('finanzas')">FINANZAS</button><button id="btnCatValoracion" onclick="setCat('valoracion')">VALORACIÓN</button><button id="btnCatClientes" onclick="setCat('clientes')">CLIENTES</button><button id="btnCatRepas" onclick="setCat('repas')">REPARTIDORES</button></div>

<script>
const firebaseConfig = { apiKey: "AIzaSyDGTYI2ZZnP49DbaMIpRSoGIjZrU6RAEiE", authDomain: "historial-kigo-xpress.firebaseapp.com", databaseURL: "https://historial-kigo-xpress-default-rtdb.firebaseio.com", projectId: "historial-kigo-xpress", storageBucket: "historial-kigo-xpress.firebasestorage.app", messagingSenderId: "571399920545", appId: "1:571399920545:web:aa16407753b43cbe2e89e0" };
firebase.initializeApp(firebaseConfig); const db=firebase.database();
let todos=[], subcat='todos'; let clientesDB={}, repasDB={}, gastosDB={};

function getTS(p){ if(p.fecha && typeof p.fecha==='string'){ let txt=p.fecha.split(' ')[0].trim(); if(txt.includes('/')){ let parts=txt.split('/'); if(parts.length===3){ let m=parseInt(parts[0]), d=parseInt(parts[1]), y=parseInt(parts[2]); if(y<100) y+=2000; let f=new Date(y,m-1,d,12,0,0); if(!isNaN(f)) return f.getTime(); } } } if(p.ts) return Number(p.ts) < 1e12? Number(p.ts)*1000 : Number(p.ts); if(p.timestamp){ let t=Number(p.timestamp); return t<1e12? t*1000 : t; } if(p.iso){ let d=new Date(p.iso+'T12:00:00'); if(!isNaN(d)) return d.getTime(); } return 0; }
function fFecha(ts){ let d=new Date(ts); return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`; }
function isoF(ts){ return new Date(ts).toISOString().slice(0,10); }
function isoM(ts){ let d=new Date(ts); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function esHoy(ts){ return new Date(ts).toDateString()===new Date().toDateString(); }
function esAyer(ts){ let a=new Date(); a.setDate(a.getDate()-1); return new Date(ts).toDateString()===a.toDateString(); }
function esSemana(ts){ let hoy=new Date(); let ini=new Date(hoy); ini.setDate(hoy.getDate()-hoy.getDay()); ini.setHours(0,0,0,0); return ts>=ini.getTime(); }
function esMes(ts){ let d=new Date(ts), h=new Date(); return d.getMonth()===h.getMonth()&&d.getFullYear()===h.getFullYear(); }

window.setCat=function(cat){ document.getElementById('view-historial').style.display=cat==='historial'?'block':'none'; document.getElementById('view-finanzas').style.display=cat==='finanzas'?'block':'none'; document.getElementById('view-valoracion').style.display=cat==='valoracion'?'block':'none'; document.getElementById('view-clientes').style.display=cat==='clientes'?'block':'none'; document.getElementById('view-repas').style.display=cat==='repas'?'block':'none'; document.querySelectorAll('.cat-bar-bottom button').forEach(b=>b.classList.remove('active')); document.getElementById('btnCatHistorial').classList.toggle('active',cat==='historial'); document.getElementById('btnCatFinanzas').classList.toggle('active',cat==='finanzas'); document.getElementById('btnCatValoracion').classList.toggle('active',cat==='valoracion'); document.getElementById('btnCatClientes').classList.toggle('active',cat==='clientes'); document.getElementById('btnCatRepas').classList.toggle('active',cat==='repas'); }

// HISTORIAL TIEMPO REAL: escucha ventasKigo + kigo_pedidos finalizados
db.ref('ventasKigo').on('value', snap=>{ procesarVentas(snap.val()||{}); });
db.ref('kigo_pedidos').on('value', snap=>{
  let val=snap.val()||{};
  let finalizados=Object.entries(val).filter(([k,v])=> v.estado==='finalizado' || v.archivado).map(([k,v])=>({ _key:k, cliente:v.recogerEn||v.tipo||'Cliente', repa:v.repaAsignado||'', valor: (v.precioNum||parseInt((v.precio||'').replace(/[^0-9]/g,''))||0), feeKigo: v.precioNum||0, tipoServicio:v.tipo||'', pagado:true, fecha:v.fecha||'', ts:v.timestamp||Date.now(), timestamp:v.timestamp||Date.now(), _ts:getTS(v) }));
  // Mezclar con todos actuales
  window._finalizadosAdmin = finalizados;
  if(window._ventasBase) combinar();
});

let _ventasBase=[];
function procesarVentas(val){
  let lista=Object.entries(val).map(([k,v])=>({...v,_key:k,_ts:getTS(v)})).filter(p=>p._ts>0);
  lista.sort((a,b)=>a._ts-b._ts); lista.forEach((p,i)=> p.numeroOrden=i+1);
  _ventasBase=lista;
  combinar();
}
function combinar(){
  let combined=[..._ventasBase,...(window._finalizadosAdmin||[])];
  combined.sort((a,b)=>b._ts-a._ts);
  todos=combined;
  aplicar(); renderClientes(); renderFinanzas(); renderValoracion();
}

db.ref('clientesKigo').on('value', s=>{ clientesDB=s.val()||{}; renderClientes(); });
db.ref('repartidoresKigo').on('value', s=>{ repasDB=s.val()||{}; });
db.ref('gastosKigo').on('value', s=>{ gastosDB=s.val()||{}; renderValoracion(); });

window.setSubcat=function(t,btn){ subcat=t; document.querySelectorAll('.subcats button').forEach(b=>b.classList.remove('active')); if(btn) btn.classList.add('active'); aplicar(); }
window.limpiar=function(){ document.getElementById('filtroMes').value=''; document.getElementById('filtroFecha').value=''; document.getElementById('filtroQ').value=''; subcat='todos'; aplicar(); }
window.aplicar=function(){ let mes=document.getElementById('filtroMes').value; let fecha=document.getElementById('filtroFecha').value; let q=(document.getElementById('filtroQ').value||'').toLowerCase(); let lista=todos.filter(p=>{ if(subcat==='hoy'&&!esHoy(p._ts)) return false; if(subcat==='ayer'&&!esAyer(p._ts)) return false; if(subcat==='semana'&&!esSemana(p._ts)) return false; if(subcat==='mes'&&!esMes(p._ts)) return false; if(mes&&isoM(p._ts)!==mes) return false; if(fecha&&isoF(p._ts)!==fecha) return false; if(q){ let c=(p.cliente||'').toLowerCase(); let r=(p.repa||'').toLowerCase(); if(!c.includes(q)&&!r.includes(q)) return false; } return true; }); render(lista); }
function render(lista){ let tb=document.getElementById('tbody'); if(!lista.length){ tb.innerHTML=`<tr><td colspan="10" style="text-align:center;padding:20px">Sin pedidos - Esperando base de datos</td></tr>`; document.getElementById('sTotal').innerText=0; document.getElementById('sIng').innerText='$0'; return; } let ing=0; lista.forEach(p=>{ let fee=p.feeKigo||p.valor||0; if(p.pagado) ing+=parseInt(fee)||0; }); document.getElementById('sTotal').innerText=lista.length; document.getElementById('sIng').innerText='$'+ing.toLocaleString(); tb.innerHTML=''; lista.slice(0,200).forEach(p=>{ let tr=document.createElement('tr'); tr.innerHTML=`<td><span class="num">#${p.numeroOrden||''}</span></td><td><b>${p.fecha||fFecha(p._ts)}</b></td><td><b style="font-size:9px">${(p.cliente||'').slice(0,18)}</b></td><td>${p.tipoServicio||p.tipo||''}</td><td>${p.repa||''}</td><td><b style="color:#10b981">$${p.valor||0}</b></td><td><b style="color:#ef4444">$${p.feeKigo||p.valor||0}</b></td><td>${p.pagado?'✅':'❌'}</td><td>-</td><td>-</td>`; tb.appendChild(tr); }); }

window.renderClientes=function(){
  let busca=(document.getElementById('buscaCli')?.value||'').toLowerCase(); let conteo={}; todos.forEach(p=>{ let n=(p.cliente||'').trim(); if(!n) return; let k=n.toLowerCase(); conteo[k]=conteo[k]||{nombre:n,count:0,total:0}; conteo[k].count++; conteo[k].total+=parseInt(p.valor||0)||0; });
  let lista=Object.values(conteo); if(busca) lista=lista.filter(c=>c.nombre.toLowerCase().includes(busca)); lista.sort((a,b)=>b.count-a.count);
  document.getElementById('totalCliTxt').innerText=lista.length+' CLIENTES';
  document.getElementById('listaCliWrap').innerHTML=lista.map(c=>`<div style="background:#fff;border:1.5px solid #e5e7eb;border-radius:12px;padding:10px;margin-bottom:6px;display:flex;justify-content:space-between"><div><div style="font-weight:800;font-size:10px">${c.nombre}</div><div style="font-size:7px;color:#666">${c.count} pedidos • $${c.total.toLocaleString()}</div></div><span style="background:#0a0a0a;color:#fff;padding:4px 8px;border-radius:999px;font-size:7px">${c.count}</span></div>`).join('');
  document.getElementById('rankingWrap').innerHTML='<div style="font-weight:900;font-size:10px;margin:10px 0">TOP 20 CLIENTES</div>'+lista.slice(0,20).map((c,i)=>`<div style="display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid #eee"><span style="font-size:9px">${i+1}. ${c.nombre}</span><b style="font-size:8px">$${c.total.toLocaleString()}</b></div>`).join('');
}
window.renderFinanzas=function(){ if(!todos.length) return; let porMes={}; todos.forEach(p=>{ let m=isoM(p._ts); porMes[m]=(porMes[m]||0)+(parseInt(p.valor||0)||0); }); let meses=Object.keys(porMes).sort().slice(-8); document.getElementById('finMesWrap').innerHTML=meses.map(m=>`<div style="display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid #f3f4f6"><span style="font-size:8px;font-weight:900">${m}</span><b style="font-size:8px">$${porMes[m].toLocaleString()}</b></div>`).join(''); document.getElementById('fTotal').innerText=todos.length; }
window.agregarGasto=function(){ let tipo=document.getElementById('gastoTipo').value; let valor=parseInt(document.getElementById('gastoValor').value); let fecha=document.getElementById('gastoFecha').value; let nota=document.getElementById('gastoNota').value; if(!valor||!fecha) return alert('Valor y fecha'); db.ref('gastosKigo').push({tipo,valor,fecha,nota,ts:new Date(fecha+'T12:00:00').getTime()}); document.getElementById('gastoValor').value=''; }
window.renderValoracion=function(){
  let ing=0; todos.forEach(p=>{ if(p.pagado) ing+=parseInt(p.valor||p.feeKigo||0)||0; });
  let gastos=Object.values(gastosDB); let totalG=0; gastos.forEach(g=> totalG+=parseInt(g.valor)||0);
  document.getElementById('vIngBruto').innerText='$'+ing.toLocaleString(); document.getElementById('vGastos').innerText='$'+totalG.toLocaleString(); document.getElementById('vNeta').innerText='$'+(ing-totalG).toLocaleString();
  document.getElementById('listaGastosWrap').innerHTML=gastos.slice(0,20).map(g=>`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #eee"><span style="font-size:8px">${g.tipo} ${g.fecha}</span><b style="font-size:8px;color:#ef4444">$${g.valor}</b></div>`).join('');
}
</script>
</body>
</html>
