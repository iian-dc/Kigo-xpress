<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Kigo V15 - Historial Copia Exacta + #ID Contable</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
:root{--border:#e5e7eb}
body{background:#f8f9fb;padding-bottom:20px}
.card{background:#fff;border:1.5px solid var(--border);border-radius:14px;padding:10px;margin:8px}
.wrap{position:relative;background:#fff;border:1.5px solid var(--border);border-radius:10px;display:flex;align-items:center;padding:0 10px;height:36px;margin-top:4px}
.wrap input{width:100%;height:100%;border:none;outline:none;font-size:11px;font-weight:600;background:transparent}
.resumen-box{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;margin:8px}
.resumen-item{background:#fff;border:1.5px solid var(--border);border-radius:12px;padding:8px;text-align:center}
.resumen-item b{font-size:12px;display:block}.resumen-item span{font-size:7px;font-weight:800;color:#6b7280;text-transform:uppercase}
.tab-hist{height:28px;padding:0 12px;border-radius:20px;border:1px solid var(--border);background:#fff;font-size:8px;font-weight:800;cursor:pointer}
.tab-hist.active{background:#0a0a0a;color:#fff}
.top{position:sticky;top:0;z-index:50;background:#0a0a0a;color:#fff;padding:10px 12px;display:flex;justify-content:space-between;align-items:center}
.btn{padding:6px 8px;border-radius:8px;border:1.5px solid var(--border);background:#fff;font-size:8px;font-weight:800;cursor:pointer}
@media(max-width:700px){.resumen-box{grid-template-columns:1fr 1fr}}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
</head>
<body>
<div class="top"><div style="font-weight:800;font-size:12px">KIGO XPRESS V15 - HISTORIAL - <span id="totalCount">0</span> PEDIDOS</div><button onclick="window.location.href='https://iian-dc.github.io/Kigoxpress/login/'" style="background:#fff;border:none;border-radius:10px;padding:6px 12px;font-weight:900;font-size:10px">Salir</button></div>

<div id="view-historial" class="view" style="display:block">
<div style="display:flex;gap:4px;padding:8px;overflow-x:auto">
<button id="hHoy" class="tab-hist active" onclick="setHistPeriodo('hoy')">HOY</button>
<button id="hMes" class="tab-hist" onclick="setHistPeriodo('mes')">MES</button>
<button id="hTodo" class="tab-hist" onclick="setHistPeriodo('todo')">TODO</button>
<button id="hFecha" class="tab-hist" onclick="setHistPeriodo('fecha')">RANGO</button>
<div class="wrap" style="flex:1;min-width:140px;margin-top:0"><input type="text" id="busqueda" placeholder="🔍 Buscar cliente, repa..." oninput="aplicarFiltros()"></div>
</div>
<div id="rangoFechas" style="display:none;padding:0 8px 8px;gap:4px"><div class="wrap" style="flex:1"><input type="date" id="fDesde"></div><div class="wrap" style="flex:1"><input type="date" id="fHasta"></div><button onclick="aplicarFiltroFecha()" style="height:36px;padding:0 12px;border-radius:10px;background:#0a0a0a;color:#fff;border:none;font-size:8px;font-weight:800">FILTRAR</button></div>
<div class="resumen-box">
<div class="resumen-item"><b id="rTotalPedidos">0</b><span>Total</span></div>
<div class="resumen-item"><b id="rTotalIngresado">$0</b><span>Ingresado</span></div>
<div class="resumen-item"><b id="rTotalRepa">$0</b><span>Repa gana</span></div>
<div class="resumen-item" style="border-color:#86efac;background:#f0fdf4"><b id="rMisIngresos" style="color:#10b981">$0</b><span>Mis ingresos</span></div>
</div>
<div class="card" style="padding:0;overflow:hidden">
<div style="display:flex;background:#0a0a0a;color:#fff;padding:8px 10px;font-size:7px;font-weight:800"><div style="flex:1"> #ID / FECHA / CLIENTE / REPA</div><div style="width:90px;text-align:center">VALORES</div><div style="width:110px;text-align:center">ACCIONES</div></div>
<div id="listaHistorial"></div>
</div>
</div>

<div id="modalEditar" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99;align-items:center;justify-content:center;padding:14px"><div style="background:#fff;width:100%;max-width:360px;border-radius:16px;padding:16px">
<b>Editar #<span id="editIdNum"></span></b>
<input id="editCliente" placeholder="Cliente" style="width:100%;padding:10px;margin-top:8px;border-radius:10px;border:1.5px solid #e5e7eb">
<input id="editPrecio" placeholder="Valor" style="width:100%;padding:10px;margin-top:6px;border-radius:10px;border:1.5px solid #e5e7eb">
<label style="display:flex;gap:6px;margin-top:8px;font-size:11px;font-weight:800"><input type="checkbox" id="editPagado"> Repartidor pagó</label>
<div style="display:flex;gap:6px;margin-top:10px"><button onclick="guardarEdicion()" style="flex:1;height:40px;background:#10b981;color:#fff;border:none;border-radius:10px;font-weight:800">Guardar</button><button onclick="document.getElementById('modalEditar').style.display='none'" style="flex:1;height:40px;background:#fff;border:1.5px solid #e5e7eb;border-radius:10px;font-weight:800">Cancelar</button></div>
</div></div>

<script>
const firebaseConfig = { apiKey: "AIzaSyDGTYI2ZZnP49DbaMIpRSoGIjZrU6RAEiE", authDomain: "historial-kigo-xpress.firebaseapp.com", databaseURL: "https://historial-kigo-xpress-default-rtdb.firebaseio.com", projectId: "historial-kigo-xpress", storageBucket: "historial-kigo-xpress.firebasestorage.app", messagingSenderId: "571399920545", appId: "1:571399920545:web:aa16407753b43cbe2e89e0" };
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
let todosPedidos=[]; let filtrados=[]; let periodoActual='hoy'; let editandoKey=null; let editandoRuta=null;
</script>
<script>
function fechaCorta(ts){
 if(!ts || ts===0) return '-';
 const d=new Date(ts);
 if(isNaN(d.getTime())) return '-';
 return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
}
function parseFechaReal(p){
  if(p.timestamp && Number(p.timestamp)>1000000000) return Number(p.timestamp);
  if(p.fechaTimestamp &&!isNaN(p.fechaTimestamp)) return Number(p.fechaTimestamp);
  if(p.createdAt &&!isNaN(p.createdAt)) return Number(p.createdAt);
  if(p.confirmadoEn &&!isNaN(p.confirmadoEn)) return Number(p.confirmadoEn);
  if(p.fecha &&!isNaN(p.fecha) && String(p.fecha).length>8) return Number(p.fecha);
  if(p.fecha && typeof p.fecha==='string'){
    const partes = p.fecha.split(' ')[0].split('/');
    if(partes.length===3){ const d=new Date(parseInt(partes[2]), parseInt(partes[1])-1, parseInt(partes[0])); if(!isNaN(d.getTime())) return d.getTime(); }
    const d2=new Date(p.fecha); if(!isNaN(d2.getTime())) return d2.getTime();
  }
  if(p.fechaCreacion){ const d=new Date(p.fechaCreacion); if(!isNaN(d.getTime())) return d.getTime(); }
  return 0;
}
let datosTemp={};
function procesarRuta(nombreRuta){
 db.ref(nombreRuta).on('value', snap=>{
  const val=snap.val(); if(!val) return;
  datosTemp[nombreRuta]=val;
  let unidos=[];
  Object.keys(datosTemp).forEach(ruta=>{
   Object.keys(datosTemp[ruta]).forEach(k=>{
    const p=datosTemp[ruta][k];
    if(typeof p==='object' &&!unidos.find(u=>u.fbKey===k)){
     unidos.push({
      fbKey:k, rutaOrigen:ruta,
      timestamp: parseFechaReal(p),
      clienteNombre: p.clienteNombre || p.cliente || p.aliado || 'Cliente',
      repartidorNombre: p.repartidorNombre || p.repartidor || p.repa || p.nombreRepa || 'Sin asignar',
      tipoServicio: p.tipoServicio || p.tipo || 'Moto Mandado',
      razonServicio: p.razonServicio || 'Recoger',
    ...p
     });
    }
   });
  });
  unidos.sort((a,b)=>(a.timestamp||0)-(b.timestamp||0));
  unidos.forEach((ped, idx)=>{ ped.numeroContable=idx+1; });
  todosPedidos = unidos.slice().reverse();
  document.getElementById('totalCount').innerText=todosPedidos.length;
  aplicarFiltros();
 });
}
procesarRuta('kigoHistorial'); procesarRuta('ventasKigo'); procesarRuta('kigoPedidosLive'); procesarRuta('kigoPedidosCancelados');

function setHistPeriodo(periodo){
 periodoActual=periodo;
 document.querySelectorAll('.tab-hist').forEach(b=>b.classList.remove('active'));
 document.getElementById('h'+periodo.charAt(0).toUpperCase()+periodo.slice(1)).classList.add('active');
 document.getElementById('rangoFechas').style.display = periodo==='fecha'? 'flex':'none';
 aplicarFiltros();
}
function aplicarFiltroFecha(){ aplicarFiltros(); }

function aplicarFiltros(){
 const txt=(document.getElementById('busqueda').value||'').toLowerCase();
 const desdeVal=document.getElementById('fDesde').value;
 const hastaVal=document.getElementById('fHasta').value;
 const desde = desdeVal? new Date(desdeVal).getTime():0;
 const hasta = hastaVal? new Date(hastaVal).getTime()+86400000: Date.now()+86400000;
 filtrados = todosPedidos.filter(p=>{
  const ts=p.timestamp||0;
  if(periodoActual==='hoy'){ if(ts===0) return false; if(new Date(ts).toDateString()!==new Date().toDateString()) return false; }
  if(periodoActual==='mes'){ if(ts===0) return false; const d=new Date(ts), h=new Date(); if(d.getMonth()!==h.getMonth()||d.getFullYear()!==h.getFullYear()) return false; }
  if(periodoActual==='fecha'){ if(ts===0) return false; if(ts<desde||ts>hasta) return false; }
  if(txt){ if(!String(p.clienteNombre||'').toLowerCase().includes(txt) &&!String(p.repartidorNombre||'').toLowerCase().includes(txt)) return false; }
  return true;
 });
 filtrados.sort((a,b)=>(b.timestamp||0)-(a.timestamp||0));
 renderHistorial(filtrados);
 actualizarResumen(filtrados);
}
function actualizarResumen(lista){
 document.getElementById('rTotalPedidos').innerText=lista.length;
 let ingresado=0, repaGana=0;
 lista.forEach(p=>{ const precio=parseInt(String(p.precio||p.total||'').replace(/[^0-9]/g,''))||0; ingresado+=precio; repaGana+=Math.round(precio*0.7); });
 document.getElementById('rTotalIngresado').innerText='$'+ingresado.toLocaleString();
 document.getElementById('rTotalRepa').innerText='$'+repaGana.toLocaleString();
 document.getElementById('rMisIngresos').innerText='$'+(ingresado-repaGana).toLocaleString();
}
function renderHistorial(lista){
 const cont=document.getElementById('listaHistorial');
 if(!lista.length){ cont.innerHTML=`<div style="padding:20px;text-align:center;font-size:10px;font-weight:800">Sin pedidos - Total BD: ${todosPedidos.length}</div>`; return; }
 cont.innerHTML='';
 lista.forEach(p=>{
  const pagado = p.pagadoRepa===true;
  const fecha=fechaCorta(p.timestamp);
  const precio=parseInt(String(p.precio||p.total||'').replace(/[^0-9]/g,''))||0;
  const row=document.createElement('div');
  row.style.cssText='display:flex;align-items:center;padding:10px;border-bottom:1px solid #f3f4f6;font-size:9px';
  row.innerHTML=`
   <div style="flex:1;line-height:1.3">
    <div style="display:flex;gap:4px;align-items:center"><b style="background:#0a0a0a;color:#fff;padding:2px 6px;border-radius:6px;font-size:8px">#${p.numeroContable}</b><span style="font-weight:800">${fecha}</span><span style="background:${pagado?'#dcfce7':'#fee2e2'};color:${pagado?'#166534':'#991b1b'};padding:2px 5px;border-radius:999px;font-size:7px;font-weight:900">${pagado?'PAGADO':'NO'}</span></div>
    <div style="margin-top:2px"><b>${String(p.clienteNombre).substring(0,24)}</b> • ${String(p.repartidorNombre).substring(0,14)}</div>
    <div style="color:#6b7280;font-size:7px">${p.tipoServicio} - ${p.razonServicio}</div>
   </div>
   <div style="width:90px;text-align:center"><b style="font-size:11px">$${precio}</b><div style="font-size:7px;color:#6b7280">Repa $${Math.round(precio*0.7)}</div></div>
   <div style="width:110px;display:flex;gap:4px;justify-content:center">
    <button onclick="togglePagado('${p.fbKey}','${p.rutaOrigen}')" style="width:28px;height:28px;border-radius:8px;border:1.5px solid ${pagado?'#86efac':'#bfdbfe'};background:${pagado?'#dcfce7':'#dbeafe'};cursor:pointer">💰</button>
    <button onclick="editarPedido('${p.fbKey}')" style="width:28px;height:28px;border-radius:8px;border:1.5px solid #e5e7eb;background:#fff;cursor:pointer">✏️</button>
    <button onclick="borrarPedido('${p.fbKey}')" style="width:28px;height:28px;border-radius:8px;border:1.5px solid #fecaca;background:#fee2e2;cursor:pointer">🗑️</button>
   </div>
  `;
  cont.appendChild(row);
 });
}
</script>
<script>
window.togglePagado=function(fbKey,ruta){
 const p=todosPedidos.find(x=>x.fbKey===fbKey); if(!p) return;
 const nuevo=!p.pagadoRepa;
 if(!confirm(nuevo?'¿Marcar PAGADO?':'¿Marcar NO PAGADO?')) return;
 db.ref(`${ruta}/${fbKey}`).update({pagadoRepa:nuevo}).then(()=>{p.pagadoRepa=nuevo; aplicarFiltros();});
}
window.editarPedido=function(fbKey){
 const p=todosPedidos.find(x=>x.fbKey===fbKey); if(!p) return;
 editandoKey=fbKey; editandoRuta=p.rutaOrigen;
 document.getElementById('editIdNum').innerText=p.numeroContable;
 document.getElementById('editCliente').value=p.clienteNombre||'';
 document.getElementById('editPrecio').value=p.precio||p.total||'';
 document.getElementById('editPagado').checked=p.pagadoRepa===true;
 document.getElementById('modalEditar').style.display='flex';
}
window.guardarEdicion=function(){
 if(!editandoKey) return;
 const up={clienteNombre:document.getElementById('editCliente').value, precio:document.getElementById('editPrecio').value, total:document.getElementById('editPrecio').value, pagadoRepa:document.getElementById('editPagado').checked};
 db.ref(`${editandoRuta}/${editandoKey}`).update(up).then(()=>{document.getElementById('modalEditar').style.display='none';});
}
window.borrarPedido=function(fbKey){
 const p=todosPedidos.find(x=>x.fbKey===fbKey);
 if(!confirm(`¿Borrar #${p.numeroContable}?`)) return;
 db.ref(`${p.rutaOrigen}/${fbKey}`).remove();
}
</script>
</body>
</html>
