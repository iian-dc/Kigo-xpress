<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KIGO Historial</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',system-ui}
body{background:#F2F2F2}
.app{max-width:460px;margin:0 auto;background:#fff;min-height:100vh}
.top{padding:12px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee;background:#fff;position:sticky;top:0;z-index:10}
.top b{font-size:12px;font-weight:900}
.count{font-size:8px;background:#111;color:#fff;padding:4px 10px;border-radius:999px;font-weight:900}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding:10px;background:#fff;border-bottom:1px solid #eee}
.s{border-radius:12px;padding:10px;text-align:center}
.s b{display:block;font-size:16px;font-weight:900}
.s span{font-size:7px;font-weight:800}
.s1{background:#111;color:#fff}
.s2{background:#f0fdf4;border:1.5px solid #86efac}
.s3{background:#fef2f2;border:1.5px solid #fecaca}
.panel{padding:10px}
.inp{width:100%;padding:10px;border-radius:10px;border:1.5px solid #eee;font-size:10px;outline:none}
.fils{display:flex;gap:6px;margin-top:8px;overflow-x:auto}
.fb{padding:7px 12px;border-radius:999px;border:1.5px solid #eee;background:#fff;font-size:7px;font-weight:900;white-space:nowrap;cursor:pointer}
.fb.active{background:#111;color:#fff}
.card{border:1.5px solid #eee;border-radius:12px;padding:10px;margin-top:8px;background:#fff}
.line{font-size:8px;color:#333;background:#F7F7F7;padding:5px 7px;border-radius:7px;margin-top:4px}
.price{font-size:12px;font-weight:900;color:#00C851}
</style>
</head>
<body>
<div class="app">
  <div class="top"><b>HISTORIAL</b><div class="count" id="count">0</div></div>
  <div class="stats">
    <div class="s s1"><b id="t1">0</b><span>PEDIDOS</span></div>
    <div class="s s2"><b id="t2" style="color:#10b981">$0</b><span>NETO</span></div>
    <div class="s s3"><b id="t3" style="color:#ef4444">$0</b><span>COMISIÓN</span></div>
  </div>
  <div class="panel">
    <input id="q" class="inp" placeholder="Buscar cliente, repartidor..." oninput="draw()">
    <div class="fils">
      <button class="fb active" onclick="fil('todos',this)">TODOS</button>
      <button class="fb" onclick="fil('Jose',this)">JOSE</button>
      <button class="fb" onclick="fil('aliados',this)">ALIADOS</button>
      <button class="fb" onclick="fil('nuevos',this)">NUEVOS</button>
    </div>
    <div id="list"></div>
  </div>
</div>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script>
const cfg={apiKey:"AIzaSyDGTYI2ZZnP49DbaMIpRSoGIjZrU6RAEiE",authDomain:"historial-kigo-xpress.firebaseapp.com",databaseURL:"https://historial-kigo-xpress-default-rtdb.firebaseio.com",projectId:"historial-kigo-xpress",storageBucket:"historial-kigo-xpress.firebasestorage.app",messagingSenderId:"571399920545",appId:"1:571399920545:web:aa16407753b43cbe2e89e0"};
firebase.initializeApp(cfg);
const db=firebase.database();
let all=[], f='todos';
db.ref('kigo_historial').on('value',s=>{
  let v=s.val()||{};
  all=Object.entries(v).map(([k,o])=>({k,...o})).sort((a,b)=>b.timestamp-a.timestamp);
  draw();
});
function fil(t,el){ f=t; document.querySelectorAll('.fb').forEach(b=>b.classList.remove('active')); el.classList.add('active'); draw(); }
function draw(){
  let q=document.getElementById('q').value.toLowerCase();
  let L=all;
  if(f!=='todos') L=L.filter(x=>(x.repartidor||'').toLowerCase().includes(f.toLowerCase()) || (x.tipoServicio||'').toLowerCase().includes(f.toLowerCase()));
  if(q) L=L.filter(x=>(x.cliente||'').toLowerCase().includes(q) || (x.repartidor||'').toLowerCase().includes(q));
  document.getElementById('count').innerText=L.length+' pedidos';
  document.getElementById('t1').innerText=L.length;
  document.getElementById('t2').innerText='$'+L.reduce((s,x)=>s+(x.neto||0),0).toLocaleString('es-MX');
  document.getElementById('t3').innerText='$'+L.reduce((s,x)=>s+(x.descuento||0),0).toLocaleString('es-MX');
  document.getElementById('list').innerHTML=L.length? L.map(x=>`
    <div class="card">
      <div style="display:flex;justify-content:space-between"><b style="font-size:9px">${x.tipoServicio||''}</b><span class="price">$${x.valor||0}</span></div>
      <div class="line">👤 Cliente: ${x.cliente||''}</div>
      <div class="line">🛵 Repartidor: ${x.repartidor||''} • Tipo: ${x.tipoServicio||''}</div>
      <div class="line">📅 ${x.fecha||''} ${x.hora||''} • 📏 ${x.distancia||''}</div>
      <div style="display:flex;justify-content:space-between;margin-top:6px;background:#111;color:#fff;padding:6px 8px;border-radius:8px;font-size:8px;font-weight:900">
        <span>Desc: $${x.descuento||0}</span><span>Neto: $${x.neto||0}</span>
      </div>
    </div>
  `).join('') : '<div style="text-align:center;padding:20px;color:#999;font-size:10px">Sin historial</div>';
}
</script>
</body>
</html>
