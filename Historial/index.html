window.migrarBase=function(){
  let btn=document.getElementById('btnMigrar');
  if(todos.length>=500){ alert('Ya está migrado, no necesitas hacerlo de nuevo'); return; }
  btn.innerText='MIGRANDO... NO CIERRES';
  btn.disabled=true;
  let lines=DATA_REAL.split('\n').filter(l=>l.trim());
  let count=0;
  let updates={};
  lines.forEach((line,i)=>{
    let parts=line.split('\t'); if(parts.length<4) return;
    let fecha=parts[0].trim(), repa=parts[1].trim(), cliente=parts[2].trim(), valorRaw=parts[3].trim();
    let valor=0; if(!valorRaw.includes('Promoción')){ let dig=valorRaw.replace(/[^0-9]/g,''); if(dig) valor=parseInt(dig); }
    let mm_dd_yy=fecha.split('/'); let iso=`${mm_dd_yy[2]}-${mm_dd_yy[0].padStart(2,'0')}-${mm_dd_yy[1].padStart(2,'0')}`;
    let ts=new Date(iso+'T12:00:00').getTime();
    let key=db.ref('ventasKigo').push().key;
    updates['ventasKigo/'+key]={cliente,repa,repartidor:repa,valor,feeKigo:valor,tipoServicio: cliente.toLowerCase().includes('transporte')?'Moto Transporte':'Moto Mandado', tipo: cliente.toLowerCase().includes('transporte')?'Moto Transporte':'Moto Mandado', fecha, iso, ts, pagado:true};
    count++;
  });
  db.ref().update(updates).then(()=>{
    document.getElementById('migLog').innerText=`✅ MIGRACIÓN COMPLETA: ${count} pedidos subidos a Firebase. De ahora en adelante quedan guardados de por vida. Ya puedes cerrar o actualizar, no necesitas migrar más.`;
    btn.innerText=`✅ YA MIGRADO - ${count} PEDIDOS`;
    btn.classList.add('done');
    // Migrar clientes únicos a clientesKigo y kigo_clientes para ADMIN
    let clientesUnicos={};
    lines.forEach(l=>{ let c=l.split('\t')[2]?.trim(); if(c) clientesUnicos[c]=(clientesUnicos[c]||0)+1; });
    let cliUpdates={};
    Object.keys(clientesUnicos).forEach(nombre=>{
      let k=db.ref('clientesKigo').push().key;
      cliUpdates['clientesKigo/'+k]={nombre,tipo: clientesUnicos[nombre]>5?'Aliado':'Normal', telefono:''};
      let k2=db.ref('kigo_clientes').push().key;
      cliUpdates['kigo_clientes/'+k2]={nombre,direccion:nombre,telefono:'',lat:21.1561,lng:-100.9333, tipo: clientesUnicos[nombre]>5?'Aliado':'Normal'};
    });
    db.ref().update(cliUpdates);
  }).catch(e=>{ alert('Error: '+e.message); btn.disabled=false; btn.innerText='REINTENTAR MIGRACIÓN'; });
}
