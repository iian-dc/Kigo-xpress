<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KIGO - Historial</title>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<style>
*{box-sizing:border-box;font-family:Inter,Arial}
body{margin:0;background:#f6f7fb;color:#111}
.header{position:sticky;top:0;z-index:10;background:#111;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.btn{padding:8px 12px;border-radius:10px;border:none;font-weight:800;font-size:11px;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.btn-dark{background:#111;color:#fff} .btn-white{background:#fff;border:1px solid #ddd;color:#111} .btn-green{background:#16a34a;color:#fff} .btn-red{background:#fee2e2;color:#dc2626;border:1px solid #fecaca}
.btn-salir{background:#fff;color:#111;padding:6px 14px;border-radius:999px;font-weight:900;font-size:12px}
.subcats{display:flex;gap:6px;padding:12px 14px;overflow:auto}
.subcats button{padding:8px 14px;border-radius:999px;border:1px solid #e5e7eb;background:#fff;font-weight:800;font-size:11px;cursor:pointer;white-space:nowrap}
.subcats button.active{background:#111;color:#fff;border-color:#111}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:0 14px 12px}
@media(max-width:700px){.stats-grid{grid-template-columns:repeat(2,1fr)}}
.stat{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:12px}
.stat b{font-size:18px;display:block} .stat span{font-size:10px;color:#666;font-weight:800;text-transform:uppercase}
.filters{background:#fff;margin:0 14px;padding:12px;border-radius:14px;border:1px solid #e5e7eb;display:flex;flex-wrap:wrap;gap:8px}
.filters input,.filters select{padding:8px 10px;border-radius:10px;border:1px solid #ddd;font-size:12px;flex:1;min-width:120px}
.table-wrap{background:#fff;margin:14px;border-radius:14px;border:1px solid #e5e7eb;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:11px}
th{position:sticky;top:0;background:#f9fafb;padding:10px 8px;text-align:left;font-size:10px;text-transform:uppercase;border-bottom:1px solid #e5e7eb;white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid #f1f1f1;white-space:nowrap;max-width:200px;overflow:hidden;text-overflow:ellipsis}
.tipo-pill{padding:2px 7px;border-radius:999px;font-size:9px;font-weight:900}
.tipo-recoger{background:#dcfce7;color:#166534} .tipo-comprar{background:#fef9c3;color:#713f12}
</style>
</head>
<body>
<div class="header">
<div style="width:20px"></div>
<div><button class="btn btn-salir" onclick="salir()"><i class="material-icons" style="font-size:14px">logout</i> Salir</button></div>
</div>
<div class="subcats">
<button id="btnTodos" class="active" onclick="filtrarTiempo('todos',this)">Todos</button>
<button id="btnHoy" onclick="filtrarTiempo('hoy',this)">Hoy</button>
<button id="btnSemana" onclick="filtrarTiempo('semana',this)">Esta Semana</button>
<button id="btnMes" onclick="filtrarTiempo('mes',this)">Este Mes</button>
</div>
<div class="stats-grid">
<div class="stat"><span>Total Servicios</span><b id="statTotal">0</b></div>
<div class="stat"><span>Ingresos</span><b id="statIngresos" style="color:#16a34a">$0</b></div>
<div class="stat"><span>Finalizados</span><b id="statFinalizados">0</b></div>
<div class="stat"><span>Pendientes</span><b id="statPendientes">0</b></div>
</div>
<div class="filters">
<input id="busqueda" placeholder="🔍 Buscar aliado, dirección..." oninput="aplicarFiltros()">
<select id="filtroTipo" onchange="aplicarFiltros()"><option value="todos">Todos tipos</option><option value="recoger">Moto Mandado - Recoger</option><option value="comprar">Comprar</option><option value="nuevo">Nuevo</option></select>
<input type="month" id="filtroMes" onchange="aplicarFiltros()">
<button class="btn btn-green" onclick="exportarCSV()">Exportar</button>
</div>
<div class="table-wrap">
<table><thead><tr><th>#ID</th><th>Fecha</th><th>Tipo</th><th>Recoger</th><th>Entregar</th><th>Precio</th><th>Estado</th><th>Acciones</th></tr></thead>
<tbody id="tbodyHistorial"><tr><td colspan="8" style="text-align:center;padding:30px">Cargando todos los pedidos...</td></tr></tbody></table>
</div>
<div id="modalEditar" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99;align-items:center;justify-content:center;padding:14px"><div style="background:#fff;width:100%;max-width:400px;border-radius:16px;padding:16px">
<b>Editar Servicio</b>
<input id="editRecoger" placeholder="Recoger en" style="width:100%;padding:8px;margin-top:8px;border-radius:8px;border:1px solid #ddd">
<input id="editEntregar" placeholder="Entregar en" style="width:100%;padding:8px;margin-top:6px;border-radius:8px;border:1px solid #ddd">
<input id="editPrecio" placeholder="Precio" style="width:100%;padding:8px;margin-top:6px;border-radius:8px;border:1px solid #ddd">
<select id="editEstado" style="width:100%;padding:8px;margin-top:6px;border-radius:8px;border:1px solid #ddd"><option value="a_recoger">A Recoger</option><option value="recogido">Recogido</option><option value="a_entregar">A Entregar</option><option value="finalizado">Finalizado</option></select>
<div style="display:flex;gap:6px;margin-top:10px"><button class="btn btn-green" style="flex:1" onclick="guardarEdicion()">Guardar</button><button class="btn btn-white" style="flex:1" onclick="document.getElementById('modalEditar').style.display='none'">Cancelar</button></div>
</div></div>
<script>
const firebaseConfig={apiKey:"AIzaSyCTV1sm6McEIkv-cheaVFCD_svp_a--6wg",authDomain:"glide-prod.firebaseapp.com",databaseURL:"https://glide-prod-default-rtdb.firebaseio.com",projectId:"glide-prod",storageBucket:"glide-prod.appspot.com",messagingSenderId:"123456",appId:"1:123456:web:abc"};
firebase.initializeApp(firebaseConfig); const db=firebase.database();
let todosPedidos=[]; let filtrados=[]; let tiempoActual='todos'; let editandoKey=null;
function salir(){ if(confirm("¿Salir?")) window.close(); location.href="about:blank"; }
</script>
<script>
function esHoy(ts){if(!ts) return false; return new Date(ts).toDateString()===new Date().toDateString();}
function esEstaSemana(ts){if(!ts) return false; return (Date.now()-ts)<7*24*60*60*1000;}
function esEsteMes(ts){if(!ts) return false; const d=new Date(ts);const h=new Date();return d.getMonth()===h.getMonth()&&d.getFullYear()===h.getFullYear();}
function esDelMesSeleccionado(ts, mesValor){ if(!mesValor) return true; if(!ts) return false; const d=new Date(ts); const [y,m]=mesValor.split('-'); return d.getFullYear()==parseInt(y) && (d.getMonth()+1)==parseInt(m); }
console.log("🔍 Conectando a Firebase kigo_pedidos...");
db.ref('kigo_pedidos').on('value', snap=>{
 const val=snap.val();
 console.log("📦 Datos recibidos:", val);
 todosPedidos=[];
 if(!val){
   document.getElementById('tbodyHistorial').innerHTML=`<tr><td colspan="8" style="text-align:center;padding:30px;color:red">No hay datos en kigo_pedidos</td></tr>`;
   return;
 }
 Object.keys(val).forEach(k=>{
   const p=val[k];
   todosPedidos.push({fbKey:k, timestamp: p.timestamp || p.confirmadoEn || p.historial?.creado || Date.now(),...p});
 });
 console.log("✅ Total cargados:", todosPedidos.length);
 todosPedidos.sort((a,b)=>(b.timestamp||0)-(a.timestamp||0));
 aplicarFiltros();
}, error=>{
 console.error("❌ Error:", error);
 document.getElementById('tbodyHistorial').innerHTML=`<tr><td colspan="8" style="text-align:center;padding:20px;color:red">Error Firebase: ${error.message}</td></tr>`;
});
function actualizarStats(lista){
 document.getElementById('statTotal').innerText=lista.length;
 let ingresos=0, fin=0, pend=0;
 lista.forEach(p=>{
  const precio=parseInt(String(p.precio||'').replace(/[^0-9]/g,''))||0; ingresos+=precio;
  if(p.estado==='finalizado') fin++; else pend++;
 });
 document.getElementById('statIngresos').innerText="$"+ingresos.toLocaleString()+" MXN";
 document.getElementById('statFinalizados').innerText=fin;
 document.getElementById('statPendientes').innerText=pend;
}
function renderTabla(lista){
 const tbody=document.getElementById('tbodyHistorial');
 if(!lista.length){
   if(todosPedidos.length>0){
     tbody.innerHTML=`<tr><td colspan="8" style="text-align:center;padding:20px">Hay ${todosPedidos.length} pedidos pero ninguno coincide con el filtro<br><button onclick="document.getElementById('busqueda').value='';document.getElementById('filtroMes').value='';filtrarTiempo('todos',document.getElementById('btnTodos'))" style="margin-top:8px;padding:6px 12px;border-radius:8px;border:1px solid #ddd">Ver Todos</button></td></tr>`;
   } else {
     tbody.innerHTML=`<tr><td colspan="8" style="text-align:center;padding:30px;color:#888">No hay servicios aún</td></tr>`;
   }
   return;
 }
 tbody.innerHTML="";
 lista.forEach(p=>{
  const idCorto=p.fbKey.substring(p.fbKey.length-6).toUpperCase();
  const fecha=p.fecha || (p.timestamp? new Date(p.timestamp).toLocaleString() : 'Sin fecha');
  const tipoTxt=p.tipo||'Recoger';
  let tipoClass='tipo-recoger'; if(tipoTxt.toLowerCase().includes('comprar')) tipoClass='tipo-comprar';
  const estadoColor = p.estado==='finalizado'? 'background:#111;color:#fff' : 'background:#fef08a;color:#713f12';
  const tr=document.createElement('tr');
  tr.innerHTML=`
   <td><b>#${idCorto}</b></td>
   <td>${fecha}</td>
   <td><span class="tipo-pill ${tipoClass}">${tipoTxt}</span></td>
   <td title="${p.recogerEn||''}">${(p.recogerEn||'').substring(0,28)}</td>
   <td title="${p.entregarEn||''}">${(p.entregarEn||'').substring(0,28)}</td>
   <td><b style="color:#16a34a">${p.precio||''}</b></td>
   <td><span style="padding:2px 7px;border-radius:999px;font-size:9px;font-weight:900;${estadoColor}">${p.estado||'a_recoger'}</span></td>
   <td style="display:flex;gap:4px">
     <button class="btn btn-white" onclick="editarPedido('${p.fbKey}')" style="padding:5px 8px"><i class="material-icons" style="font-size:14px">edit</i></button>
     <button class="btn btn-red" onclick="borrarPedido('${p.fbKey}')" style="padding:5px 8px"><i class="material-icons" style="font-size:14px">delete</i></button>
   </td>
  `;
  tbody.appendChild(tr);
 });
}
function filtrarTiempo(tipo,btn){
 tiempoActual=tipo;
 document.querySelectorAll('.subcats button').forEach(b=>b.classList.remove('active'));
 if(btn) btn.classList.add('active');
 aplicarFiltros();
}
function aplicarFiltros(){
 const txt=(document.getElementById('busqueda').value||'').toLowerCase();
 const tipoF=document.getElementById('filtroTipo').value;
 const mesF=document.getElementById('filtroMes').value;
 filtrados=todosPedidos.filter(p=>{
  const ts=p.timestamp || p.historial?.finalizado || Date.now();
  if(tiempoActual==='hoy' &&!esHoy(ts)) return false;
  if(tiempoActual==='semana' &&!esEstaSemana(ts)) return false;
  if(tiempoActual==='mes' &&!esEsteMes(ts)) return false;
  if(mesF &&!esDelMesSeleccionado(ts, mesF)) return false;
  if(txt){
    const okTxt=(p.recogerEn||'').toLowerCase().includes(txt)||(p.entregarEn||'').toLowerCase().includes(txt)||(p.tipo||'').toLowerCase().includes(txt)||(p.telefono||'').toLowerCase().includes(txt);
    if(!okTxt) return false;
  }
  const t=(p.tipo||'').toLowerCase();
  if(tipoF==='recoger'&&!t.includes('recoger')&&!t.includes('aliado')&&!t.includes('mandado')) return false;
  if(tipoF==='comprar'&&!t.includes('comprar')) return false;
  if(tipoF==='nuevo'&&!t.includes('nuevo')) return false;
  return true;
 });
 renderTabla(filtrados); actualizarStats(filtrados);
}
 </script>
 <script>
function editarPedido(fbKey){
 const p=todosPedidos.find(x=>x.fbKey===fbKey); if(!p) return;
 editandoKey=fbKey;
 document.getElementById('editRecoger').value=p.recogerEn||'';
 document.getElementById('editEntregar').value=p.entregarEn||'';
 document.getElementById('editPrecio').value=p.precio||'';
 document.getElementById('editEstado').value=p.estado||'a_recoger';
 document.getElementById('modalEditar').style.display='flex';
}
function guardarEdicion(){
 if(!editandoKey) return;
 const updates={
   recogerEn: document.getElementById('editRecoger').value,
   entregarEn: document.getElementById('editEntregar').value,
   precio: document.getElementById('editPrecio').value,
   estado: document.getElementById('editEstado').value
 };
 updates[`historial/${updates.estado}`]=Date.now();
 db.ref('kigo_pedidos/'+editandoKey).update(updates).then(()=>{
   alert("Actualizado ✅");
   document.getElementById('modalEditar').style.display='none';
   editandoKey=null;
 });
}
function borrarPedido(fbKey){
 if(!confirm("¿Borrar este servicio? 🗑️")) return;
 db.ref('kigo_pedidos/'+fbKey).remove().then(()=>{alert("Borrado ✅");});
}
function exportarCSV(){
 const lista=filtrados.length? filtrados : todosPedidos;
 if(!lista.length){alert("No hay datos");return;}
 let csv="ID,Fecha,Tipo,Recoger,Entregar,Precio,Estado,Telefono,Resumen\n";
 lista.forEach(p=>{
  const f=p.fecha||new Date(p.timestamp||Date.now()).toLocaleString();
  csv+=`${p.fbKey},"${f}","${(p.tipo||'').replace(/"/g,'""')}","${(p.recogerEn||'').replace(/"/g,'""')}","${(p.entregarEn||'').replace(/"/g,'""')}","${p.precio||''}","${p.estado||''}","${p.telefono||''}","${(p.resumen||'').replace(/"/g,'""')}"\n`;
 });
 const blob=new Blob([csv],{type:'text/csv'}); const url=URL.createObjectURL(blob);
 const a=document.createElement('a'); a.href=url; a.download=`historial-kigo-${new Date().toISOString().slice(0,10)}.csv`; a.click();
}
document.getElementById('modalEditar').addEventListener('click',e=>{if(e.target.id==='modalEditar')e.target.style.display='none';});
</script>
</body>
</html>
