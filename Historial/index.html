<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KIGO Historial</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
:root{--black:#111;--gray:#F5F5F5;--green:#00C851}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',system-ui}
body{background:#F2F2F2}
.app{max-width:460px;margin:0 auto;background:#fff;min-height:100vh;position:relative;padding-bottom:20px}
.top{padding:12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee;position:sticky;top:0;background:#fff;z-index:10}
.top b{font-size:13px;font-weight:900}
.chip{font-size:8px;background:#111;color:#fff;padding:5px 10px;border-radius:999px;font-weight:800}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding:10px}
.stat{border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:14px}
.stat span{font-size:7px;font-weight:800;opacity:.8}
.stat.black{background:#111;color:#fff}
.stat.green{background:#f0fdf4;border:1.5px solid #86efac}
.stat.red{background:#fef2f2;border:1.5px solid #fecaca}
.panel{padding:10px}
.input{width:100%;padding:10px;border-radius:10px;border:1.5px solid #eee;font-size:10px;font-weight:600;outline:none;background:#fff}
.filtros{display:flex;gap:6px;margin-top:8px}
.fbtn{flex:1;padding:8px;border-radius:10px;border:1.5px solid #eee;background:#fff;font-size:7px;font-weight:900;cursor:pointer}
.fbtn.active{background:#111;color:#fff;border-color:#111}
.lista{margin-top:10px}
.card-h{background:#fff;border:1.5px solid #eee;border-radius:12px;padding:10px;margin-bottom:8px}
.row{display:flex;justify-content:space-between;align-items:center}
.badge{font-size:6px;padding:3px 7px;border-radius:999px;font-weight:900;background:#111;color:#fff}
.price{font-size:12px;font-weight:900;color:#00C851}
.small{font-size:8px;color:#666;margin-top:3px;line-height:1.3}
.neto{font-size:9px;font-weight:800;margin-top:4px}
</style>
</head>
<body>
<div class="app">
  <div class="top"><b>📚 HISTORIAL KIGO</b><div class="chip" id="count">0 pedidos</div></div>
  <div class="stats">
    <div class="stat black"><b id="tTotal">0</b><span>TOTAL PEDIDOS</span></div>
    <div class="stat green"><b id="tGanado" style="color:#10b981">$0</b><span>GANANCIA NETA</span></div>
    <div class="stat red"><b id="tDesc" style="color:#ef4444">$0</b><span>COMISIÓN KIGO</span></div>
  </div>
  <div class="panel">
    <input id="busc" class="input" placeholder="Buscar cliente, repartidor, tipo..." oninput="render()">
    <div class="filtros">
      <button class="fbtn active" onclick="setF('todos',this)">TODOS</button>
      <button class="fbtn" onclick="setF('Jose',this)">JOSE</button>
      <button class="fbtn" onclick="setF('aliados',this)">ALIADOS</button>
      <button class="fbtn" onclick="setF('nuevos',this)">NUEVOS</button>
    </div>
    <div id="lista" class="lista"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script>
const firebaseConfig = {apiKey: "AIzaSyDGTYI2ZZnP49DbaMIpRSoGIjZrU6RAEiE", authDomain: "historial-kigo-xpress.firebaseapp.com", databaseURL: "https://historial-kigo-xpress-default-rtdb.firebaseio.com", projectId: "historial-kigo-xpress", storageBucket: "historial-kigo-xpress.firebasestorage.app", messagingSenderId: "571399920545", appId: "1:571399920545:web:aa16407753b43cbe2e89e0"};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();
let all=[], filtro='todos';

db.ref('kigo_historial').on('value', s=>{
  let v=s.val()||{};
  all=Object.entries(v).map(([k, val])=>({key:k,...val})).sort((a,b)=> (b.timestamp||0)-(a.timestamp||0));
  render();
});

function setF(f, el){
  filtro=f;
  document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  render();
}

function render(){
  let q=document.getElementById('busc').value.toLowerCase();
  let lista=all;
  if(filtro!=='todos'){
    lista=lista.filter(x=> (x.repartidor||'').toLowerCase().includes(filtro.toLowerCase()) || (x.tipoServicio||'').toLowerCase().includes(filtro.toLowerCase()));
  }
  if(q){
    lista=lista.filter(x=> (x.cliente||'').toLowerCase().includes(q) || (x.repartidor||'').toLowerCase().includes(q) || (x.tipoServicio||'').toLowerCase().includes(q));
  }
  document.getElementById('count').innerText=lista.length+' pedidos';
  document.getElementById('tTotal').innerText=lista.length;
  let totalValor=lista.reduce((s,x)=>s+(x.valor||0),0);
  let totalDesc=lista.reduce((s,x)=>s+(x.descuento||0),0);
  let totalNeto=lista.reduce((s,x)=>s+(x.neto||0),0);
  document.getElementById('tGanado').innerText='$'+totalNeto.toLocaleString('es-MX');
  document.getElementById('tDesc').innerText='$'+totalDesc.toLocaleString('es-MX');

  let cont=document.getElementById('lista');
  if(!lista.length){ cont.innerHTML='<div style="text-align:center;padding:20px;color:#999;font-size:10px">Sin historial</div>'; return; }
  cont.innerHTML=lista.map(h=>`
    <div class="card-h">
      <div class="row">
        <div style="display:flex;gap:5px;align-items:center"><span class="badge">${(h.tipoServicio||'').toUpperCase()}</span><span style="font-size:7px;color:#888">${h.fecha||''} ${h.hora||''}</span></div>
        <span class="price">$${h.valor||0} MXN</span>
      </div>
      <div class="small">👤 <b>Cliente:</b> ${h.cliente||''}</div>
      <div class="small">🛵 <b>Repartidor:</b> ${h.repartidor||''} • <b>Tipo:</b> ${h.tipoServicio||''} • 📏 ${h.distancia||''}</div>
      <div class="row" style="margin-top:6px;background:#F7F7F7;padding:6px 8px;border-radius:8px">
        <span style="font-size:8px;font-weight:800;color:#ef4444">Descuento KIGO 20%: -$${h.descuento||0}</span>
        <span style="font-size:9px;font-weight:900">Neto: $${h.neto||0}</span>
      </div>
    </div>
  `).join('');
}
</script>
</body>
</html>
