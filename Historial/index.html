<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KIGO Historial Real - ventasKigo</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box;font-family:Inter,Arial}body{margin:0;background:#f6f7fb}
.header{background:#111;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.subcats{display:flex;gap:8px;padding:12px;background:#fff;border-bottom:1px solid #e5e7eb;overflow:auto}
.subcats button{padding:9px 18px;border-radius:999px;border:1.5px solid #ddd;background:#fff;font-weight:800;font-size:11px;cursor:pointer;white-space:nowrap}
.subcats button.active{background:#111;color:#fff}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:12px}
.stat{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:12px}
.stat b{display:block;font-size:18px}
.stat span{font-size:10px;color:#666;font-weight:800}
.filters{background:#fff;margin:0 12px;padding:10px;border-radius:12px;border:1px solid #e5e7eb;display:flex;gap:8px}
.filters input{flex:1;padding:8px;border-radius:8px;border:1px solid #ddd}
.table-wrap{background:#fff;margin:12px;border-radius:12px;border:1px solid #e5e7eb;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:11px}
th{background:#f9fafb;padding:10px 8px;text-align:left;font-size:10px;border-bottom:1px solid #e5e7eb;white-space:nowrap}
td{padding:10px 8px;border-bottom:1px solid #f1f1f1;white-space:nowrap}
.pill{padding:3px 8px;border-radius:999px;font-size:9px;font-weight:900}
.si{background:#dcfce7;color:#166534}.no{background:#fee2e2;color:#991b1b}
.btn{padding:5px 10px;border-radius:8px;border:1px solid #ddd;background:#fff;font-weight:800;font-size:10px;cursor:pointer}
</style>
</head>
<body>
<div class="header"><b>HISTORIAL REAL ventasKigo - <span id="total">0</span> PEDIDOS</b><span id="info" style="font-size:9px;background:#10b981;padding:4px 10px;border-radius:999px">BASE REAL</span></div>

<div class="subcats">
<button class="active" onclick="filtrar('todos',this)">Todos</button>
<button onclick="filtrar('hoy',this)">Hoy</button>
<button onclick="filtrar('ayer',this)">Ayer</button>
<button onclick="filtrar('semana',this)">Esta Semana</button>
<button onclick="filtrar('mes',this)">Este Mes</button>
</div>

<div class="stats">
<div class="stat"><span>TOTAL</span><b id="sTotal">0</b></div>
<div class="stat"><span>INGRESOS</span><b id="sIngresos" style="color:#16a34a">$0</b></div>
<div class="stat"><span>PAGADOS</span><b id="sPagados">0</b></div>
<div class="stat"><span>NO PAGADOS</span><b id="sNoPag">0</b></div>
</div>

<div class="filters">
<input id="busq" placeholder="Buscar cliente, repartidor, tipo..." oninput="aplicar()">
<button class="btn" style="background:#16a34a;color:#fff;border:none" onclick="exportar()">Exportar CSV</button>
</div>

<div class="table-wrap">
<table>
<thead><tr>
<th>#ID</th><th>Fecha Origen</th><th>Cliente</th><th>Tipo Servicio</th><th>Repartidor</th><th>Valor Total</th><th>Estado Pago</th><th>Acciones</th>
</tr></thead>
<tbody id="tbody"><tr><td colspan="8" style="text-align:center;padding:30px">Cargando base REAL de ventasKigo...</td></tr></tbody>
</table>
</div>

<script>
const firebaseConfig = { apiKey: "AIzaSyDGTYI2ZZnP49DbaMIpRSoGIjZrU6RAEiE", authDomain: "historial-kigo-xpress.firebaseapp.com", databaseURL: "https://historial-kigo-xpress-default-rtdb.firebaseio.com", projectId: "historial-kigo-xpress", storageBucket: "historial-kigo-xpress.firebasestorage.app", messagingSenderId: "571399920545", appId: "1:571399920545:web:aa16407753b43cbe2e89e0" };
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
let todos=[]; let filtrados=[]; let tipoActual='todos';

// FECHA REAL DE ventasKigo
function getTS(p){
  if(p.timestamp){ let t=Number(p.timestamp); return t<1e12? t*1000 : t; }
  if(p.fecha){
    // ventasKigo guarda MM/DD/YYYY
    if(typeof p.fecha==='string' && p.fecha.includes('/')){
      const a=p.fecha.split(' ')[0].split('/');
      if(a.length===3){
        let m=parseInt(a[0]), d=parseInt(a[1]), y=parseInt(a[2]);
        if(m>12){ d=parseInt(a[0]); m=parseInt(a[1]); } // por si es DD/MM
        if(y<100) y+=2000;
        const f=new Date(y,m-1,d,12,0,0);
        if(!isNaN(f.getTime())) return f.getTime();
      }
    }
    const d=new Date(p.fecha); if(!isNaN(d.getTime())) return d.getTime();
  }
  return 0;
}
function fSolo(ts){ const d=new Date(ts); return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`; }
function esHoy(ts){ return new Date(ts).toDateString()===new Date().toDateString(); }
function esAyer(ts){ const a=new Date(); a.setDate(a.getDate()-1); return new Date(ts).toDateString()===a.toDateString(); }
function esSem(ts){ const hoy=new Date(); const ini=new Date(hoy); ini.setDate(hoy.getDate()-hoy.getDay()); ini.setHours(0,0,0,0); return ts>=ini.getTime(); }
function esMes(ts){ const d=new Date(ts), h=new Date(); return d.getMonth()===h.getMonth()&&d.getFullYear()===h.getFullYear(); }

// LEER ventasKigo - BASE REAL
db.ref('ventasKigo').on('value', snap=>{
  const val=snap.val()||{};
  let lista=[]; let seen=new Set();
  Object.keys(val).forEach(k=>{
    const p=val[k]; if(typeof p!=='object') return;
    const ts=getTS(p);
    const cliente=(p.clienteNombre||p.cliente||p.aliado||'Cliente').toString().trim();
    const repa=(p.repartidorNombre||p.repartidor||p.repa||'Jose').toString().trim();
    const precio=parseInt(String(p.precio||p.total||'0').replace(/[^0-9]/g,''))||0;
    // clave anti-duplicado
    const clave=`${ts}_${cliente}_${precio}`.toLowerCase();
    if(seen.has(clave)) return;
    seen.add(clave);
    lista.push({
      key:k, timestamp:ts,
      clienteNombre:cliente,
      tipoServicio:p.tipoServicio||p.tipo|| (String(p.razon||'').toLowerCase().includes('transporte')?'Moto Transporte':'Moto Mandado'),
      repartidorNombre:repa,
      precio:`$${precio}`, total:precio,
      pagadoRepa:p.pagadoRepa===true
    });
  });
  lista.sort((a,b)=>a.timestamp-b.timestamp);
  lista.forEach((p,i)=>p.numero=i+1);
  todos=lista.slice().reverse(); // más nuevo arriba
  document.getElementById('total').innerText=todos.length;
  document.getElementById('info').innerText=`ventasKigo REAL - ${todos.length} pedidos únicos`;
  aplicar();
});

function filtrar(t,btn){
  tipoActual=t;
  document.querySelectorAll('.subcats button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  aplicar();
}
function aplicar(){
  const txt=(document.getElementById('busq').value||'').toLowerCase();
  filtrados=todos.filter(p=>{
    if(tipoActual==='hoy' &&!esHoy(p.timestamp)) return false;
    if(tipoActual==='ayer' &&!esAyer(p.timestamp)) return false;
    if(tipoActual==='semana' &&!esSem(p.timestamp)) return false;
    if(tipoActual==='mes' &&!esMes(p.timestamp)) return false;
    if(txt &&!p.clienteNombre.toLowerCase().includes(txt) &&!p.repartidorNombre.toLowerCase().includes(txt) &&!p.tipoServicio.toLowerCase().includes(txt)) return false;
    return true;
  });
  render(filtrados);
  // stats
  let ing=0, pag=0, nop=0;
  filtrados.forEach(p=>{ ing+=p.total; if(p.pagadoRepa) pag++; else nop++; });
  document.getElementById('sTotal').innerText=filtrados.length;
  document.getElementById('sIngresos').innerText='$'+ing.toLocaleString();
  document.getElementById('sPagados').innerText=pag;
  document.getElementById('sNoPag').innerText=nop;
}
function render(lista){
  const tb=document.getElementById('tbody');
  if(!lista.length){ tb.innerHTML=`<tr><td colspan="8" style="text-align:center;padding:20px">Sin pedidos en ${tipoActual}</td></tr>`; return; }
  tb.innerHTML='';
  lista.forEach(p=>{
    const tr=document.createElement('tr');
    tr.innerHTML=`
      <td><b style="background:#111;color:#fff;padding:4px 8px;border-radius:6px">#${p.numero}</b></td>
      <td><b>${fSolo(p.timestamp)}</b></td>
      <td><b>${p.clienteNombre.substring(0,25)}</b></td>
      <td><span class="pill" style="background:#dbeafe;color:#1e40af">${p.tipoServicio}</span></td>
      <td><span style="background:#f3f4f6;padding:3px 8px;border-radius:999px;font-weight:800">${p.repartidorNombre}</span></td>
      <td><b style="color:#16a34a">$${p.total}</b></td>
      <td><span class="pill ${p.pagadoRepa?'si':'no'}">${p.pagadoRepa?'✅ PAGADO':'❌ NO'}</span></td>
      <td><button class="btn" onclick="toggle('${p.key}')">${p.pagadoRepa?'✓':'$'}</button> <button class="btn" style="color:red" onclick="borrar('${p.key}')">🗑️</button></td>
    `;
    tb.appendChild(tr);
  });
}
window.toggle=function(k){
  const p=todos.find(x=>x.key===k); if(!p) return;
  db.ref('ventasKigo/'+k).update({pagadoRepa:!p.pagadoRepa});
}
window.borrar=function(k){ if(confirm('¿Borrar pedido?')) db.ref('ventasKigo/'+k).remove(); }
window.exportar=function(){
  let csv="#ID,Fecha,Cliente,Tipo,Repartidor,Valor,Pago\n";
  filtrados.forEach(p=>{ csv+=`${p.numero},"${fSolo(p.timestamp)}","${p.clienteNombre}","${p.tipoServicio}","${p.repartidorNombre}","${p.total}","${p.pagadoRepa?'PAGADO':'NO'}"\n`; });
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download=`historial-real-ventasKigo-${tipoActual}.csv`; a.click();
}
</script>
</body>
</html>
