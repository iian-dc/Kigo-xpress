<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel de administración</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#fff;min-height:100vh;padding:22px 16px 30px}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:18px}
.titulo{font-size:26px;font-weight:900;color:#111;letter-spacing:-0.3px;line-height:1.1}
.subtitulo{font-size:14px;font-weight:500;color:#8a8d93;margin-top:6px}
.btn-x{width:44px;height:44px;border-radius:50%;background:#e9ecef;border:0;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.search-wrap{position:relative;margin-bottom:14px}
.search-wrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%)}
.input-buscar{width:100%;height:44px;border-radius:12px;border:1.5px solid #e5e7eb;background:#f8f9fa;padding:0 14px 0 42px;font-size:14px;font-weight:600;outline:0;color:#111}
.input-buscar:focus{border-color:#111;background:#fff}
.input-buscar::placeholder{color:#9aa0a8;font-weight:500}
.lista{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:14px;padding:18px 4px;border-bottom:1.5px solid #eef0f3;cursor:pointer;background:#fff}
.item:last-child{border-bottom:0}
.item:active{background:#f9fafb}
.icon-box{width:38px;height:38px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.icon-box svg{width:36px;height:36px}
.label{flex:1;font-size:15px;font-weight:800;color:#111;letter-spacing:-0.2px}
.arrow{width:22px;height:22px;display:flex;align-items:center;justify-content:center}
.hide{display:none!important}
</style>
</head>
<body>

<div class="top">
<div>
<div class="titulo">Panel de administración</div>
<div class="subtitulo">Configuración de la empresa</div>
</div>
<button class="btn-x" onclick="location.href='index.html'" type="button">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
</button>
</div>

<div class="search-wrap">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8a8d93" stroke-width="2"><circle cx="11" cy="11" r="6"></circle><path d="M21 21l-4.2-4.2"></path></svg>
<input type="text" id="inputBuscar" class="input-buscar" placeholder="Buscar configuración...">
</div>

<div class="lista" id="lista">

<div class="item" data-name="historial de pedidos" onclick="location.href='historial.html'">
<div class="icon-box"><svg viewBox="0 0 36 36" fill="none"><rect x="6" y="4" width="20" height="26" rx="3" stroke="#111" stroke-width="2.2"/><path d="M10 3V8" stroke="#111" stroke-width="2.2" stroke-linecap="round"/><path d="M18 3V8" stroke="#111" stroke-width="2.2" stroke-linecap="round"/><rect x="10" y="12" width="12" height="3" rx="1" fill="#FFC200"/><rect x="10" y="17" width="12" height="2" rx="1" fill="#FFC200"/><rect x="10" y="21" width="8" height="2" rx="1" fill="#111"/><circle cx="24" cy="24" r="7" fill="white" stroke="#111" stroke-width="2"/><path d="M24 21v3l2 2" stroke="#111" stroke-width="1.8" stroke-linecap="round"/></svg></div>
<div class="label">Historial de pedidos</div><div class="arrow"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.4"><path d="M9 6l6 6-6 6"/></svg></div>
</div>

<div class="item" data-name="tarifas y zonas precios mapa" onclick="location.href='tarifasyzonas.html'">
<div class="icon-box"><svg viewBox="0 0 36 36" fill="none"><path d="M6 8l7-2 7 2 8-2v20l-8 2-7-2-7 2V8z" stroke="#111" stroke-width="2" stroke-linejoin="round"/><circle cx="21" cy="11" r="5" fill="#FFC200" stroke="#111" stroke-width="2"/><circle cx="21" cy="11" r="1.5" fill="#111"/></svg></div>
<div class="label">Tarifas y zonas</div><div class="arrow"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.4"><path d="M9 6l6 6-6 6"/></svg></div>
</div>

<div class="item" data-name="configuracion general ajustes" onclick="location.href='configuraciongeneral.html'">
<div class="icon-box"><svg viewBox="0 0 36 36" fill="none"><path d="M18 22.5a4.5 4.5 0 100-9 4.5 4.5 0 000 9z" fill="#FFC200" stroke="#111" stroke-width="2"/><path d="M18 5v3M18 28v3M28 18h3M5 18h3M24.5 8.5l2-2M9.5 27.5l-2 2M27.5 26.5l2 2M6.5 9.5l-2-2M26 11l2-1M8 26l-2 1M26 25l2 1M8 10l-2-1" stroke="#111" stroke-width="2" stroke-linecap="round"/></svg></div>
<div class="label">Configuración general</div><div class="arrow"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.4"><path d="M9 6l6 6-6 6"/></svg></div>
</div>

<div class="item" data-name="transportadores repartidores moto" onclick="location.href='transportadores.html'">
<div class="icon-box"><svg viewBox="0 0 36 36" fill="none"><circle cx="8" cy="24" r="4" stroke="#111" stroke-width="2"/><circle cx="26" cy="24" r="4" stroke="#111" stroke-width="2"/><path d="M12 24l4-8h8l4 8M16 16l-2-4h6" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 18c2-3 4-4 8-4" stroke="#111" stroke-width="1.6" stroke-linecap="round"/></svg></div>
<div class="label">Transportadores</div><div class="arrow"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.4"><path d="M9 6l6 6-6 6"/></svg></div>
</div>

<div class="item" data-name="clientes usuarios" onclick="location.href='clientes.html'">
<div class="icon-box"><svg viewBox="0 0 36 36" fill="none"><circle cx="10" cy="12" r="3" stroke="#111" stroke-width="2"/><circle cx="26" cy="12" r="3" stroke="#111" stroke-width="2"/><circle cx="18" cy="11" r="3" stroke="#111" stroke-width="2"/><path d="M6 24c0-3 3-5 6-5s6 2 6 5v2H6v-2z" fill="#FFC200" stroke="#111" stroke-width="2"/><path d="M20 22c0-2 2-4 5-4s5 2 5 4v2h-10v-2z" stroke="#111" stroke-width="2"/></svg></div>
<div class="label">Clientes</div><div class="arrow"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.4"><path d="M9 6l6 6-6 6"/></svg></div>
</div>

<div class="item" data-name="pagos y finanzas dinero" onclick="location.href='pagosyfinanzas.html'">
<div class="icon-box"><svg viewBox="0 0 36 36" fill="none"><path d="M5 10h26c1 0 2 1 2 2v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V12c0-1 2 2-2z" stroke="#111" stroke-width="2"/><path d="M5 10c5-3 12-5 18-5 1 0 2 1 2 2v4" fill="#FFC200" stroke="#111" stroke-width="2"/><rect x="22" y="18" width="8" height="6" rx="1.5" fill="white" stroke="#111" stroke-width="2"/><circle cx="26" cy="21" r="1" fill="#111"/></svg></div>
<div class="label">Pagos y finanzas</div><div class="arrow"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.4"><path d="M9 6l6 6-6 6"/></svg></div>
</div>

<div class="item" data-name="promociones descuento cupon" onclick="location.href='promociones.html'">
<div class="icon-box"><svg viewBox="0 0 36 36" fill="none"><path d="M20 6L8 14l-2 6 6 6 6-2 12-12-10-6z" stroke="#111" stroke-width="2" stroke-linejoin="round"/><path d="M22 10l-10 14" stroke="#FFC200" stroke-width="2.5" stroke-linecap="round"/><circle cx="14" cy="15" r="1.5" fill="#FFC200"/><circle cx="22" cy="19" r="1.5" fill="#FFC200"/></svg></div>
<div class="label">Promociones</div><div class="arrow"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.4"><path d="M9 6l6 6-6 6"/></svg></div>
</div>

<div class="item" data-name="estadisticas reporte graficas" onclick="location.href='estadisticas.html'">
<div class="icon-box"><svg viewBox="0 0 36 36" fill="none"><rect x="6" y="24" width="5" height="6" rx="1" stroke="#111" stroke-width="2"/><rect x="14" y="20" width="5" height="10" rx="1" stroke="#111" stroke-width="2"/><rect x="22" y="14" width="5" height="16" rx="1" stroke="#111" stroke-width="2"/><path d="M6 18l8-6 6 4 10-12" stroke="#FFC200" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M22 4h8v8" stroke="#FFC200" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
<div class="label">Estadísticas</div><div class="arrow"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.4"><path d="M9 6l6 6-6 6"/></svg></div>
</div>

</div>

<script>
document.getElementById('inputBuscar').addEventListener('input', function(){
  const q = this.value.toLowerCase().trim();
  document.querySelectorAll('.item').forEach(it=>{
    const name = it.getAttribute('data-name');
    if(name.includes(q)) it.classList.remove('hide');
    else it.classList.add('hide');
  });
});
</script>
</body>
</html>
