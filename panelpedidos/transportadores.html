<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transportadores</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#f5f6f7;min-height:100vh}
.header{background:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #eef0f3;position:sticky;top:0;z-index:10}
.btn-x{width:36px;height:36px;border-radius:50%;background:#e9ecef;border:0;display:flex;align-items:center;justify-content:center;cursor:pointer}
.titulo{font-size:17px;font-weight:900}
.tabs{background:#fff;padding:8px 10px;display:flex;gap:6px;border-bottom:1px solid #eef0f3;overflow:auto}
.btn-tab{white-space:nowrap;height:32px;padding:0 14px;border-radius:16px;border:1px solid #e5e7eb;background:#f8f9fa;font-size:11px;font-weight:800;cursor:pointer;color:#111}
.btn-tab.active{background:#111;color:#fff;border-color:#111}
.wrap{padding:10px}
.card{background:#fff;border-radius:14px;padding:12px;margin-bottom:10px;border:1px solid #eef0f3}
.card h3{font-size:13px;font-weight:900;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.table-wrap{background:#fff;border-radius:14px;overflow:auto;border:1px solid #eef0f3}
table{width:100%;border-collapse:collapse;min-width:780px}
thead th{background:#111;color:#fff;font-size:9px;font-weight:800;padding:10px 8px;text-align:left;text-transform:uppercase}
tbody td{padding:10px 8px;font-size:11px;font-weight:600;border-bottom:1px solid #f0f2f4;vertical-align:middle}
.inp-fee{width:80px;height:30px;border-radius:8px;border:1px solid #e5e7eb;background:#f8f9fa;padding:0 8px;font-size:11px;font-weight:700;outline:0;text-align:center}
.badge{font-size:8px;font-weight:800;padding:3px 7px;border-radius:10px;display:inline-block}
.badge-mandado{background:#e3f2fd;color:#1565c0}
.badge-transporte{background:#fff3e0;color:#e65100}
.accion-cell{display:flex;gap:6px;align-items:center}
.btn-save{height:28px;padding:0 10px;border-radius:8px;background:#00c853;color:#fff;border:0;font-weight:800;font-size:10px;cursor:pointer}
.btn-del{width:28px;height:28px;border-radius:8px;background:#ffeaea;border:1px solid #ffc9c9;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.rank-list{display:flex;flex-direction:column;gap:6px}
.rank-item{display:flex;align-items:center;gap:10px;padding:8px 10px;background:#f8f9fa;border-radius:10px;border:1px solid #eef0f3}
.rank-pos{width:28px;height:28px;border-radius:50%;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:11px}
.rank-pos.top1{background:#f59e0b}
.rank-pos.top2{background:#6b7280}
.rank-pos.top3{background:#d97706}
.rank-name{flex:1;font-weight:800;font-size:11px}
.rank-count{font-weight:900;font-size:11px;color:#111;background:#fff;border:1px solid #e5e7eb;padding:3px 8px;border-radius:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.full{grid-column:1/-1}
.label{font-size:9px;font-weight:800;color:#6b7280;text-transform:uppercase;margin-bottom:3px}
.input{width:100%;height:36px;border-radius:8px;border:1px solid #e5e7eb;background:#f8f9fa;padding:0 10px;font-size:11px;font-weight:600;outline:0}
.actions{display:flex;gap:8px;margin-top:12px}
.btn-cancel{flex:1;height:38px;border-radius:10px;border:1px solid #e5e7eb;background:#fff;font-weight:800;cursor:pointer}
.btn-confirm{flex:1;height:38px;border-radius:10px;border:0;background:#111;color:#fff;font-weight:800;cursor:pointer}
.empty{padding:20px;text-align:center;color:#8a8d93;font-size:11px;font-weight:600}
.hidden{display:none}
</style>
</head>
<body>
<div class="header">
<button class="btn-x" onclick="location.href='confadmin.html'"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
<div class="titulo">Transportadores</div>
</div>

<div class="tabs">
<button class="btn-tab active" data-tab="listado" onclick="switchTab('listado')">Listado</button>
<button class="btn-tab" data-tab="agregar" onclick="switchTab('agregar')">Agregar repartidor</button>
<button class="btn-tab" data-tab="ranking" onclick="switchTab('ranking')">Ranking</button>
</div>

<div class="wrap">
<div id="tab-listado">
<div class="table-wrap">
<table>
<thead><tr><th>Repartidor</th><th>Tel / Usuario</th><th>Moto Mandado</th><th>Moto Transporte</th><th>Pedidos</th><th>Debe</th><th>Acción</th></tr></thead>
<tbody id="tbody"><tr><td colspan="7" class="empty">Cargando repartidores...</td></tr></tbody>
</table>
</div>
</div>

<div id="tab-agregar" class="hidden">
<div class="card">
<h3>Agregar nuevo repartidor</h3>
<div class="grid">
<div class="full"><div class="label">Nombre completo</div><input id="aNombre" class="input" placeholder="Ej: Iian"></div>
<div class="full"><div class="label">Usuario</div><input id="aUsuario" class="input" placeholder="Ej: iian"></div>
<div class="full"><div class="label">Teléfono</div><input id="aTelefono" class="input" placeholder="Ej: 3001234567"></div>
<div><div class="label">Valor moto mandado</div><input id="aMandado" type="number" class="input" value="5000"></div>
<div><div class="label">Valor moto transporte</div><input id="aTransporte" type="number" class="input" value="10000"></div>
<div class="full"><div class="label">Contraseña</div><input id="aPass" class="input" placeholder="1234"></div>
</div>
<div class="actions">
<button class="btn-cancel" onclick="switchTab('listado')">Cancelar</button>
<button class="btn-confirm" onclick="guardarRepa()">Guardar repartidor</button>
</div>
</div>
</div>

<div id="tab-ranking" class="hidden">
<div class="card">
<h3>🏆 Ranking repartidores - Pedidos completados</h3>
<div class="rank-list" id="rankList"><div class="empty">Cargando ranking...</div></div>
</div>
</div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDGTYI2ZZnP49DbaMIpRSoGIjZrU6RAEiE",
  authDomain: "historial-kigo-xpress.firebaseapp.com",
  databaseURL: "https://historial-kigo-xpress-default-rtdb.firebaseio.com",
  projectId: "historial-kigo-xpress",
  storageBucket: "historial-kigo-xpress.firebasestorage.app",
  messagingSenderId: "571399920545",
  appId: "1:571399920545:web:aa16407753b43cbe2e89e0"
};
firebase.initializeApp(firebaseConfig);
const dbRT = firebase.database();

let repartidores = {};
let conteoPedidos = {};
let debePedidos = {};

function switchTab(t){
  document.querySelectorAll('.btn-tab').forEach(b=>b.classList.remove('active'));
  document.querySelector(`[data-tab="${t}"]`).classList.add('active');
  document.getElementById('tab-listado').classList.add('hidden');
  document.getElementById('tab-agregar').classList.add('hidden');
  document.getElementById('tab-ranking').classList.add('hidden');
  document.getElementById('tab-'+t).classList.remove('hidden');
}

dbRT.ref('historial_pedidos').on('value', snap=>{
  const data = snap.val()||{};
  conteoPedidos = {};
  debePedidos = {};
  Object.values(data).forEach(p=>{
    const r = (p.repartidor||'').toLowerCase();
    if(!r) return;
    conteoPedidos[r] = (conteoPedidos[r]||0)+1;
    if(p.pagado!==true){
      debePedidos[r] = (debePedidos[r]||0)+1;
    }
  });
  render();
});

dbRT.ref('repartidores').on('value', snap=>{
  const data = snap.val()||{};
  repartidores = data;
  render();
});

function render(){
  const tbody = document.getElementById('tbody');
  const keys = Object.keys(repartidores);
  if(keys.length===0){
    tbody.innerHTML = `<tr><td colspan="7" class="empty">No hay repartidores en /repartidores</td></tr>`;
  } else {
    tbody.innerHTML = keys.map(k=>{
      const r = repartidores[k];
      const nombre = r.nombre||r.usuario||k;
      const lower = (nombre||'').toLowerCase();
      const lower2 = (r.usuario||'').toLowerCase();
      const pedidos = conteoPedidos[lower]||conteoPedidos[lower2]||conteoPedidos[k.toLowerCase()]||0;
      const mandado = Number(r.valormotomandado||r.valorMotoMandado||5000);
      const transporte = Number(r.valormototransporte||r.valorMotoTransporte||10000);
      const debeCount = debePedidos[lower]||debePedidos[lower2]||0;
      return `<tr>
        <td><b>${nombre}</b></td>
        <td>${r.telefono||''}<br><small style="color:#6b7280">${r.usuario||''}</small></td>
        <td><input class="inp-fee" id="m_${k}" type="number" value="${mandado}"> <span class="badge badge-mandado">Mandado</span></td>
        <td><input class="inp-fee" id="t_${k}" type="number" value="${transporte}"> <span class="badge badge-transporte">Transporte</span></td>
        <td><b>${pedidos}</b> pedidos</td>
        <td><b style="color:#ff3b30">${debeCount}</b> por cobrar</td>
        <td><div class="accion-cell"><button class="btn-save" onclick="guardarTarifa('${k}')">Guardar</button><button class="btn-del" onclick="eliminarRepa('${k}')"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#ff3b30" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M10 11v6M14 11v6M5 6l1 14h12l1-14"/></svg></button></div></td>
      </tr>`;
    }).join('');
  }

  const rankList = document.getElementById('rankList');
  const allRepas = Object.keys(repartidores).map(k=>{
    const r = repartidores[k];
    const nombre = r.nombre||r.usuario||k;
    const lower = (nombre||'').toLowerCase();
    const lower2 = (r.usuario||'').toLowerCase();
    const count = conteoPedidos[lower]||conteoPedidos[lower2]||conteoPedidos[k.toLowerCase()]||0;
    return {nombre: nombre, key:k, count:count};
  }).sort((a,b)=>b.count-a.count);

  if(allRepas.length===0){
    rankList.innerHTML = `<div class="empty">No hay repartidores</div>`;
  } else {
    rankList.innerHTML = allRepas.map((it,i)=>{
      let cls = i===0?'top1':i===1?'top2':i===2?'top3':'';
      return `<div class="rank-item">
        <div class="rank-pos ${cls}">${i+1}</div>
        <div class="rank-name">${it.nombre}</div>
        <div class="rank-count">${it.count} pedidos</div>
      </div>`;
    }).join('');
  }
}

async function guardarRepa(){
  const nombre = document.getElementById('aNombre').value.trim();
  const usuario = document.getElementById('aUsuario').value.trim()||nombre.toLowerCase().replace(/\s+/g,'');
  const telefono = document.getElementById('aTelefono').value.trim();
  const mandado = Number(document.getElementById('aMandado').value||5000);
  const transporte = Number(document.getElementById('aTransporte').value||10000);
  const pass = document.getElementById('aPass').value.trim()||'1234';
  if(!nombre) return alert('Pon nombre');
  const key = nombre.replace(/\s+/g,'_');
  await dbRT.ref('repartidores/'+key).set({
    nombre: nombre,
    usuario: usuario,
    telefono: telefono,
    valormotomandado: mandado,
    valormototransporte: transporte,
    valorMotoMandado: mandado,
    valorMotoTransporte: transporte,
    password: pass,
    rol: 'repartidor',
    fechaCreacion: new Date().toISOString()
  });
  document.getElementById('aNombre').value='';
  document.getElementById('aUsuario').value='';
  document.getElementById('aTelefono').value='';
  switchTab('listado');
}

async function guardarTarifa(k){
  const mandado = Number(document.getElementById('m_'+k).value||0);
  const transporte = Number(document.getElementById('t_'+k).value||0);
  await dbRT.ref('repartidores/'+k).update({
    valormotomandado: mandado,
    valormototransporte: transporte,
    valorMotoMandado: mandado,
    valorMotoTransporte: transporte
  });
  alert('Tarifa actualizada para '+k);
}

async function eliminarRepa(k){
  if(!confirm('¿Eliminar repartidor '+k+'?')) return;
  await dbRT.ref('repartidores/'+k).remove();
}
</script>
</body>
</html>
