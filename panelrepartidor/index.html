<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Kigo Xpress - Repartidor</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:#f5f5f7}
.top-bar{background:#fff;padding:10px 12px 8px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #eee;position:sticky;top:0;z-index:100}
.left{display:flex;align-items:center;gap:8px}
.avatar{width:38px;height:38px;border-radius:50%;object-fit:cover;border:2px solid #eee;background:#ddd}
.name{font-size:13px;font-weight:700;color:#111;line-height:1.1}
.sub{font-size:8px;color:#6b7280;font-weight:600;display:flex;align-items:center;gap:6px}
.status-dot{width:6px;height:6px;border-radius:50%;background:#00c853}
.status-btn{font-size:7px;font-weight:800;padding:2px 6px;border-radius:10px;border:1px solid #00c853;background:#e8f5e9;color:#00c853;cursor:pointer}
.right{display:flex;gap:10px}
.icon-btn{width:28px;height:28px;border-radius:50%;border:1px solid #eee;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
.map-wrap{width:100%;height:190px;background:#e5e3df}
#map{width:100%;height:100%}
.section{padding:10px 12px}
.sec-title{font-size:11px;font-weight:800;color:#111;margin-bottom:8px;display:flex;justify-content:space-between}
.badge-count{background:#fee2e2;color:#e30613;font-size:8px;padding:2px 6px;border-radius:10px;font-weight:700}
.card-activa{background:#fff;border-radius:14px;padding:8px 10px;box-shadow:0 4px 16px rgba(0,0,0,.08);border:1px solid #f0f0f0;margin-bottom:10px}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
.date{font-size:8px;color:#6b7280;font-weight:600}
.time-neon{background:#fef08a;border:1px solid #fde047;color:#111;font-size:8px;font-weight:800;padding:2px 6px;border-radius:6px;box-shadow:0 0 8px rgba(250,204,21,.6)}
.price{font-size:22px;font-weight:800;color:#e30613;line-height:1}
.tipo{font-size:7px;font-weight:800;color:#e30613;background:#fee2e2;display:inline-block;padding:2px 6px;border-radius:10px;margin-bottom:6px}
.row{display:flex;gap:6px;margin-bottom:5px;align-items:flex-start}
.r-title{font-size:10px;font-weight:700;color:#111}
.r-dir{font-size:8px;color:#4b5563;font-weight:500;line-height:1.2}
.r-contact{font-size:8px;color:#6b7280;margin-left:18px;margin-top:2px}
.btns{display:flex;gap:6px;margin-top:8px}
.btn-esperar{flex:0.3;background:#e5e7eb;border:0;border-radius:10px;padding:9px;font-size:9px;font-weight:700;cursor:pointer}
.slider-wrap{flex:1;background:#e30613;border-radius:10px;height:38px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;cursor:pointer}
.slider-text{color:#fff;font-size:10px;font-weight:700;pointer-events:none}
.slider-thumb{position:absolute;left:3px;top:3px;width:32px;height:32px;background:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.lista-espera{display:flex;flex-direction:column;gap:6px}
.empty{font-size:9px;color:#9ca3af;text-align:center;padding:20px;background:#fff;border-radius:10px;border:1px dashed #ddd}
.debug{font-size:8px;color:#e30613;background:#fff;padding:6px 12px;border-bottom:1px solid #fee2e2}
</style>
</head>
<body>
<div class="top-bar">
<div class="left"><img id="avatar" class="avatar" src="https://i.pravatar.cc/100?img=5"><div><div class="name" id="txtNombre">repa1</div><div class="sub">Repartidor <span class="status-dot"></span> <button class="status-btn">En línea</button></div></div></div>
<div class="right"><button class="icon-btn" onclick="alert('Configuración pronto')">⚙️</button><button class="icon-btn" onclick="localStorage.clear();location.href='../login/index.html'">⎋</button></div>
</div>
<div class="debug" id="debug">Conectando...</div>
<div class="map-wrap"><div id="map"></div></div>
<div class="section"><div class="sec-title">Pedidos Activos <span class="badge-count" id="countActivos">0</span></div><div id="contActivos"></div></div>
<div class="section" style="padding-top:0"><div class="sec-title">Pedidos en espera <span class="badge-count" id="countEspera">0</span></div><div class="lista-espera" id="contEspera"></div></div>

<script>
const firebaseConfig = { apiKey: "AIzaSyDGTYI2ZZnP49DbaMIpRSoGIjZrU6RAEiE", authDomain: "historial-kigo-xpress.firebaseapp.com", databaseURL: "https://historial-kigo-xpress-default-rtdb.firebaseio.com", projectId: "historial-kigo-xpress", storageBucket: "historial-kigo-xpress.firebasestorage.app", messagingSenderId: "571399920545", appId: "1:571399920545:web:aa16407753b43cbe2e89e0" };
firebase.initializeApp(firebaseConfig); const db = firebase.database();
let map, directionsService, directionsRenderer, markers=[];
let repartidorKey = (localStorage.getItem('kigo_user')||localStorage.getItem('kigo_last_user')||'repa1').trim();
// Si tu login guarda "Jose", lo convertimos a repa1 para probar
if(repartidorKey.toLowerCase()==='jose') repartidorKey='repa1';
if(!['repa1','repa2'].includes(repartidorKey)) repartidorKey='repa1';
document.getElementById('txtNombre').textContent = repartidorKey;

window.initMap = function(){ map=new google.maps.Map(document.getElementById("map"),{center:{lat:21.157,lng:-100.934},zoom:13,disableDefaultUI:true}); directionsService=new google.maps.DirectionsService(); directionsRenderer=new google.maps.DirectionsRenderer({map:map,suppressMarkers:true,polylineOptions:{strokeColor:"#e30613",strokeWeight:4}}); }
function limpiarMarkers(){ markers.forEach(m=>m.setMap(null)); markers=[]; if(directionsRenderer) directionsRenderer.setDirections({routes:[]}); }
function mostrarRuta(o){ if(!map) return; limpiarMarkers(); const lat1=o.recogidaLat||o.negocioLat||o.aliadoLat; const lng1=o.recogidaLng||o.negocioLng||o.aliadoLng; const lat2=o.entregaLat; const lng2=o.entregaLng; if(!lat1||!lat2) return; const orig=new google.maps.LatLng(parseFloat(lat1),parseFloat(lng1)); const dest=new google.maps.LatLng(parseFloat(lat2),parseFloat(lng2)); markers.push(new google.maps.Marker({position:orig,map:map,icon:{url:"https://maps.google.com/mapfiles/ms/icons/red-dot.png",scaledSize:new google.maps.Size(28,28)}})); markers.push(new google.maps.Marker({position:dest,map:map,icon:{url:"https://maps.google.com/mapfiles/ms/icons/green-dot.png",scaledSize:new google.maps.Size(28,28)}})); directionsService.route({origin:orig,destination:dest,travelMode:google.maps.TravelMode.DRIVING},(res,status)=>{ if(status==='OK'){ directionsRenderer.setDirections(res); const b=new google.maps.LatLngBounds(); b.extend(orig); b.extend(dest); map.fitBounds(b); } }); }
function formatoFecha(ts){ const d=new Date(ts); return d.toLocaleDateString('es-MX',{day:'2-digit',month:'short'})+' '+d.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'}); }
let pedidosBuffer={};
function renderPedidos(){ const lista=Object.entries(pedidosBuffer).map(([id,v])=>({idFirebase:id,...v})).sort((a,b)=>(a.timestamp||0)-(b.timestamp||0)); const activos=lista.filter(p=>p.estado==='activo'); const espera=lista.filter(p=>p.status==='asignado'||!p.estado); document.getElementById('countActivos').textContent=activos.length; document.getElementById('countEspera').textContent=espera.length; document.getElementById('debug').textContent=`${repartidorKey}: ${lista.length} pedidos | leyendo de pedidos_por_repartidor/${repartidorKey} y repartidores/${repartidorKey}/pedidos`; const cA=document.getElementById('contActivos'); cA.innerHTML=''; if(activos.length===0) cA.innerHTML='<div class="empty">No tienes pedidos activos</div>'; activos.forEach(p=>{ const div=document.createElement('div'); div.className='card-activa'; div.innerHTML=`<div class="card-top"><div><div class="date">${p.timestamp?formatoFecha(p.timestamp):''} - #${p.idFirebase.slice(-4)}</div><div class="time-neon">${p.tiempo||'15 min'}</div></div><div class="price">$${p.precio||0}</div></div><div class="tipo">${(p.tipo||'').toUpperCase()}</div><div class="row"><div><div class="r-title">📍 Recoger: ${p.aliado||p.recogidaNombre||p.negocio||''}</div><div class="r-dir">${p.aliadoDir||p.recogidaDir||p.negocio||''}</div></div></div><div class="row"><div><div class="r-title">🟢 Entregar: ${p.entrega||''}</div><div class="r-contact">${p.cliente||p.entregaNombre||''} • ${p.celular||p.entregaCel||'sin especificación'}</div></div></div><div class="btns"><button class="btn-esperar" onclick="entregarPedido('${p.idFirebase}')">Entregado</button><button class="btn-esperar" onclick="mostrarRutaPorId('${p.idFirebase}')">Ver ruta</button></div>`; cA.appendChild(div); }); const cE=document.getElementById('contEspera'); cE.innerHTML=''; if(espera.length===0) cE.innerHTML='<div class="empty">Sin pedidos en espera. Crea uno en panelpedidos asignando a '+repartidorKey+'</div>'; espera.forEach(p=>{ const div=document.createElement('div'); div.className='card-activa'; div.innerHTML=`<div class="card-top"><div><div class="date">${p.timestamp?formatoFecha(p.timestamp):''} - #${p.idFirebase.slice(-4)}</div><div class="time-neon">${p.tiempo||'15 min'}</div></div><div class="price">$${p.precio||0}</div></div><div class="tipo">${(p.tipo||'').toUpperCase()}</div><div class="row"><div><div class="r-title">📍 Recoger: ${p.aliado||p.recogidaNombre||p.negocio||p.productos||''}</div><div class="r-dir">${p.aliadoDir||p.recogidaDir||p.negocio||''}</div></div></div><div class="row"><div><div class="r-title">🟢 Entregar: ${p.entrega||''}</div><div class="r-contact">${p.cliente||p.entregaNombre||''} • ${p.celular||p.entregaCel||'sin especificación'}</div></div></div><div class="btns"><button class="btn-esperar">Esperar</button><div class="slider-wrap" id="slider-${p.idFirebase}" ontouchstart="startSlide(event,'${p.idFirebase}')" onmousedown="startSlide(event,'${p.idFirebase}')"><div class="slider-thumb" id="thumb-${p.idFirebase}">➤</div><div class="slider-text">Desliza para Tomar >>></div></div></div>`; cE.appendChild(div); }); if(activos.length>0) mostrarRuta(activos[0]); else if(espera.length>0) mostrarRuta(espera[0]); }
function mostrarRutaPorId(id){ const p=pedidosBuffer[id]; if(p) mostrarRuta(p); }

// ESCUCHA CORRECTA PARA REPA1 Y REPA2
db.ref('pedidos_por_repartidor/'+repartidorKey).on('value', snap=>{ const val=snap.val()||{}; Object.entries(val).forEach(([k,v])=>{ if(k!=='_init') pedidosBuffer[k]=v; }); renderPedidos(); });
db.ref('repartidores/'+repartidorKey+'/pedidos').on('value', snap=>{ const val=snap.val()||{}; Object.entries(val).forEach(([k,v])=>{ if(k!=='_init') pedidosBuffer[k]=v; }); renderPedidos(); });
db.ref('pedidos').on('value', snap=>{ const all=snap.val()||{}; Object.entries(all).forEach(([k,v])=>{ if(k==='_init') return; if(!v) return; if(v.repartidorKey===repartidorKey||v.repartidor===repartidorKey){ pedidosBuffer[k]=v; } }); renderPedidos(); });

let dragging=null,startX=0;
function startSlide(e,id){ dragging=id; const t=e.touches?e.touches[0].clientX:e.clientX; startX=t; document.addEventListener('mousemove',onMove); document.addEventListener('mouseup',onEnd); document.addEventListener('touchmove',onMove,{passive:false}); document.addEventListener('touchend',onEnd); }
function onMove(e){ if(!dragging) return; if(e.cancelable) e.preventDefault(); const x=e.touches?e.touches[0].clientX:e.clientX; let diff=x-startX; const wrap=document.getElementById('slider-'+dragging); const thumb=document.getElementById('thumb-'+dragging); if(!wrap||!thumb) return; const max=wrap.offsetWidth-38; let pos=Math.min(Math.max(0,diff),max); thumb.style.left=pos+'px'; if(pos>=max*0.85){ tomarPedido(dragging); onEnd(); } }
function onEnd(){ if(dragging){ const th=document.getElementById('thumb-'+dragging); if(th) th.style.left='3px'; } dragging=null; document.removeEventListener('mousemove',onMove); document.removeEventListener('mouseup',onEnd); document.removeEventListener('touchmove',onMove); document.removeEventListener('touchend',onEnd); }
function tomarPedido(id){ const p=pedidosBuffer[id]; if(!p) return; db.ref('pedidos_por_repartidor/'+repartidorKey+'/'+id).update({estado:'activo', status:'en_camino'}); db.ref('repartidores/'+repartidorKey+'/pedidos/'+id).update({estado:'activo', status:'en_camino'}); db.ref('pedidos/'+id).update({estado:'activo', status:'en_camino'}); }
function entregarPedido(id){ if(!confirm('¿Entregado?')) return; db.ref('pedidos_por_repartidor/'+repartidorKey+'/'+id).remove(); db.ref('repartidores/'+repartidorKey+'/pedidos/'+id).remove(); db.ref('pedidos/'+id).update({status:'entregado'}); delete pedidosBuffer[id]; renderPedidos(); limpiarMarkers(); }
</script>
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCTV1sm6McEIkv-cheaVFCD_svp_a--6wg&libraries=places&callback=initMap" async defer></script>
</body>
</html>
