<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Historial - Kigo Xpress</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#f5f5f7;padding-bottom:20px}
.top{padding:14px 16px;background:#fff;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #eee;position:sticky;top:0;z-index:50}
.top-left{display:flex;align-items:center;gap:12px}
.btn-x{width:38px;height:38px;border-radius:50%;background:#f1f2f4;border:0;display:flex;align-items:center;justify-content:center;cursor:pointer}
.btn-x svg{width:20px;height:20px}
.top-title{font-size:16px;font-weight:800;color:#111}
.count-right{font-size:12px;font-weight:800;color:#111;background:#f3f4f6;padding:6px 12px;border-radius:20px;border:1px solid #e5e7eb}
.filters{background:#fff;padding:10px 12px 12px;border-bottom:1px solid #eee;position:sticky;top:57px;z-index:40}
.filter-row{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.filter-row::-webkit-scrollbar{display:none}
.chip{padding:7px 14px;border-radius:999px;border:1.5px solid #e5e7eb;background:#fff;font-size:11px;font-weight:700;color:#374151;cursor:pointer;white-space:nowrap;flex-shrink:0}
.chip.active{background:#111;color:#fff;border-color:#111}
.search-row{display:flex;gap:8px;margin-top:2px}
.input-date{flex:1;height:38px;border:1px solid #e5e7eb;border-radius:10px;padding:0 12px;font-size:12px;font-weight:600;outline:0;background:#f9fafb}
.input-search{flex:1.2;height:38px;border:1px solid #e5e7eb;border-radius:10px;padding:0 12px 0 36px;font-size:12px;font-weight:500;outline:0;background:#f9fafb}
.search-wrap{position:relative;flex:1.2}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%)}
.resumen{padding:10px 12px;display:flex;gap:8px}
.card-res{flex:1;background:#fff;border-radius:14px;padding:10px 12px;border:1px solid #eef0f3;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.card-res .lbl{font-size:9px;font-weight:700;color:#6b7280;letter-spacing:.3px;text-transform:uppercase;display:flex;align-items:center;gap:5px}
.card-res .val{font-size:16px;font-weight:800;color:#111;margin-top:4px}
.card-res.debe .val{color:#e30613}
.card-res.debe{background:#fff1f2;border-color:#fecdd3}
.table-head{background:#fff;margin:0 12px;border-radius:12px 12px 0 0;padding:8px 10px;display:flex;gap:5px;border:1px solid #eef0f3;border-bottom:0;font-size:7.5px;font-weight:800;color:#9ca3af;letter-spacing:.3px;text-transform:uppercase;overflow-x:auto}
.th-fecha{width:74px;flex-shrink:0}
.th-num{width:42px;flex-shrink:0}
.th-tipo{width:62px;flex-shrink:0}
.th-aliado{flex:1;min-width:60px}
.th-valor{width:46px;text-align:right;flex-shrink:0}
.th-importe{width:46px;text-align:right;flex-shrink:0}
.th-ingresos{width:46px;text-align:right;flex-shrink:0}
.th-estado{width:52px;text-align:center;flex-shrink:0}
.list{padding:0 12px;display:flex;flex-direction:column}
.card-hist{background:#fff;border:1px solid #eef0f3;border-top:0;padding:9px 10px;display:flex;gap:5px;align-items:center}
.card-hist:first-child{border-top:1px solid #eef0f3}
.card-hist:last-child{border-radius:0 0 12px 12px}
.col-fecha{width:74px;flex-shrink:0;font-size:8px;font-weight:500;color:#6b7280;line-height:1.2}
.col-num{width:42px;flex-shrink:0;font-size:11px;font-weight:800;color:#111}
.col-tipo{width:62px;flex-shrink:0}
.badge-tipo{font-size:6.5px;font-weight:800;padding:3px 5px;border-radius:6px;display:inline-block}
.badge-tipo.aliados{background:#fee2e2;color:#e30613}
.badge-tipo.cliente{background:#dbeafe;color:#2563eb}
.badge-tipo.recoger{background:#fef3c7;color:#92400e}
.col-aliado{flex:1;min-width:60px;font-size:9px;font-weight:600;color:#111;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.col-valor{width:46px;flex-shrink:0;text-align:right;font-size:10px;font-weight:700;color:#111}
.col-importe{width:46px;flex-shrink:0;text-align:right;font-size:10px;font-weight:600;color:#6b7280}
.col-ingresos{width:46px;flex-shrink:0;text-align:right;font-size:10px;font-weight:800;color:#00a344}
.col-estado{width:52px;flex-shrink:0;text-align:center}
.pill-pagado{font-size:7.5px;font-weight:800;padding:4px 6px;border-radius:8px;display:inline-block}
.pill-pagado.pagado{background:#e8f5e9;color:#00a344;border:1px solid #a7f3d0}
.pill-pagado.debe{background:#fee2e2;color:#e30613;border:1px solid #fecaca}
.empty{font-size:11px;color:#9ca3af;text-align:center;padding:40px 20px;background:#fff;border-radius:14px;border:1px dashed #ddd;margin:10px 12px}
</style>
</head>
<body>

<div class="top">
<div class="top-left">
<button class="btn-x" onclick="location.href='configuracion.html'">
<svg viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
</button>
<div class="top-title">Historial</div>
</div>
<div class="count-right" id="countPedidosTop">0 pedidos</div>
</div>

<div class="filters">
<div class="filter-row" id="chips">
<button class="chip active" data-f="todo">Todo</button>
<button class="chip" data-f="hoy">Hoy</button>
<button class="chip" data-f="semana">Semana</button>
<button class="chip" data-f="mes">Mes</button>
</div>
<div class="search-row">
<input type="date" id="inputFecha" class="input-date">
<div class="search-wrap">
<div class="search-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="2"><circle cx="11" cy="11" r="6"></circle><path d="M21 21l-4.2-4.2"></path></svg></div>
<input type="text" id="inputSearch" class="input-search" placeholder="Cliente, aliado o #pedido">
</div>
</div>
</div>

<div class="resumen">
<div class="card-res ingresos">
<div class="lbl"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2"><path d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg> Ingresos totales</div>
<div class="val" id="valIngresos">$0</div>
</div>
<div class="card-res debe">
<div class="lbl"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#e30613" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><circle cx="12" cy="16" r="1" fill="#e30613"/></svg> Debe</div>
<div class="val" id="valDebe">$0</div>
</div>
</div>

<div class="table-head">
<div class="th-fecha">FECHA</div>
<div class="th-num"># PEDIDO</div>
<div class="th-tipo">SERVICIO</div>
<div class="th-aliado">ALIADO</div>
<div class="th-valor">VALOR</div>
<div class="th-importe">IMPORTE</div>
<div class="th-ingresos">INGRESOS</div>
<div class="th-estado">ESTADO</div>
</div>

<div class="list" id="lista"></div>

<script>
const firebaseConfig = { apiKey: "AIzaSyDGTYI2ZZnP49DbaMIpRSoGIjZrU6RAEiE", authDomain: "historial-kigo-xpress.firebaseapp.com", databaseURL: "https://historial-kigo-xpress-default-rtdb.firebaseio.com", projectId: "historial-kigo-xpress", storageBucket: "historial-kigo-xpress.firebasestorage.app", messagingSenderId: "571399920545", appId: "1:571399920545:web:aa16407753b43cbe2e89e0" };
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let repartidorKey = (localStorage.getItem('kigo_user_key')||localStorage.getItem('kigo_user')||'Jose').trim();
if(repartidorKey.toLowerCase()==='repa1') repartidorKey='Jose';
if(repartidorKey.toLowerCase()==='repa2') repartidorKey='Iian';

let todosPedidos = [];
let filtroActual = 'todo';
let fechaFiltro = '';
let searchFiltro = '';

db.ref('historial_repartidor/'+repartidorKey).on('value', snap=>{
  const val = snap.val()||{};
  todosPedidos = Object.entries(val).map(([id,v])=>({id,...v})).sort((a,b)=>(b.fechaEntrega||b.timestamp||0)-(a.fechaEntrega||a.timestamp||0));
  render();
});

function formatFecha(ts){
  if(!ts) return '';
  const d=new Date(ts);
  return d.toLocaleDateString('es-MX',{day:'2-digit',month:'2-digit',year:'2-digit'})+' '+d.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit',hour12:true});
}
function isHoy(ts){ const d=new Date(ts); const hoy=new Date(); return d.toDateString()===hoy.toDateString(); }
function isSemana(ts){ const d=new Date(ts); const hoy=new Date(); const hace7=new Date(); hace7.setDate(hoy.getDate()-7); return d>=hace7; }
function isMes(ts){ const d=new Date(ts); const hoy=new Date(); return d.getMonth()===hoy.getMonth() && d.getFullYear()===hoy.getFullYear(); }
function isFechaIgual(ts, fechaStr){ if(!fechaStr) return true; const d=new Date(ts); const f=new Date(fechaStr+'T00:00:00'); return d.toDateString()===f.toDateString(); }
function getTipo(p){
  const t=(p.tipo||'').toLowerCase();
  if(t.includes('aliado')) return {txt:'ALIADOS', cls:'aliados'};
  if(t.includes('cliente')||t.includes('nuevo')) return {txt:'CLIENTE', cls:'cliente'};
  return {txt:'RECOGER', cls:'recoger'};
}

function render(){
  let filtrados = todosPedidos.filter(p=>{
    const ts = p.fechaEntrega||p.timestamp||0;
    if(filtroActual==='hoy' && !isHoy(ts)) return false;
    if(filtroActual==='semana' && !isSemana(ts)) return false;
    if(filtroActual==='mes' && !isMes(ts)) return false;
    if(fechaFiltro && !isFechaIgual(ts, fechaFiltro)) return false;
    if(searchFiltro){
      const s=searchFiltro.toLowerCase();
      const cliente=(p.cliente||p.entregaNombre||'').toLowerCase();
      const aliado=(p.aliado||p.recogidaNombre||'').toLowerCase();
      const num=String(p.numeroPedido||'').toLowerCase();
      if(!cliente.includes(s) && !aliado.includes(s) && !num.includes(s)) return false;
    }
    return true;
  });

  const lista=document.getElementById('lista');
  lista.innerHTML='';
  let totalIngresos=0;
  let totalDebe=0;

  if(filtrados.length===0){
    lista.innerHTML='<div class="empty">Sin pedidos en este filtro</div>';
  } else {
    filtrados.forEach(p=>{
      const valor = parseFloat(p.precio||p.valorTotal||0);
      const pagado = p.pagado!==false && p.debe!==true && p.estadoPago!=='debe';
      let importe, ingresos;

      if(!pagado){
        // DEBE: importe 0, ingresos = valor completo
        importe = 0;
        ingresos = valor;
        totalDebe += valor;
      } else {
        // PAGADO: importe real, ingresos = valor - importe
        const importeReal = p.importe!=null ? parseFloat(p.importe) : (p.precioPagado!=null ? parseFloat(p.precioPagado) : Math.round(valor*0.8));
        importe = importeReal;
        ingresos = valor - importe;
        totalIngresos += ingresos;
      }

      const tipo = getTipo(p);
      const aliadoTxt = p.aliado || p.recogidaNombre || p.aliadoDir || (tipo.txt==='CLIENTE' ? (p.recogidaNombre||'Cliente') : 'Sin aliado');
      const fecha = formatFecha(p.fechaEntrega||p.timestamp);

      const div=document.createElement('div');
      div.className='card-hist';
      div.innerHTML=`
        <div class="col-fecha">${fecha}</div>
        <div class="col-num">#${p.numeroPedido||'?'}</div>
        <div class="col-tipo"><span class="badge-tipo ${tipo.cls}">${tipo.txt}</span></div>
        <div class="col-aliado" title="${aliadoTxt}">${aliadoTxt.slice(0,16)}</div>
        <div class="col-valor">$${valor}</div>
        <div class="col-importe">$${importe}</div>
        <div class="col-ingresos">$${ingresos}</div>
        <div class="col-estado"><span class="pill-pagado ${pagado?'pagado':'debe'}">${pagado?'PAGADO':'DEBE'}</span></div>
      `;
      lista.appendChild(div);
    });
  }
  document.getElementById('countPedidosTop').textContent = filtrados.length+' pedidos';
  document.getElementById('valIngresos').textContent = '$'+totalIngresos;
  document.getElementById('valDebe').textContent = '$'+totalDebe;
}

document.querySelectorAll('.chip').forEach(ch=>{
  ch.addEventListener('click',()=>{
    document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
    ch.classList.add('active');
    filtroActual=ch.dataset.f;
    render();
  });
});
document.getElementById('inputFecha').addEventListener('change',e=>{ fechaFiltro=e.target.value; render(); });
document.getElementById('inputSearch').addEventListener('input',e=>{ searchFiltro=e.target.value.trim(); render(); });
</script>
</body>
</html>
