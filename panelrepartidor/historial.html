<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Historial - Kigo Xpress</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#f5f5f7}
.top{padding:14px 16px;background:#fff;display:flex;align-items:center;gap:12px;border-bottom:1px solid #eee;position:sticky;top:0;z-index:50}
.btn-x{width:38px;height:38px;border-radius:50%;background:#f1f2f4;border:0;display:flex;align-items:center;justify-content:center;cursor:pointer}
.btn-x svg{width:20px;height:20px}
.top-title{font-size:16px;font-weight:800;color:#111}
.top-sub{font-size:11px;color:#6b7280;font-weight:600}
.header{padding:12px 16px;background:#fff;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center}
.header-left{font-size:12px;font-weight:700;color:#111}
.header-right{font-size:11px;font-weight:600;color:#6b7280}
.filters{background:#fff;padding:10px 12px 12px;border-bottom:1px solid #eee;position:sticky;top:57px;z-index:40}
.filter-row{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.filter-row::-webkit-scrollbar{display:none}
.chip{padding:7px 14px;border-radius:999px;border:1.5px solid #e5e7eb;background:#fff;font-size:11px;font-weight:700;color:#374151;cursor:pointer;white-space:nowrap;flex-shrink:0}
.chip.active{background:#111;color:#fff;border-color:#111}
.search-row{display:flex;gap:8px;margin-top:2px}
.input-date{flex:1;height:38px;border:1px solid #e5e7eb;border-radius:10px;padding:0 12px;font-size:12px;font-weight:600;outline:0;background:#f9fafb}
.input-search{flex:1.2;height:38px;border:1px solid #e5e7eb;border-radius:10px;padding:0 12px 0 36px;font-size:12px;font-weight:500;outline:0;background:#f9fafb}
.search-wrap{position:relative;flex:1.2}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%)}
.list{padding:10px 12px 20px;display:flex;flex-direction:column;gap:8px}
.card-hist{background:#fff;border-radius:14px;padding:10px 12px;border:1px solid #eef0f3;box-shadow:0 2px 8px rgba(0,0,0,.04);display:flex;justify-content:space-between;align-items:center}
.card-left{flex:1;min-width:0}
.card-top{display:flex;gap:8px;align-items:center;margin-bottom:4px}
.num{font-size:11px;font-weight:800;color:#111;background:#f3f4f6;padding:2px 7px;border-radius:8px}
.cliente{font-size:12px;font-weight:700;color:#111;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}
.meta{font-size:9px;color:#6b7280;font-weight:500;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.meta span{display:flex;align-items:center;gap:3px}
.meta svg{width:12px;height:12px;stroke:#9ca3af;stroke-width:2;fill:none}
.card-right{text-align:right;flex-shrink:0;margin-left:10px}
.precio{font-size:13px;font-weight:800;color:#111;line-height:1}
.ganancia{font-size:9px;font-weight:700;color:#00c853;background:#e8f5e9;padding:2px 6px;border-radius:8px;display:inline-block;margin-top:2px}
.tipo{font-size:7px;font-weight:800;color:#e30613;background:#fee2e2;padding:2px 6px;border-radius:6px;display:inline-block;margin-left:6px}
.empty{font-size:11px;color:#9ca3af;text-align:center;padding:40px 20px;background:#fff;border-radius:14px;border:1px dashed #ddd;margin-top:10px}
.total-bar{background:#fff;border-top:1px solid #eee;padding:10px 16px;display:flex;justify-content:space-between;position:fixed;bottom:0;left:0;right:0}
.total-bar div{font-size:11px;font-weight:700;color:#111}
.total-bar b{font-size:13px;color:#00c853}
</style>
</head>
<body>

<div class="top">
<button class="btn-x" onclick="location.href='configuracion.html'">
<svg viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
</button>
<div>
<div class="top-title">Historial</div>
<div class="top-sub" id="topSub">Cargando...</div>
</div>
</div>

<div class="header">
<div class="header-left" id="headerCount">0 pedidos</div>
<div class="header-right" id="headerGanancia">$0 ganancia</div>
</div>

<div class="filters">
<div class="filter-row" id="chips">
<button class="chip active" data-f="todo">Todo</button>
<button class="chip" data-f="hoy">Hoy</button>
<button class="chip" data-f="semana">Semana</button>
<button class="chip" data-f="mes">Mes</button>
</div>
<div class="search-row">
<input type="date" id="inputFecha" class="input-date">
<div class="search-wrap">
<div class="search-icon">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="2"><circle cx="11" cy="11" r="6"></circle><path d="M21 21l-4.2-4.2"></path></svg>
</div>
<input type="text" id="inputSearch" class="input-search" placeholder="Cliente o #pedido">
</div>
</div>
</div>

<div class="list" id="lista"></div>

<div class="total-bar">
<div>Total pedidos: <span id="totalPedidos">0</span></div>
<div>Ganancia: <b id="totalGanancia">$0</b></div>
</div>

<script>
const firebaseConfig = { apiKey: "AIzaSyDGTYI2ZZnP49DbaMIpRSoGIjZrU6RAEiE", authDomain: "historial-kigo-xpress.firebaseapp.com", databaseURL: "https://historial-kigo-xpress-default-rtdb.firebaseio.com", projectId: "historial-kigo-xpress", storageBucket: "historial-kigo-xpress.firebasestorage.app", messagingSenderId: "571399920545", appId: "1:571399920545:web:aa16407753b43cbe2e89e0" };
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let repartidorKey = (localStorage.getItem('kigo_user_key')||localStorage.getItem('kigo_user')||'Jose').trim();
if(repartidorKey.toLowerCase()==='repa1') repartidorKey='Jose';
if(repartidorKey.toLowerCase()==='repa2') repartidorKey='Iian';

document.getElementById('topSub').textContent = 'Repartidor: '+repartidorKey;

let todosPedidos = [];
let filtroActual = 'todo';
let fechaFiltro = '';
let searchFiltro = '';

db.ref('historial_repartidor/'+repartidorKey).on('value', snap=>{
  const val = snap.val()||{};
  todosPedidos = Object.entries(val).map(([id,v])=>({id,...v})).sort((a,b)=>(b.fechaEntrega||b.timestamp||0)-(a.fechaEntrega||a.timestamp||0));
  render();
});

// Fallback si no hay historial por repartidor, leer global filtrado
if(todosPedidos.length===0){
  db.ref('historial_pedidos').orderByChild('entregadoPor').equalTo(repartidorKey).once('value').then(s=>{
    if(s.exists() && todosPedidos.length===0){
      const v=s.val(); todosPedidos=Object.entries(v).map(([id,d])=>({id,...d})).sort((a,b)=>(b.fechaEntrega||0)-(a.fechaEntrega||0));
      render();
    }
  });
}

function formatFecha(ts){
  if(!ts) return '';
  const d=new Date(ts);
  return d.toLocaleDateString('es-MX',{day:'2-digit',month:'short',year:'2-digit'})+' '+d.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit',hour12:true});
}
function isHoy(ts){ const d=new Date(ts); const hoy=new Date(); return d.toDateString()===hoy.toDateString(); }
function isSemana(ts){ const d=new Date(ts); const hoy=new Date(); const hace7=new Date(); hace7.setDate(hoy.getDate()-7); return d>=hace7; }
function isMes(ts){ const d=new Date(ts); const hoy=new Date(); return d.getMonth()===hoy.getMonth() && d.getFullYear()===hoy.getFullYear(); }
function isFechaIgual(ts, fechaStr){ if(!fechaStr) return true; const d=new Date(ts); const f=new Date(fechaStr+'T00:00:00'); return d.toDateString()===f.toDateString(); }

function render(){
  let filtrados = todosPedidos.filter(p=>{
    const ts = p.fechaEntrega||p.timestamp||0;
    if(filtroActual==='hoy' && !isHoy(ts)) return false;
    if(filtroActual==='semana' && !isSemana(ts)) return false;
    if(filtroActual==='mes' && !isMes(ts)) return false;
    if(fechaFiltro && !isFechaIgual(ts, fechaFiltro)) return false;
    if(searchFiltro){
      const s=searchFiltro.toLowerCase();
      const cliente=(p.cliente||p.entregaNombre||'').toLowerCase();
      const num=String(p.numeroPedido||'').toLowerCase();
      if(!cliente.includes(s) && !num.includes(s)) return false;
    }
    return true;
  });

  const lista=document.getElementById('lista');
  lista.innerHTML='';
  let totalGan=0;
  let totalPrecio=0;

  if(filtrados.length===0){
    lista.innerHTML='<div class="empty">Sin pedidos en este filtro</div>';
  } else {
    filtrados.forEach(p=>{
      const precio = parseFloat(p.precio||0);
      const gan = p.ganancia ? parseFloat(p.ganancia) : Math.round(precio*0.8);
      totalPrecio+=precio;
      totalGan+=gan;
      const fecha = formatFecha(p.fechaEntrega||p.timestamp);
      const div=document.createElement('div');
      div.className='card-hist';
      div.innerHTML=`
        <div class="card-left">
          <div class="card-top">
            <span class="num">#${p.numeroPedido||'?'}</span>
            <span class="cliente">${p.cliente||p.entregaNombre||'Cliente'}</span>
            <span class="tipo">${(p.tipo||'SERVICIO').toUpperCase().slice(0,12)}</span>
          </div>
          <div class="meta">
            <span><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18"/><path d="M8 2v4M16 2v4"/></svg> ${fecha}</span>
            <span><svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg> ${ (p.entregaDir||'').slice(0,28)}</span>
          </div>
        </div>
        <div class="card-right">
          <div class="precio">$${precio}</div>
          <div class="ganancia">+$${gan} ganancia</div>
        </div>
      `;
      div.onclick=()=>{ location.href='detalle_historial.html?id='+p.id; };
      lista.appendChild(div);
    });
  }
  document.getElementById('headerCount').textContent = filtrados.length+' pedidos';
  document.getElementById('headerGanancia').textContent = '$'+totalGan+' ganancia';
  document.getElementById('totalPedidos').textContent = filtrados.length;
  document.getElementById('totalGanancia').textContent = '$'+totalGan;
}

// eventos filtros
document.querySelectorAll('.chip').forEach(ch=>{
  ch.addEventListener('click',()=>{
    document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
    ch.classList.add('active');
    filtroActual=ch.dataset.f;
    render();
  });
});
document.getElementById('inputFecha').addEventListener('change',e=>{ fechaFiltro=e.target.value; render(); });
document.getElementById('inputSearch').addEventListener('input',e=>{ searchFiltro=e.target.value.trim(); render(); });
</script>
</body>
</html>
