<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kigo Xpress</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{height:100vh;overflow:hidden;display:flex;flex-direction:column;background:#fff}
#map{height:45vh;width:100%;background:#e5e3df;position:relative;flex-shrink:0}
.center-btn{position:absolute;bottom:16px;right:12px;z-index:10;width:42px;height:42px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.25);border:0;cursor:pointer}
.bottom-sheet{background:#fff;border-radius:20px 20px 0 0;margin-top:-14px;z-index:20;padding:10px 14px 16px;box-shadow:0 -6px 24px rgba(0,0,0,.15);overflow-y:auto;flex:1}
.handle{width:36px;height:4px;background:#d1d5db;border-radius:10px;margin:0 auto 10px}
.info-row{ display:flex; background:#fff; border:1px solid #f3f4f6; border-radius:10px; padding:5px 8px; margin:0 0 8px; gap:6px; align-items:center }
.info-col{flex:1;display:flex;align-items:center;gap:5px}
.label{font-size:8px;color:#8b93a5;font-weight:700;letter-spacing:.4px}
.value{font-size:10px;font-weight:700;color:#1f2937}
.value.price-neon{color:#00c853;font-weight:800}
.divider{width:1px;background:#eee;height:18px}
.btn-row{display:flex;gap:6px;margin-bottom:6px}
.btn-tipo{flex:1;border:0;border-radius:10px;padding:9px;font-size:10px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px}
.btn-tipo.aliados{background:#e30613;color:#fff}
.btn-tipo.clientes{background:#111;color:#fff}
.btn-tipo.inactive{opacity:.35}
.btn-serv{flex:1;border:1.5px solid #e5e7eb;background:#fff;border-radius:10px;padding:9px;font-size:10px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px}
.btn-serv.active{background:#111;color:#fff;border-color:#111}
.input-wrap{position:relative;margin-bottom:5px}
.input-mini{width:100%;border:1.2px solid #e5e7eb;border-radius:10px;padding:7px 30px 7px 10px;font-size:11px;outline:none;height:34px;background:#fff}
.input-mini:focus{border-color:#e30613}
.btn-x{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:20px;height:20px;border-radius:50%;border:0;background:#f3f4f6;display:none;align-items:center;justify-content:center;cursor:pointer;font-size:10px;font-weight:700;color:#6b7280}
.btn-x.show{display:flex}
.suggestions{position:absolute;top:100%;left:0;right:0;background:#fff;border-radius:10px;box-shadow:0 8px 20px rgba(0,0,0,.15);max-height:140px;overflow-y:auto;z-index:30;display:none;margin-top:3px;border:1px solid #eee}
.card-aliado{display:none;background:#f9fafb;border:1px solid #eee;border-radius:8px;padding:5px 8px;margin-bottom:5px}
.card-aliado.show{display:block}
.card-aliado.row{display:flex;align-items:center;gap:4px;font-size:8px;color:#4b5563;line-height:1.3}
.card-aliado.row b{font-size:7.5px;color:#8b93a5;min-width:44px;font-weight:700}
.card-aliado.row span{font-size:8px;font-weight:600;color:#111}
.time-chip{border:1px solid #e5e7eb;background:#fff;border-radius:16px;padding:4px 9px;font-size:9px;font-weight:700;cursor:pointer}
.time-chip.active{background:#e30613;color:#fff;border-color:#e30613}
.btn-continuar{background:#e30613;color:#fff;border:0;border-radius:50px;padding:11px;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;cursor:pointer;margin-top:8px}
.btn-continuar:disabled{background:#fca5a5}

/* MODAL REPARTIDOR CENTRADO */
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);z-index:9999;align-items:center;justify-content:center;padding:20px}
.modal-overlay.show{display:flex}
.modal-card{background:#fff;border-radius:18px;padding:16px;width:100%;max-width:320px;box-shadow:0 20px 40px rgba(0,0,0,.3);animation:pop.2s ease}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.modal-title{font-size:12px;font-weight:800;text-align:center;margin-bottom:12px;color:#111}
.select-repa{width:100%;border:1.5px solid #e5e7eb;border-radius:10px;padding:10px;font-size:12px;font-weight:600;outline:none;background:#fff;height:40px;margin-bottom:14px}
.modal-btns{display:flex;gap:8px}
.btn-cancel{flex:1;background:#fee2e2;color:#e30613;border:1.5px solid #fecaca;border-radius:10px;padding:10px;font-size:11px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-send{flex:1;background:#00c853;color:#fff;border:0;border-radius:10px;padding:10px;font-size:11px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}

.form-box{display:none}.form-box.active{display:block}
.pac-container{z-index:9999!important}
</style>
</head>
<body>

<div id="map">
  <button class="center-btn" id="btnCenter" type="button"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2"/></svg></button>
</div>

<!-- TARJETA REPARTIDOR EN MEDIO -->
<div class="modal-overlay" id="modalRepartidor">
  <div class="modal-card">
    <div class="modal-title">Seleccionar Repartidor</div>
    <select id="selectRepartidor" class="select-repa">
      <option value="">Cargando repartidores...</option>
    </select>
    <div class="modal-btns">
      <button class="btn-cancel" id="btnCancelarEnvio"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg> Cancelar</button>
      <button class="btn-send" id="btnEnviarPedido"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg> Enviar</button>
    </div>
  </div>
</div>

<div class="bottom-sheet">
  <div class="handle"></div>
  <div class="info-row">
    <div class="info-col"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#1f2937" stroke-width="2"><path d="M7 12a2 2 0 1 0 0 0M17 7a2 2 0 1 0 0 0M9 12l6-5"/></svg><div><div class="label">DISTANCIA</div><div class="value" id="txt-distancia">—</div></div></div>
    <div class="divider"></div>
    <div class="info-col"><div style="width:12px;height:12px;border:1.5px solid #1f2937;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:6px">$</div><div><div class="label">PRECIO ESTIMADO</div><div class="value price-neon" id="txt-precio">—</div></div></div>
  </div>

  <div class="btn-row">
    <button class="btn-tipo aliados active" id="btnAliados"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg> ALIADOS</button>
    <button class="btn-tipo clientes inactive" id="btnClientes"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg> CLIENTES NUEVOS</button>
  </div>

  <div class="btn-row">
    <button class="btn-serv active" id="btnRecoger"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg> RECOGER</button>
    <button class="btn-serv" id="btnComprar"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg> COMPRAR</button>
  </div>

  <div class="form-box active" id="form-aliados-recoger">
    <div class="label">ALIADO</div>
    <div class="input-wrap">
      <input type="text" id="inputAliado" class="input-mini" placeholder="Seleccionar aliado..." autocomplete="off">
      <button class="btn-x" id="x-aliado" onclick="clearField('inputAliado','x-aliado')">✕</button>
      <div class="suggestions" id="sugAliados"></div>
    </div>
    <div class="card-aliado" id="cardAliadoInfo">
      <div class="row"><b>DIR:</b><span id="aliadoDir">—</span></div>
      <div class="row"><b>TEL:</b><span id="aliadoTel">—</span></div>
    </div>
    <div class="label">DIRECCIÓN DE ENTREGA</div>
    <div class="input-wrap">
      <input type="text" id="inputEntregaDirecta" class="input-mini" placeholder="Escribe dirección de entrega..." autocomplete="off">
      <button class="btn-x" id="x-entrega" onclick="clearField('inputEntregaDirecta','x-entrega')">✕</button>
    </div>
    <div class="label">NOMBRE CLIENTE</div>
    <div class="input-wrap">
      <input type="text" id="nombreCliente" class="input-mini" placeholder="Nombre del cliente">
      <button class="btn-x" id="x-nombre" onclick="clearField('nombreCliente','x-nombre')">✕</button>
    </div>
    <div class="label">CELULAR CLIENTE</div>
    <div class="input-wrap">
      <input type="tel" id="celularCliente" class="input-mini" placeholder="Celular del cliente">
      <button class="btn-x" id="x-cel" onclick="clearField('celularCliente','x-cel')">✕</button>
    </div>
    <div class="label" style="margin-top:6px">TIEMPO DE RECOGIDA</div>
    <div style="display:flex;gap:4px;flex-wrap:wrap;margin:4px 0">
      <button type="button" class="time-chip" data-time="5">5 min</button>
      <button type="button" class="time-chip" data-time="10">10 min</button>
      <button type="button" class="time-chip" data-time="15">15 min</button>
      <button type="button" class="time-chip" data-time="20">20 min</button>
      <button type="button" class="time-chip" data-time="25">25 min</button>
    </div>
    <div class="input-wrap">
      <input type="text" id="tiempoManual" class="input-mini" placeholder="O escribe: lo antes posible">
      <button class="btn-x" id="x-tiempo" onclick="clearField('tiempoManual','x-tiempo')">✕</button>
    </div>
    <!-- NUEVO CUADRO DE PRECIO MANUAL -->
    <div class="label" style="margin-top:6px">PRECIO</div>
    <div class="input-wrap">
      <input type="number" id="precioManual" class="input-mini" placeholder="$0">
      <button class="btn-x" id="x-precio" onclick="clearField('precioManual','x-precio')">✕</button>
    </div>
  </div>

  <div class="form-box" id="form-aliados-comprar"></div>
  <div class="form-box" id="form-nuevos-recoger"></div>
  <div class="form-box" id="form-nuevos-comprar"></div>

  <button class="btn-continuar" id="btnContinuar" disabled><span>Continuar</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M5 12h12M12 5l7 7-7 7"/></svg></button>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDGTYI2ZZnP49DbaMIpRSoGIjZrU6RAEiE",
  authDomain: "historial-kigo-xpress.firebaseapp.com",
  databaseURL: "https://historial-kigo-xpress-default-rtdb.firebaseio.com",
  projectId: "historial-kigo-xpress",
  storageBucket: "historial-kigo-xpress.firebasestorage.app",
  messagingSenderId: "571399920545",
  appId: "1:571399920545:web:aa16407753b43cbe2e89e0"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
let aliadosDB = []; let aliadoSeleccionado = null; let repartidoresDB = [];
db.ref('aliados').on('value', snap=>{
  aliadosDB = []; snap.forEach(child=>{ if(child.key==='_init') return; let d=child.val(); d.key=child.key; aliadosDB.push(d); });
});
db.ref('repartidores').on('value', snap=>{
  repartidoresDB = []; const sel=document.getElementById('selectRepartidor');
  sel.innerHTML=''; let has=false;
  snap.forEach(child=>{
    if(child.key==='_init') return; has=true;
    let d=child.val(); d.key=child.key; repartidoresDB.push(d);
    const opt=document.createElement('option');
    opt.value=child.key; opt.textContent=d.nombre||child.key;
    sel.appendChild(opt);
  });
  if(!has){ sel.innerHTML='<option value="">No hay repartidores (crea en Firebase)</option>'; }
});

let map, directionsService, directionsRenderer, markerRecogida=null, markerEntrega=null, placeRecogida=null, placeEntrega=null, autocompleteEntregaDirecta;

window.initMap = function(){
  const dolores={lat:21.157,lng:-100.934};
  map=new google.maps.Map(document.getElementById("map"),{center:dolores,zoom:14,disableDefaultUI:true});
  directionsService=new google.maps.DirectionsService();
  directionsRenderer=new google.maps.DirectionsRenderer({map:map,suppressMarkers:true,polylineOptions:{strokeColor:"#e30613",strokeWeight:4,strokeOpacity:0.9}});
  const opts={componentRestrictions:{country:"mx"},fields:["formatted_address","geometry","name"]};
  autocompleteEntregaDirecta=new google.maps.places.Autocomplete(document.getElementById("inputEntregaDirecta"),opts);
  autocompleteEntregaDirecta.addListener("place_changed",()=>{
    let p=autocompleteEntregaDirecta.getPlace();
    if(p.geometry){
      placeEntrega=p;
      document.getElementById('x-entrega').classList.add('show');
      const pos=p.geometry.location;
      if(markerEntrega) markerEntrega.setMap(null);
      markerEntrega=new google.maps.Marker({position:pos,map:map,icon:{url:"https://maps.google.com/mapfiles/ms/icons/green-dot.png",scaledSize:new google.maps.Size(32,32),anchor:new google.maps.Point(16,32)}});
      if(placeRecogida){ calcularRuta(); } else { map.setCenter(pos); map.setZoom(15); }
    }
  });
}
function calcularRuta(){
  if(!placeRecogida||!placeEntrega) return;
  directionsService.route({origin:placeRecogida.geometry.location,destination:placeEntrega.geometry.location,travelMode:google.maps.TravelMode.DRIVING},(result,status)=>{
    if(status==="OK"){
      directionsRenderer.setDirections(result);
      const leg=result.routes[0].legs[0];
      const km=(leg.distance.value/1000).toFixed(1);
      const precio=Math.round(km*22+30);
      document.getElementById("txt-distancia").textContent=km+" km • "+leg.duration.text;
      document.getElementById("txt-precio").textContent="$"+precio+" MXN";
      document.getElementById("precioManual").value=precio;
      document.getElementById("x-precio").classList.add('show');
      document.getElementById("btnContinuar").disabled=false;
      window._datos={km:km,duracion:leg.duration.text,precio:precio};
      const bounds = new google.maps.LatLngBounds();
      bounds.extend(placeRecogida.geometry.location);
      bounds.extend(placeEntrega.geometry.location);
      map.fitBounds(bounds);
    }
  });
}
function clearField(inputId, xId){
  document.getElementById(inputId).value='';
  document.getElementById(xId).classList.remove('show');
  document.getElementById(inputId).focus();
  if(inputId==='inputAliado'){
    aliadoSeleccionado=null;
    if(markerRecogida){markerRecogida.setMap(null); placeRecogida=null;}
    document.getElementById('cardAliadoInfo').classList.remove('show');
  }
  if(inputId==='inputEntregaDirecta'){ if(markerEntrega){markerEntrega.setMap(null); placeEntrega=null;} document.getElementById("txt-distancia").textContent="—"; document.getElementById("txt-precio").textContent="—"; }
}
['inputAliado','inputEntregaDirecta','nombreCliente','celularCliente','tiempoManual','precioManual'].forEach(id=>{
  let el=document.getElementById(id); if(!el) return;
  el.addEventListener('input',()=>{
    let mapX={inputAliado:'x-aliado',inputEntregaDirecta:'x-entrega',nombreCliente:'x-nombre',celularCliente:'x-cel',tiempoManual:'x-tiempo',precioManual:'x-precio'};
    let xid=mapX[id];
    if(document.getElementById(id).value.length>0) document.getElementById(xid).classList.add('show'); else document.getElementById(xid).classList.remove('show');
    if(id==='inputAliado') filtrarAliados();
  });
});
function filtrarAliados(){
  const q=document.getElementById('inputAliado').value.toLowerCase().trim();
  const sug=document.getElementById('sugAliados');
  if(q.length===0){ sug.style.display='none'; return; }
  const fil=aliadosDB.filter(a=>(a.nombre||'').toLowerCase().includes(q));
  if(fil.length>0){
    sug.innerHTML=fil.map(a=>`<div style="padding:6px 10px;font-size:10px;cursor:pointer;border-bottom:1px solid #f5f5f5" onclick="seleccionarAliado('${a.key}')"><b>${a.nombre}</b><br><small style="color:#888">${a.direccion||''}</small></div>`).join('');
    sug.style.display='block';
  }else{ sug.style.display='none'; }
}
function seleccionarAliado(key){
  const aliado=aliadosDB.find(a=>a.key===key);
  if(!aliado) return;
  aliadoSeleccionado=aliado;
  document.getElementById('inputAliado').value=aliado.nombre;
  document.getElementById('sugAliados').style.display='none';
  document.getElementById('x-aliado').classList.add('show');
  document.getElementById('aliadoDir').textContent = aliado.direccion || 'Sin dirección';
  document.getElementById('aliadoTel').textContent = aliado.telefono || 'Sin teléfono';
  document.getElementById('cardAliadoInfo').classList.add('show');
  if(aliado.lat && aliado.lng){
    const pos=new google.maps.LatLng(parseFloat(aliado.lat), parseFloat(aliado.lng));
    placeRecogida={geometry:{location:pos}};
    if(markerRecogida) markerRecogida.setMap(null);
    markerRecogida=new google.maps.Marker({position:pos,map:map,title:aliado.nombre,icon:{url:"https://maps.google.com/mapfiles/ms/icons/red-dot.png",scaledSize:new google.maps.Size(32,32),anchor:new google.maps.Point(16,32)}});
    map.setCenter(pos); map.setZoom(15);
    if(placeEntrega) calcularRuta();
  }
}
document.querySelectorAll('.time-chip').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.time-chip').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tiempoManual').value = btn.dataset.time + ' minutos';
    document.getElementById('x-tiempo').classList.add('show');
  });
});
let tipoCliente='aliados', tipoServicio='recoger';
function actualizarForm(){
  document.querySelectorAll('.form-box').forEach(f=>f.classList.remove('active'));
  const el=document.getElementById(`form-${tipoCliente}-${tipoServicio}`);
  if(el) el.classList.add('active');
}
document.getElementById('btnAliados').onclick=()=>{tipoCliente='aliados';document.getElementById('btnAliados').classList.remove('inactive');document.getElementById('btnAliados').classList.add('active');document.getElementById('btnClientes').classList.add('inactive');document.getElementById('btnClientes').classList.remove('active');actualizarForm();};
document.getElementById('btnClientes').onclick=()=>{tipoCliente='nuevos';document.getElementById('btnClientes').classList.remove('inactive');document.getElementById('btnClientes').classList.add('active');document.getElementById('btnAliados').classList.add('inactive');document.getElementById('btnAliados').classList.remove('active');actualizarForm();};
document.getElementById('btnRecoger').onclick=()=>{tipoServicio='recoger';document.getElementById('btnRecoger').classList.add('active');document.getElementById('btnComprar').classList.remove('active');actualizarForm();};
document.getElementById('btnComprar').onclick=()=>{tipoServicio='comprar';document.getElementById('btnComprar').classList.add('active');document.getElementById('btnRecoger').classList.remove('active');actualizarForm();};
document.getElementById("btnCenter").addEventListener("click",()=>{if(map){map.setCenter({lat:21.157,lng:-100.934});map.setZoom(14);}});

// CONTINUAR -> MOSTRAR TARJETA REPARTIDOR
document.getElementById("btnContinuar").addEventListener("click",()=>{
  if(!aliadoSeleccionado && document.getElementById('inputAliado').value.trim()===''){ alert("Selecciona un aliado"); return; }
  if(!placeEntrega){ alert("Selecciona dirección de entrega"); return; }
  document.getElementById("modalRepartidor").classList.add("show");
});
document.getElementById("btnCancelarEnvio").addEventListener("click",()=>{
  document.getElementById("modalRepartidor").classList.remove("show");
});
document.getElementById("btnEnviarPedido").addEventListener("click",()=>{
  const selRepa=document.getElementById("selectRepartidor").value;
  if(!selRepa){ alert("Selecciona un repartidor"); return; }
  const repaData=repartidoresDB.find(r=>r.key===selRepa);
  const precioFinal= document.getElementById("precioManual").value || (window._datos?window._datos.precio:0);
  let pedido={
    aliado: aliadoSeleccionado?aliadoSeleccionado.nombre:document.getElementById('inputAliado').value,
    aliadoDir: aliadoSeleccionado?aliadoSeleccionado.direccion:'',
    aliadoTel: aliadoSeleccionado?aliadoSeleccionado.telefono:'',
    aliadoLat: aliadoSeleccionado?aliadoSeleccionado.lat:'',
    aliadoLng: aliadoSeleccionado?aliadoSeleccionado.lng:'',
    entrega: document.getElementById('inputEntregaDirecta').value,
    cliente: document.getElementById('nombreCliente').value,
    celular: document.getElementById('celularCliente').value,
    tiempo: document.getElementById('tiempoManual').value,
    precio: parseInt(precioFinal),
    distancia: window._datos?window._datos.km:null,
    duracion: window._datos?window._datos.duracion:null,
    repartidor: repaData?repaData.nombre:selRepa,
    repartidorKey: selRepa,
    status:'asignado',
    timestamp:Date.now(),
    tipo:'aliados-recoger'
  };
  db.ref('pedidos').push(pedido).then(()=>{
    document.getElementById("modalRepartidor").classList.remove("show");
    alert("Pedido enviado a "+pedido.repartidor);
  });
});
</script>
