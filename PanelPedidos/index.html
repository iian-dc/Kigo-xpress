<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kigo Xpress</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCTV1sm6McEIkv-cheaVFCD_svp_a--6wg&libraries=places&callback=initMap" async defer></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{height:100dvh;overflow:hidden;display:flex;flex-direction:column;background:#fff}
#map{flex:1;position:relative;background:#e5e3df;min-height:38vh}
.logo-overlay{position:absolute;top:0;left:50%;transform:translateX(-50%);background:#fff;padding:2px 14px 5px;border-radius:0 0 12px 12px;z-index:10;box-shadow:0 2px 10px rgba(0,0,0,.15);text-align:center;min-width:170px}
.logo-text{font-family:'Dancing Script',cursive;font-size:19px;font-weight:700;line-height:1}
.logo-text.red{color:#e30613}.logo-text.black{color:#000}
.sublogo{font-size:6.5px;letter-spacing:1.4px;font-weight:700;color:#000;margin-top:1px}
.center-btn{position:absolute;bottom:16px;right:12px;z-index:10;width:42px;height:42px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.25);border:0;cursor:pointer}
.bottom-sheet{background:#fff;border-radius:20px 20px 0 0;margin-top:-14px;z-index:20;padding:10px 14px 16px;box-shadow:0 -6px 24px rgba(0,0,0,.15);overflow-y:auto;max-height:62vh}
.handle{width:36px;height:4px;background:#d1d5db;border-radius:10px;margin:0 auto 10px}
.info-row{ display:flex; background:#fff; border:1.5px solid #f3f4f6; border-radius:12px; padding:6px 8px; margin:0 0 8px; gap:8px; align-items:center }
.info-col{flex:1;display:flex;align-items:center;gap:6px}.info-col.label{font-size:7px}
.value{font-size:11px;font-weight:700;color:#1f2937}.value.price-neon{color:#00c853; font-weight:800; text-shadow:0 0 8px rgba(0,255,136,0.3)}
.divider{width:1px;background:#eee;height:20px}
.btn-row{display:flex;gap:6px;margin-bottom:6px}
.btn-tipo{flex:1;border:0;border-radius:10px;padding:8px;font-size:10px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px}
.btn-tipo.aliados{background:#e30613;color:#fff}.btn-tipo.clientes{background:#111;color:#fff}.btn-tipo.inactive{opacity:.35}
.btn-serv{flex:1;border:1.5px solid #e5e7eb;background:#fff;border-radius:10px;padding:8px;font-size:10px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px}
.btn-serv.active{background:#111;color:#fff;border-color:#111}

/* INPUT COMPACTO CON X */
.input-wrap{position:relative;margin-bottom:6px}
.input-mini{width:100%;border:1.2px solid #e5e7eb;border-radius:10px;padding:8px 34px 8px 10px;font-size:12px;outline:none;height:36px;background:#fff}
.input-mini:focus{border-color:#e30613}
.btn-x{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:22px;height:22px;border-radius:50%;border:0;background:#f3f4f6;display:none;align-items:center;justify-content:center;cursor:pointer;font-size:11px;font-weight:700;color:#6b7280;z-index:2}
.btn-x.show{display:flex}
.suggestions{position:absolute;top:100%;left:0;right:0;background:#fff;border-radius:10px;box-shadow:0 8px 20px rgba(0,0,0,.15);max-height:150px;overflow-y:auto;z-index:30;display:none;margin-top:3px;border:1px solid #eee}
.btn-continuar{background:#e30613;color:#fff;border:0;border-radius:50px;padding:11px;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;cursor:pointer;margin-top:8px}.btn-continuar:disabled{background:#fca5a5}
.form-box{display:none}.form-box.active{display:block}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:none;align-items:flex-end}.modal.active{display:flex}.modal-content{background:#fff;width:100%;border-radius:20px 20px 0 0;padding:16px;max-height:85vh;overflow:auto}
.input-wrapper{position:relative;display:flex;align-items:center}
.input-wrapper input{width:100%;padding:12px 40px 12px 13px;border:2px solid #e5e7eb;border-radius:12px;font-size:14px;margin:10px 0;outline:none}
.clear-x{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;border:0;background:#f3f4f6;display:none;align-items:center;justify-content:center;cursor:pointer;font-size:14px;font-weight:700;color:#6b7280}
.clear-x.show{display:flex}
.pac-container{z-index:200!important;border-radius:10px}
@media (max-width: 768px){#map{flex:none;height:40vh;min-height:40vh}.bottom-sheet{flex:1;max-height:60vh}}
</style>
</head>
<body>
<div id="map">
  <div class="logo-overlay"><div class="logo-text"><span class="black">Kigo</span> <span class="red">Xpress</span></div><div class="sublogo">LA SOLUCIÓN A TU ALCANCE</div></div>
  <button class="center-btn" id="btnCenter"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2"/></svg></button>
</div>

<div class="bottom-sheet">
  <div class="handle"></div>
  <div class="info-row">
    <div class="info-col"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1f2937" stroke-width="2"><path d="M7 12a2 2 0 1 0 0 0M17 7a2 2 0 1 0 0 0M9 12l6-5"/></svg><div><div class="label">DISTANCIA</div><div class="value" id="txt-distancia">—</div></div></div>
    <div class="divider"></div>
    <div class="info-col"><div style="width:14px;height:14px;border:1.5px solid #1f2937;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:7px">$</div><div><div class="label">PRECIO ESTIMADO</div><div class="value price-neon" id="txt-precio">—</div></div></div>
  </div>

  <div class="btn-row">
    <button class="btn-tipo aliados active" id="btnAliados"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg> ALIADOS</button>
    <button class="btn-tipo clientes inactive" id="btnClientes"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg> CLIENTES NUEVOS</button>
  </div>
  <div class="btn-row">
    <button class="btn-serv active" id="btnRecoger"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg> RECOGER</button>
    <button class="btn-serv" id="btnComprar"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg> COMPRAR</button>
  </div>

  <!-- ALIADOS RECOGER - NUEVO COMPACTO -->
  <div class="form-box active" id="form-aliados-recoger">
    <div class="label" style="font-size:7px;margin-bottom:3px">ALIADO</div>
    <div class="input-wrap">
      <input type="text" id="inputAliado" class="input-mini" placeholder="Seleccionar aliado registrado..." autocomplete="off">
      <button class="btn-x" id="x-aliado" onclick="clearField('inputAliado','x-aliado')">✕</button>
      <div class="suggestions" id="sugAliados"></div>
    </div>

    <div class="label" style="font-size:7px;margin-bottom:3px">DIRECCIÓN DE ENTREGA</div>
    <div class="input-wrap">
      <input type="text" id="inputEntregaDirecta" class="input-mini" placeholder="Escribe dirección de entrega..." autocomplete="off">
      <button class="btn-x" id="x-entrega" onclick="clearField('inputEntregaDirecta','x-entrega')">✕</button>
    </div>

    <div class="label" style="font-size:7px;margin-bottom:3px">NOMBRE CLIENTE</div>
    <div class="input-wrap">
      <input type="text" id="nombreCliente" class="input-mini" placeholder="Nombre del cliente">
      <button class="btn-x" id="x-nombre" onclick="clearField('nombreCliente','x-nombre')">✕</button>
    </div>

    <div class="label" style="font-size:7px;margin-bottom:3px">CELULAR CLIENTE</div>
    <div class="input-wrap">
      <input type="tel" id="celularCliente" class="input-mini" placeholder="Celular del cliente">
      <button class="btn-x" id="x-cel" onclick="clearField('celularCliente','x-cel')">✕</button>
    </div>

    <div class="label" style="font-size:7px;margin:6px 0 3px">TIEMPO DE RECOGIDA</div>
    <div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:4px">
      <button type="button" class="time-chip" data-time="5" style="border:1px solid #e5e7eb;background:#fff;border-radius:20px;padding:4px 10px;font-size:10px;font-weight:700">5 min</button>
      <button type="button" class="time-chip" data-time="10" style="border:1px solid #e5e7eb;background:#fff;border-radius:20px;padding:4px 10px;font-size:10px;font-weight:700">10 min</button>
      <button type="button" class="time-chip" data-time="15" style="border:1px solid #e5e7eb;background:#fff;border-radius:20px;padding:4px 10px;font-size:10px;font-weight:700">15 min</button>
      <button type="button" class="time-chip" data-time="20" style="border:1px solid #e5e7eb;background:#fff;border-radius:20px;padding:4px 10px;font-size:10px;font-weight:700">20 min</button>
      <button type="button" class="time-chip" data-time="25" style="border:1px solid #e5e7eb;background:#fff;border-radius:20px;padding:4px 10px;font-size:10px;font-weight:700">25 min</button>
    </div>
    <div class="input-wrap">
      <input type="text" id="tiempoManual" class="input-mini" placeholder="O escribe manual: ej. lo antes posible">
      <button class="btn-x" id="x-tiempo" onclick="clearField('tiempoManual','x-tiempo')">✕</button>
    </div>
  </div>

  <div class="form-box" id="form-aliados-comprar"><div class="label">Proximamente - Aliados Comprar</div></div>
  <div class="form-box" id="form-nuevos-recoger"><div class="label">Proximamente - Nuevos Recoger</div></div>
  <div class="form-box" id="form-nuevos-comprar"><div class="label">Proximamente - Nuevos Comprar</div></div>

  <button class="btn-continuar" id="btnContinuar" disabled><span>Continuar</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M5 12h12M12 5l7 7-7 7"/></svg></button>
</div>

<div class="modal" id="modal-entrega"><div class="modal-content"><div style="display:flex;justify-content:space-between"><h3 style="font-size:15px">Dirección de entrega</h3><button onclick="cerrarModal('entrega')" style="border:0;background:#f3f4f6;width:28px;height:28px;border-radius:50%">✕</button></div><div class="input-wrapper"><input type="text" id="input-entrega-modal" placeholder="Busca..." oninput="toggleClear('entrega')"><button class="clear-x" id="clear-entrega" onclick="limpiarInput('entrega')">✕</button></div><button class="btn-continuar" onclick="confirmarDireccionModal()">Guardar entrega</button></div></div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDGTYI2ZZnP49DbaMIpRSoGIjZrU6RAEiE",
  authDomain: "historial-kigo-xpress.firebaseapp.com",
  databaseURL: "https://historial-kigo-xpress-default-rtdb.firebaseio.com",
  projectId: "historial-kigo-xpress",
  storageBucket: "historial-kigo-xpress.firebasestorage.app",
  messagingSenderId: "571399920545",
  appId: "1:571399920545:web:aa16407753b43cbe2e89e0"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// CREAR CARPETA ALIADOS AUTOMATICAMENTE SI NO EXISTE
db.ref('aliados').once('value').then(snap=>{
  if(!snap.exists()){
    db.ref('aliados/_init').set({nombre:"EJEMPLO - Borrame",direccion:"Calle ejemplo 123",lat:21.1557,lng:-100.934});
    console.log("Carpeta aliados creada");
  }
});

let aliadosDB = [];
let aliadoSeleccionado = null;
db.ref('aliados').on('value', snap=>{
  aliadosDB = [];
  snap.forEach(child=>{
    if(child.key==='_init') return;
    let d=child.val(); d.key=child.key; aliadosDB.push(d);
  });
});

let map, directionsService, directionsRenderer, markerRecogida=null, markerEntrega=null, placeRecogida=null, placeEntrega=null, autocompleteEntregaDirecta;
function initMap(){
  const dolores={lat:21.1557,lng:-100.934};
  map=new google.maps.Map(document.getElementById("map"),{center:dolores,zoom:14,disableDefaultUI:true});
  directionsService=new google.maps.DirectionsService();
  directionsRenderer=new google.maps.DirectionsRenderer({map:map,suppressMarkers:true,polylineOptions:{strokeColor:"#e30613",strokeWeight:5,strokeOpacity:0.9}});
  // Autocomplete directo en el input de entrega sin modal
  const opts={componentRestrictions:{country:"mx"},fields:["formatted_address","geometry","name"]};
  autocompleteEntregaDirecta=new google.maps.places.Autocomplete(document.getElementById("inputEntregaDirecta"),opts);
  autocompleteEntregaDirecta.addListener("place_changed",()=>{
    let p=autocompleteEntregaDirecta.getPlace();
    if(p.geometry){
      placeEntrega=p;
      showX('x-entrega');
      const pos=p.geometry.location;
      if(markerEntrega) markerEntrega.setMap(null);
      markerEntrega=new google.maps.Marker({position:pos,map:map,icon:{path:google.maps.SymbolPath.CIRCLE,scale:10,fillColor:"#149414",fillOpacity:1,strokeColor:"#fff",strokeWeight:2}});
      map.setCenter(pos); map.setZoom(15);
      if(placeRecogida) calcularRuta();
    }
  });
  // Para modal respaldo
  let autoModal=new google.maps.places.Autocomplete(document.getElementById("input-entrega-modal"),opts);
  autoModal.addListener("place_changed",()=>{ window._placeModal=autoModal.getPlace(); });
}
function calcularRuta(){
  if(!placeRecogida||!placeEntrega) return;
  directionsService.route({origin:placeRecogida.geometry.location,destination:placeEntrega.geometry.location,travelMode:google.maps.TravelMode.DRIVING},(result,status)=>{
    if(status==="OK"){
      directionsRenderer.setDirections(result);
      const leg=result.routes[0].legs[0];
      const km=(leg.distance.value/1000).toFixed(1);
      const precio=Math.round(km*22+30);
      document.getElementById("txt-distancia").textContent=km+" km • "+leg.duration.text;
      document.getElementById("txt-precio").textContent="$"+precio+" MXN";
      document.getElementById("btnContinuar").disabled=false;
      window._datos={km:km,duracion:leg.duration.text,precio:precio};
    }
  });
}
// X GENERICA
function showX(id){ document.getElementById(id).classList.add('show'); }
function hideX(id){ document.getElementById(id).classList.remove('show'); }
function clearField(inputId, xId){
  document.getElementById(inputId).value='';
  hideX(xId);
  document.getElementById(inputId).focus();
  if(inputId==='inputAliado'){ aliadoSeleccionado=null; if(markerRecogida){markerRecogida.setMap(null); placeRecogida=null;} }
  if(inputId==='inputEntregaDirecta'){ if(markerEntrega){markerEntrega.setMap(null); placeEntrega=null;} document.getElementById("txt-distancia").textContent="—"; document.getElementById("txt-precio").textContent="—"; }
}
['inputAliado','inputEntregaDirecta','nombreCliente','celularCliente','tiempoManual'].forEach(id=>{
  let el=document.getElementById(id);
  if(!el) return;
  el.addEventListener('input',()=>{
    let xId='x-'+id.split('input')[1]?.toLowerCase() || 'x-'+id;
    // mapeo
    let mapX={inputAliado:'x-aliado',inputEntregaDirecta:'x-entrega',nombreCliente:'x-nombre',celularCliente:'x-cel',tiempoManual:'x-tiempo'};
    let xid=mapX[id]||'';
    if(el.value.length>0) showX(xid); else hideX(xid);
    if(id==='inputAliado') filtrarAliados();
  });
});
function filtrarAliados(){
  const q=document.getElementById('inputAliado').value.toLowerCase().trim();
  const sug=document.getElementById('sugAliados');
  if(q.length===0){ sug.style.display='none'; return; }
  const fil=aliadosDB.filter(a=>(a.nombre||'').toLowerCase().includes(q));
  if(fil.length>0){
    sug.innerHTML=fil.map(a=>`<div style="padding:8px 10px;font-size:11px;cursor:pointer;border-bottom:1px solid #f5f5f5" onclick="seleccionarAliado('${a.key}')"><b>${a.nombre}</b><br><small style="color:#888">${a.direccion||''}</small></div>`).join('');
    sug.style.display='block';
  }else{ sug.style.display='none'; }
}
function seleccionarAliado(key){
  const aliado=aliadosDB.find(a=>a.key===key);
  if(!aliado) return;
  aliadoSeleccionado=aliado;
  document.getElementById('inputAliado').value=aliado.nombre;
  document.getElementById('sugAliados').style.display='none';
  showX('x-aliado');
  if(aliado.lat && aliado.lng){
    const pos=new google.maps.LatLng(aliado.lat, aliado.lng);
    placeRecogida={geometry:{location:pos}};
    if(markerRecogida) markerRecogida.setMap(null);
    markerRecogida=new google.maps.Marker({position:pos,map:map,icon:{path:google.maps.SymbolPath.CIRCLE,scale:10,fillColor:"#e30613",fillOpacity:1,strokeColor:"#fff",strokeWeight:2}});
    map.setCenter(pos); map.setZoom(15);
    if(placeEntrega) calcularRuta();
  }
}
document.querySelectorAll('.time-chip').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.time-chip').forEach(b=>{b.style.background='#fff';b.style.color='#111';});
    btn.style.background='#e30613';btn.style.color='#fff';
    document.getElementById('tiempoManual').value = btn.dataset.time + ' minutos';
    showX('x-tiempo');
  });
});
function actualizarForm(){
  document.querySelectorAll('.form-box').forEach(f=>f.classList.remove('active'));
  const id=`form-${tipoCliente}-${tipoServicio}`;
  const el=document.getElementById(id);
  if(el) el.classList.add('active');
}
let tipoCliente='aliados', tipoServicio='recoger';
document.getElementById('btnAliados').onclick=()=>{tipoCliente='aliados';document.getElementById('btnAliados').classList.remove('inactive');document.getElementById('btnAliados').classList.add('active');document.getElementById('btnClientes').classList.add('inactive');document.getElementById('btnClientes').classList.remove('active');actualizarForm();};
document.getElementById('btnClientes').onclick=()=>{tipoCliente='nuevos';document.getElementById('btnClientes').classList.remove('inactive');document.getElementById('btnClientes').classList.add('active');document.getElementById('btnAliados').classList.add('inactive');document.getElementById('btnAliados').classList.remove('active');actualizarForm();};
document.getElementById('btnRecoger').onclick=()=>{tipoServicio='recoger';document.getElementById('btnRecoger').classList.add('active');document.getElementById('btnComprar').classList.remove('active');actualizarForm();};
document.getElementById('btnComprar').onclick=()=>{tipoServicio='comprar';document.getElementById('btnComprar').classList.add('active');document.getElementById('btnRecoger').classList.remove('active');actualizarForm();};
document.getElementById("btnCenter").addEventListener("click",()=>{map.setCenter({lat:21.1557,lng:-100.934});map.setZoom(14);});
function cerrarModal(t){document.getElementById("modal-"+t).classList.remove("active")}
function confirmarDireccionModal(){
  let p=window._placeModal;
  if(!p||!p.geometry){alert("Selecciona dirección");return;}
  document.getElementById("inputEntregaDirecta").value=p.formatted_address||p.name;
  placeEntrega=p;
  showX('x-entrega');
  cerrarModal('entrega');
  const pos=p.geometry.location;
  if(markerEntrega) markerEntrega.setMap(null);
  markerEntrega=new google.maps.Marker({position:pos,map:map,icon:{path:google.maps.SymbolPath.CIRCLE,scale:10,fillColor:"#149414",fillOpacity:1,strokeColor:"#fff",strokeWeight:2}});
  map.setCenter(pos); map.setZoom(15);
  if(placeRecogida) calcularRuta();
}
document.getElementById("btnContinuar").addEventListener("click",()=>{
  let pedido={
    aliado: aliadoSeleccionado?aliadoSeleccionado.nombre:document.getElementById('inputAliado').value,
    entrega: document.getElementById('inputEntregaDirecta').value,
    cliente: document.getElementById('nombreCliente').value,
    celular: document.getElementById('celularCliente').value,
    tiempo: document.getElementById('tiempoManual').value,
    precio: window._datos?window._datos.precio:null,
    distancia: window._datos?window._datos.km:null,
    status:'pendiente', timestamp:Date.now(), tipo:'aliados-recoger'
  };
  db.ref('pedidos').push(pedido).then(()=>{ alert("Pedido guardado en Firebase! Carpeta aliados creada."); });
});
</script>
</body>
</html>
