<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>KIGO - Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
:root{--orange:#FF3A2A;--black:#111;--gray:#F5F5F5}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',system-ui}
body{background:#F2F2F2}
.app{max-width:460px;margin:0 auto;background:#fff;min-height:100vh;box-shadow:0 0 20px rgba(0,0,0,.06);display:flex;flex-direction:column}

/* TOP SOPORTE */
.top{padding:12px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee;background:#fff;position:sticky;top:0;z-index:50}
.top-left{display:flex;align-items:center;gap:8px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--orange);color:#fff;display:grid;place-items:center;font-weight:900;font-size:16px}
.top-info b{font-size:12px;font-weight:900;display:block}
.top-info span{font-size:9px;color:#888;font-weight:600}
.top-right{display:flex;gap:6px;align-items:center}
.chip{background:var(--black);color:#fff;padding:5px 9px;border-radius:999px;font-size:9px;font-weight:800;display:flex;gap:4px;align-items:center}
.icon-mini{width:32px;height:32px;border-radius:50%;border:1px solid #eee;background:#fff;display:grid;place-items:center;cursor:pointer}

/* CATEGORIAS PEDIDOS / SEGUIMIENTO */
.tabs-main{display:flex;gap:8px;padding:10px 14px;background:#fff;border-bottom:1px solid #eee}
.tab-main{flex:1;padding:10px;border-radius:10px;border:1.5px solid #eee;background:var(--gray);font-weight:900;font-size:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;color:#777}
.tab-main.active{background:var(--black);color:#fff;border-color:var(--black)}

/* PANEL */
.panel{padding:12px 12px 90px}
.label-mini{font-size:8px;font-weight:900;color:#999;letter-spacing:.8px;margin:12px 0 6px 2px;text-transform:uppercase;display:flex;gap:4px;align-items:center}

/* BOTONES ALIADOS / NUEVOS MAS PEQUEÑOS */
.tipo{display:flex;gap:8px}
.btn-tipo{flex:1;padding:9px;border-radius:10px;border:none;font-weight:900;font-size:9px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px}
.btn-tipo.aliados{background:var(--orange);color:#fff}
.btn-tipo.nuevos{background:var(--black);color:#fff}
.btn-tipo.active{box-shadow:0 4px 10px rgba(0,0,0,.18)}

/* SUB RECOGER / COMPRAR PEQUEÑOS */
.sub{display:flex;gap:6px;background:var(--gray);padding:4px;border-radius:12px}
.sub-btn{flex:1;padding:8px;border-radius:8px;border:none;background:transparent;font-weight:800;font-size:9px;color:#888;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px}
.sub-btn.active{background:#fff;color:var(--black);box-shadow:0 2px 6px rgba(0,0,0,.12)}

/* FORMULARIO COMPACTO + X CENTRADA PERFECTO */
.card{background:var(--gray);border-radius:14px;padding:10px;border:1px solid #efefef;margin-top:10px}
.field{margin-bottom:8px}
.field-label{font-size:8px;font-weight:800;color:#666;margin-bottom:4px;margin-left:2px;text-transform:uppercase}
.input-wrap{position:relative;width:100%}
.input-rappi{width:100%;padding:10px 36px 10px 10px;border-radius:9px;border:1.5px solid #fff;background:#fff;font-size:12px;font-weight:600;outline:none}
.input-rappi:focus{border-color:var(--orange)}
.clear-x{
  position:absolute;
  right:6px;
  top:50%;
  transform:translateY(-50%);
  width:22px;height:22px;border-radius:50%;background:#e9e9e9;border:none;
  display:grid;place-items:center;cursor:pointer;color:#666
}
.clear-x i{font-size:14px!important;line-height:1}
.suggestions{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:#fff;border-radius:10px;box-shadow:0 8px 20px rgba(0,0,0,.15);z-index:30;max-height:180px;overflow-y:auto;display:none;border:1px solid #eee}
.suggestions.show{display:block}
.sug{padding:9px 10px;border-bottom:1px solid #f5f5f5;display:flex;gap:8px;cursor:pointer}
.select-rappi{width:100%;padding:10px 10px;border-radius:9px;border:1.5px solid var(--black);background:var(--black);color:#fff;font-weight:800;font-size:11px;outline:none}

.btn-confirm{width:100%;padding:12px;border:none;border-radius:10px;background:var(--orange);color:#fff;font-weight:900;font-size:11px;margin-top:12px;cursor:pointer;display:flex;justify-content:center;gap:6px;box-shadow:0 6px 14px rgba(255,58,42,.3)}
.info-bar{display:flex;justify-content:space-between;background:#111;color:#fff;border-radius:9px;padding:8px 10px;font-size:10px;font-weight:800;margin-top:10px}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="top-left">
      <div class="logo">K</div>
      <div class="top-info"><b id="fecha">HOY</b><span id="subFecha">Dolores Hidalgo</span></div>
    </div>
    <div class="top-right">
      <div class="chip" id="clima"><i class="material-icons" style="font-size:12px">wb_sunny</i> --°</div>
      <button class="icon-mini" onclick="alert('Salir')"><i class="material-icons" style="font-size:16px">logout</i></button>
    </div>
  </div>

  <!-- SOLO 2 CATEGORIAS COMO PEDISTE -->
  <div class="tabs-main">
    <button id="tabPedidos" class="tab-main active" onclick="setMain('pedidos')"><i class="material-icons" style="font-size:14px">receipt_long</i> PEDIDOS</button>
    <button id="tabSeguimiento" class="tab-main" onclick="setMain('seguimiento')"><i class="material-icons" style="font-size:14px">local_shipping</i> SEGUIMIENTO</button>
  </div>

  <div class="panel" id="panelPedidos">
    <div class="label-mini"><i class="material-icons" style="font-size:12px">category</i> TIPO CLIENTE</div>
    <div class="tipo">
      <button id="btnAliados" class="btn-tipo aliados active" onclick="setTipo('aliados')"><i class="material-icons" style="font-size:14px">store</i> ALIADOS</button>
      <button id="btnNuevos" class="btn-tipo nuevos" onclick="setTipo('nuevos')"><i class="material-icons" style="font-size:14px">person_add</i> CLIENTES NUEVOS</button>
    </div>

    <div class="label-mini"><i class="material-icons" style="font-size:12px">local_mall</i> SERVICIO</div>
    <div class="sub">
      <button id="sRecoger" class="sub-btn active" onclick="setSub('recoger')"><i class="material-icons" style="font-size:14px">inventory_2</i> RECOGER</button>
      <button id="sComprar" class="sub-btn" onclick="setSub('comprar')"><i class="material-icons" style="font-size:14px">shopping_bag</i> COMPRAR</button>
    </div>

    <!-- FORM ALIADOS RECOGER COMPACTO -->
    <div id="formRecoger" class="card">
      <div class="field">
        <div class="field-label">Nombre del aliado</div>
        <div class="input-wrap">
          <input id="inAliado" class="input-rappi" placeholder="Toca para ver aliados">
          <button class="clear-x" onclick="clearI('inAliado')"><i class="material-icons">close</i></button>
          <div id="sugAliados" class="suggestions"></div>
        </div>
      </div>
      <div id="aliadoDir" style="font-size:10px;color:#666;background:#fff;padding:6px 8px;border-radius:8px;border:1px dashed #FF3A2A;display:none;margin-bottom:8px"></div>

      <div class="field">
        <div class="field-label">¿Dónde entregar?</div>
        <div class="input-wrap">
          <input id="inEntrega" class="input-rappi" placeholder="Colonia, calle...">
          <button class="clear-x" onclick="clearI('inEntrega')"><i class="material-icons">close</i></button>
        </div>
      </div>

      <div class="field">
        <div class="field-label">Teléfono de entrega</div>
        <div class="input-wrap">
          <input id="inTel" class="input-rappi" type="tel" placeholder="418...">
          <button class="clear-x" onclick="clearI('inTel')"><i class="material-icons">close</i></button>
        </div>
      </div>

      <div class="field">
        <div class="field-label">Tiempo de recoger</div>
        <div class="input-wrap">
          <input id="inTiempo" class="input-rappi" placeholder="5 min, enseguida...">
          <button class="clear-x" onclick="clearI('inTiempo')"><i class="material-icons">close</i></button>
        </div>
      </div>

      <div class="field">
        <div class="field-label">Repartidor asignado</div>
        <select id="selRepa" class="select-rappi"><option>Cargando...</option></select>
      </div>
    </div>

    <div class="info-bar"><span id="txtDist">— km</span><span id="txtPrecio">POR COTIZAR</span></div>
    <button id="btnConfirm" class="btn-confirm"><i class="material-icons" style="font-size:16px">check_circle</i> CONFIRMAR SERVICIO</button>
  </div>

  <div class="panel" id="panelSeguimiento" style="display:none">
    <div style="text-align:center;padding:30px;color:#999"><i class="material-icons" style="font-size:32px">local_shipping</i><div style="font-size:11px;font-weight:800;margin-top:6px">AQUÍ IRA EL SEGUIMIENTO</div></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script>
const firebaseConfig = {apiKey: "AIzaSyDGTYI2ZZnP49DbaMIpRSoGIjZrU6RAEiE", authDomain: "historial-kigo-xpress.firebaseapp.com", databaseURL: "https://historial-kigo-xpress-default-rtdb.firebaseio.com", projectId: "historial-kigo-xpress", storageBucket: "historial-kigo-xpress.firebasestorage.app", messagingSenderId: "571399920545", appId: "1:571399920545:web:aa16407753b43cbe2e89e0"};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();

function setMain(m){
  document.getElementById('tabPedidos').classList.toggle('active', m==='pedidos');
  document.getElementById('tabSeguimiento').classList.toggle('active', m==='seguimiento');
  document.getElementById('panelPedidos').style.display = m==='pedidos'?'block':'none';
  document.getElementById('panelSeguimiento').style.display = m==='seguimiento'?'block':'none';
}
let tipo='aliados', sub='recoger';
function setTipo(t){tipo=t; document.getElementById('btnAliados').classList.toggle('active', t==='aliados'); document.getElementById('btnNuevos').classList.toggle('active', t==='nuevos');}
function setSub(s){sub=s; document.getElementById('sRecoger').classList.toggle('active', s==='recoger'); document.getElementById('sComprar').classList.toggle('active', s==='comprar');}
function clearI(id){document.getElementById(id).value=''; if(id==='inAliado') document.getElementById('aliadoDir').style.display='none';}

let clientes=[];
db.ref('kigo_clientes').on('value', s=>{clientes=Object.values(s.val()||{});});
db.ref('kigoRepasFull').on('value', s=>{
  const v=s.val()||{}; const keys=Object.keys(v);
  const sel=document.getElementById('selRepa');
  sel.innerHTML='<option value="">-- Selecciona repartidor --</option>'+keys.map(k=>`<option value="${k}">${k}</option>`).join('')+'<option value="__todos__">TODOS</option>';
});
function renderAliados(f=''){
  const c=document.getElementById('sugAliados'); c.innerHTML='';
  let lista=clientes.filter(x=>x.nombre.toLowerCase().includes(f.toLowerCase())).slice(0,8);
  if(!lista.length){c.innerHTML='<div style="padding:10px;text-align:center;font-size:10px;color:#888">Sin aliados</div>'; c.classList.add('show'); return;}
  lista.forEach(cl=>{
    const d=document.createElement('div'); d.className='sug';
    d.innerHTML=`<i class="material-icons" style="font-size:16px;color:#FF3A2A">store</i><div><div style="font-weight:800;font-size:11px">${cl.nombre}</div><div style="font-size:9px;color:#888">${(cl.direccion||'').substring(0,50)}</div></div>`;
    d.onclick=()=>{document.getElementById('inAliado').value=cl.nombre; document.getElementById('aliadoDir').style.display='block'; document.getElementById('aliadoDir').innerText='📍 '+cl.direccion; c.classList.remove('show');};
    c.appendChild(d);
  });
  c.classList.add('show');
}
document.getElementById('inAliado').addEventListener('focus', e=>renderAliados(e.target.value));
document.getElementById('inAliado').addEventListener('input', e=>renderAliados(e.target.value));
document.addEventListener('click', e=>{ if(!e.target.closest('.input-wrap')) document.getElementById('sugAliados').classList.remove('show'); });

// fecha y clima
const hoy=new Date(); document.getElementById('fecha').innerText=hoy.toLocaleDateString('es-MX',{weekday:'short', day:'numeric', month:'short'}).toUpperCase();
fetch(`https://api.open-meteo.com/v1/forecast?latitude=21.1561&longitude=-100.9333&current=temperature_2m&timezone=America/Mexico_City`).then(r=>r.json()).then(d=>{document.getElementById('clima').innerHTML=`<i class="material-icons" style="font-size:12px">wb_sunny</i> ${Math.round(d.current.temperature_2m)}°`; document.getElementById('subFecha').innerText=`${Math.round(d.current.temperature_2m)}°C • Dolores Hidalgo`;});

document.getElementById('btnConfirm').onclick=()=>{
  const aliado=document.getElementById('inAliado').value, entrega=document.getElementById('inEntrega').value, tel=document.getElementById('inTel').value, tiempo=document.getElementById('inTiempo').value, repa=document.getElementById('selRepa').value;
  if(!aliado||!entrega) return alert('Completa aliado y entrega');
  if(!repa) return alert('Selecciona repartidor');
  db.ref('kigo_pedidos').push({recogerEn:aliado, entregarEn:entrega, telefono:tel, tiempo, estado:'pendiente', repaAsignado:repa, fecha:new Date().toLocaleString(), timestamp:Date.now()}).then(snap=>{
    db.ref('kigoPedidosLive').push({cliente:aliado, dirRecogida:aliado, entrega, telefono, repaAsignado:repa, subEtapa:'pendiente', adminKey:snap.key, ts:Date.now()});
    alert('✅ Pedido enviado'); clearI('inAliado'); clearI('inEntrega'); clearI('inTel'); clearI('inTiempo');
  });
};
</script>
</body>
</html>
