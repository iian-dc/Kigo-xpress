<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Kigo Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#0a0a0a;color:#fff;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.top{height:38px;background:#fff;color:#0a0a0a;display:flex;justify-content:space-between;align-items:center;padding:0 12px}
.top b{font-size:9px;font-weight:900;letter-spacing:.3px}
.top span{font-size:8px;font-weight:800;color:#6b7280}
.top-right{background:#0a0a0a;color:#fff;padding:4px 10px;border-radius:999px;font-size:8px;font-weight:900;display:flex;align-items:center;gap:4px}
.map{flex:1;background:#e5e7eb;position:relative}
.map iframe{width:100%;height:100%;border:0}
.bottom-bar{background:#0a0a0a;border-top:1px solid #1f1f1f;padding:8px 10px;display:flex;gap:8px}
.bottom-item{flex:1;text-align:center}
.bottom-item label{display:block;font-size:5.5px;font-weight:800;letter-spacing:.6px;color:#9ca3af;margin-bottom:2px}
.bottom-item b{display:block;font-size:10px;font-weight:900;color:#fff;line-height:1}
.bottom-item small{display:block;font-size:6px;font-weight:700;color:#6b7280;margin-top:1px}
</style>
</head>
<body>
<div class="top">
<div>
<b id="fecha">LUN 12 MAY</b>
<span id="hora">--:--</span>
</div>
<div class="top-right"><span>●</span><span id="grados">--°</span></div>
</div>

<div class="map">
<iframe id="gmap" src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d3727!2d-101.184!3d21.122!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1ses!2smx!4v123" allowfullscreen loading="lazy"></iframe>
</div>

<div class="bottom-bar">
<div class="bottom-item"><label>DISTANCIA</label><b id="dist">0.0 km</b><small id="tmin">0 min</small></div>
<div class="bottom-item"><label>KILOMETRAJE</label><b id="km">0.0</b><small>km total</small></div>
<div class="bottom-item"><label>VALOR SERVICIO</label><b id="valor" style="color:#10b981">$0</b><small>sugerido</small></div>
</div>

<script>
function tick(){ let d=new Date(); document.getElementById('fecha').innerText=d.toLocaleDateString('es-MX',{weekday:'short',day:'2-digit',month:'short'}).toUpperCase(); document.getElementById('hora').innerText=d.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'}); }
setInterval(tick,1000); tick();
async function clima(){
  try{
    if(navigator.geolocation){
      navigator.geolocation.getCurrentPosition(async p=>{
        let lat=p.coords.latitude, lon=p.coords.longitude;
        document.getElementById('gmap').src=`https://www.google.com/maps?q=${lat},${lon}&z=16&output=embed`;
        let r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m`);
        let j=await r.json(); document.getElementById('grados').innerText=Math.round(j.current.temperature_2m)+'°';
      });
    }else{ document.getElementById('grados').innerText='24°'; }
  }catch(e){ document.getElementById('grados').innerText='24°'; }
}
clima();
</script>
</body>
</html>
